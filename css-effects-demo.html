<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern CSS Effects Demo - Chain Breaker Pro</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .demo-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .demo-ring {
            width: 200px;
            height: 200px;
            border: 8px solid;
            border-image: var(--cosmic-gradient) 1;
            border-radius: 50%;
            position: relative;
            animation: ring-pulse 2s ease-in-out infinite;
        }

        .demo-controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="demo-container">
        <h1 style="color: white; font-family: Inter, sans-serif; text-align: center; margin-bottom: 30px;">
            Modern CSS Effects Demo
        </h1>

        <!-- Demo Ring -->
        <div class="demo-ring" id="demoRing"></div>

        <!-- Demo Controls -->
        <div class="demo-controls">
            <button class="menu-button" onclick="showScorePopup()">Score +100</button>
            <button class="menu-button" onclick="showComboEffect()">Combo x5</button>
            <button class="menu-button" onclick="showLevelUp()">Level Up</button>
            <button class="menu-button" onclick="toggleFeverMode()">Fever Mode</button>
        </div>

        <div style="color: white; text-align: center; margin-top: 20px; font-family: Inter, sans-serif;">
            <p>🎮 Modern CSS Features Used:</p>
            <p>@property animations • Conic gradients • Advanced selectors • Modern typography</p>
        </div>
    </div>

    <script>
        // Demo functions to show CSS effects
        function showScorePopup() {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = '+100';
            popup.style.left = '50%';
            popup.style.top = '40%';
            document.body.appendChild(popup);

            setTimeout(() => popup.remove(), 1000);
        }

        function showComboEffect() {
            const combo = document.createElement('div');
            combo.className = 'combo-effect';
            combo.textContent = 'COMBO x5!';
            document.body.appendChild(combo);

            setTimeout(() => combo.remove(), 800);
        }

        function showLevelUp() {
            const levelUp = document.createElement('div');
            levelUp.className = 'level-up';
            levelUp.textContent = 'LEVEL UP!';
            document.body.appendChild(levelUp);

            setTimeout(() => levelUp.remove(), 2000);
        }

        let feverActive = false;
        function toggleFeverMode() {
            if (feverActive) {
                document.querySelector('.fever-mode')?.remove();
                feverActive = false;
            } else {
                const fever = document.createElement('div');
                fever.className = 'fever-mode';
                document.body.appendChild(fever);
                feverActive = true;

                setTimeout(() => {
                    fever.remove();
                    feverActive = false;
                }, 3000);
            }
        }

        // Add particle effects
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'css-particle';
            particle.style.left = Math.random() * window.innerWidth + 'px';
            particle.style.top = window.innerHeight + 'px';
            document.body.appendChild(particle);

            setTimeout(() => particle.remove(), 3000);
        }

        // Create particles every 500ms
        setInterval(createParticle, 500);
    </script>
</body>

</html>
