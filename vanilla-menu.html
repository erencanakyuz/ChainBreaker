<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chain Breaker - Vanilla Canvas Edition</title>

    <!-- Performance Optimizations -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">

    <!-- Component Styles -->
    <link rel="preload" href="css/components/animations.css?v=3.0" as="style"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="css/components/animations.css?v=3.0">
    </noscript>
    <link rel="preload" href="css/components/pluto.css?v=3.0" as="style"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="css/components/pluto.css?v=3.0">
    </noscript>

    <!-- Responsive System -->
    <link rel="preload" href="css/responsive-unified.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="css/responsive-unified.css">
    </noscript>

    <!-- Optimized Font Loading -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" as="style"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    </noscript>

    <style>
        /* Canvas Viewport Fix */
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
            user-select: none;
            background: #000;
            font-family: 'Orbitron', Arial, sans-serif;
        }

        /* Game Canvas */
        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #1e3c72 0%, #2a5298 50%, #0f0f23 100%);
            cursor: pointer;
        }

        /* UI Overlay */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        .ui-text {
            position: absolute;
            color: #ffffff;
            font-family: 'Orbitron', Arial, sans-serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        /* Game Title */
        .game-title {
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Score UI */
        .score-text {
            top: 20px;
            left: 20px;
            font-size: 24px;
        }

        .level-text {
            top: 50px;
            left: 20px;
            font-size: 20px;
        }

        .lives-text {
            top: 80px;
            left: 20px;
            font-size: 20px;
        }

        .combo-text {
            top: 110px;
            left: 20px;
            font-size: 18px;
        }

        .fever-text {
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            color: #ff6b6b;
            text-align: center;
        }

        /* Popup Effects */
        .score-popup,
        .combo-effect,
        .level-up {
            position: fixed;
            pointer-events: none;
            font-family: 'Orbitron', Arial, sans-serif;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 200;
            animation: popupFade 800ms ease-out forwards;
        }

        .score-popup {
            font-size: 24px;
            color: #00ff00;
        }

        .combo-effect {
            font-size: 32px;
            color: #ffaa00;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .level-up {
            font-size: 48px;
            color: #ff5555;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes popupFade {
            0% {
                opacity: 1;
                transform: translateY(0px) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.2);
            }
        }

        /* Menu Buttons */
        .menu-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 150;
            pointer-events: auto;
        }

        .mode-button {
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid #00aaff;
            border-radius: 15px;
            padding: 15px 30px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 500px;
            text-align: left;
            color: #ffffff;
            font-family: 'Orbitron', Arial, sans-serif;
        }

        .mode-button:hover {
            background: rgba(0, 0, 0, 0.4);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.3);
        }

        .mode-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .mode-theme {
            font-size: 12px;
            color: #cccccc;
            opacity: 0.9;
        }

        .difficulty {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #00aaff;
        }

        /* Game Over Screen */
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 48px;
            color: #ff6b6b;
            font-weight: bold;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
            z-index: 200;
            pointer-events: auto;
            cursor: pointer;
            display: none;
        }

        /* RING SPAWNING ANIMATIONS - Teker teker dışa doğru doğma */
        @keyframes ringSpawn {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }

            50% {
                transform: scale(0.8) rotate(180deg);
                opacity: 0.7;
            }

            100% {
                transform: scale(1) rotate(360deg);
                opacity: 1;
            }
        }

        @keyframes ringGlow {
            0% {
                box-shadow: 0 0 10px currentColor;
            }

            50% {
                box-shadow: 0 0 30px currentColor, 0 0 50px currentColor;
            }

            100% {
                box-shadow: 0 0 15px currentColor;
            }
        }

        /* Ring spawn effect sınıfı */
        .ring-spawning {
            animation: ringSpawn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards,
                ringGlow 0.8s ease-in-out forwards;
        }

        /* 🎛️ EFFECTS CONTROL PANEL - Using separate file */

        /* Mobile Optimizations */
        @media screen and (max-width: 768px) {
            .effects-control-panel {
                width: 250px;
                font-size: 10px;
            }

            .game-title {
                font-size: 2.5em;
                top: 40px;
            }

            .score-popup {
                font-size: 20px;
            }

            .combo-effect {
                font-size: 28px;
            }

            .level-up {
                font-size: 36px;
            }

            .mode-button {
                width: 90vw;
                padding: 12px 20px;
            }

            .mode-name {
                font-size: 18px;
            }
        }

        @media screen and (max-width: 480px) {
            .game-title {
                font-size: 2em;
                top: 30px;
            }

            .score-popup {
                font-size: 18px;
            }

            .combo-effect {
                font-size: 24px;
            }

            .level-up {
                font-size: 30px;
            }

            .mode-name {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div class="ui-overlay">
        <!-- Game Title -->
        <div class="ui-text game-title" id="gameTitle" style="display: none;">CHAIN BREAKER</div>

        <!-- Score UI -->
        <div class="ui-text score-text" id="scoreText">Score: 0</div>
        <div class="ui-text level-text" id="levelText">Level: 1</div>
        <div class="ui-text lives-text" id="livesText">Lives: 3</div>
        <div class="ui-text combo-text" id="comboText">Combo: 0</div>
        <div class="ui-text fever-text" id="feverText"></div>
    </div>

    <!-- Menu Container -->
    <div class="menu-container" id="menuContainer">
        <!-- Menu buttons will be created dynamically -->
    </div>

    <!-- Game Over Screen -->
    <div class="game-over" id="gameOverScreen">
        <div id="gameOverText">GAME OVER</div>
        <div style="font-size: 24px; margin-top: 20px;">Click to Restart</div>
    </div>

    <!-- Vanilla Game Engine -->
    <!-- 🎛️ EFFECTS CONTROL PANEL - Include separate file -->
    <iframe src="effects-control-panel.html" style="position: fixed; top: 10px; right: 10px; width: 320px; height: 90vh; 
                   border: none; z-index: 1000; background: transparent; pointer-events: all;"
        id="effectsControlFrame"></iframe>

    <script>
        // 🎛️ EFFECTS CONTROL PANEL - Basic settings fallback
        window.EffectsSettings = window.EffectsSettings || {
            shake: { enabled: true, intensity: 8, duration: 200 },
            fragments: { enabled: true, count: 80 },
            sparkles: { enabled: true, count: 20 },
            ringFragments: { enabled: true, count: 6 },
            perfectHit: { enabled: true, threshold: 90, particles: 30 },
            breaking: { enabled: true, duration: 400, multiStage: true },
            advanced: { debugMode: false }
        };

        let panelCollapsed = false;
        function togglePanel() {
            const panel = document.getElementById('effectsPanel');
            panelCollapsed = !panelCollapsed;
            panel.classList.toggle('collapsed', panelCollapsed);
        }

        function toggleEffect(effectType) {
            const settings = window.EffectsSettings[effectType];
            if (settings) {
                settings.enabled = !settings.enabled;
                const toggle = document.getElementById(`toggle${effectType.charAt(0).toUpperCase() + effectType.slice(1)}`);
                toggle.classList.toggle('active', settings.enabled);
                console.log(`🎛️ ${effectType}:`, settings.enabled ? 'ON' : 'OFF');
            }
        }

        function updateShakeIntensity(value) {
            window.EffectsSettings.shake.intensity = parseInt(value);
            console.log('🎛️ Shake intensity:', value);
        }

        function updateFragmentCount(value) {
            window.EffectsSettings.fragments.count = parseInt(value);
            console.log('🎛️ Fragment count:', value);
        }

        function updatePerfectThreshold(value) {
            window.EffectsSettings.perfectHit.threshold = parseInt(value);
            console.log('🎛️ Perfect hit threshold:', value + '%');
        }

        function updateBreakingDuration(value) {
            window.EffectsSettings.breaking.duration = parseInt(value);
            console.log('🎛️ Breaking duration:', value + 'ms');
        }

        // updateRippleCount - REMOVED (ripples disabled)

        function updateRingFragmentCount(value) {
            window.EffectsSettings.ringFragments.count = parseInt(value);
            console.log('🎛️ Ring fragment count:', value);
        }

        function toggleMultiStage() {
            window.EffectsSettings.breaking.multiStage = !window.EffectsSettings.breaking.multiStage;
            const toggle = document.getElementById('toggleMultiStage');
            toggle.classList.toggle('active', window.EffectsSettings.breaking.multiStage);
            console.log('🎛️ Multi-stage breaking:', window.EffectsSettings.breaking.multiStage ? 'ON' : 'OFF');
        }

        function setPreset(preset) {
            if (preset === 'minimal') {
                Object.keys(window.EffectsSettings).forEach(key => {
                    if (window.EffectsSettings[key].enabled !== undefined) {
                        window.EffectsSettings[key].enabled = false;
                        const toggle = document.getElementById(`toggle${key.charAt(0).toUpperCase() + key.slice(1)}`);
                        if (toggle) toggle.classList.remove('active');
                    }
                });
                // Only keep basic shake
                window.EffectsSettings.shake.enabled = true;
                document.getElementById('toggleShake').classList.add('active');
            } else if (preset === 'extreme') {
                Object.keys(window.EffectsSettings).forEach(key => {
                    if (window.EffectsSettings[key].enabled !== undefined) {
                        window.EffectsSettings[key].enabled = true;
                        const toggle = document.getElementById(`toggle${key.charAt(0).toUpperCase() + key.slice(1)}`);
                        if (toggle) toggle.classList.add('active');
                    }
                });
                // Boost values
                window.EffectsSettings.fragments.count = 150;
                window.EffectsSettings.sparkles.count = 40;
                document.getElementById('fragmentCount').value = 150;
            }
            console.log('🎛️ Preset applied:', preset);
        }

        function toggleDebugMode() {
            window.EffectsSettings.advanced.debugMode = !window.EffectsSettings.advanced.debugMode;
            console.log('🎛️ Debug mode:', window.EffectsSettings.advanced.debugMode ? 'ON' : 'OFF');
        }

        function testAllEffects() {
            console.log('🎛️ Testing all effects...');

            // Safe test: Break the outermost ring without affecting gameplay
            if (window.chainBreakerGame?.rings?.length > 0) {
                const game = window.chainBreakerGame;

                // Find the outermost ring (largest radius)
                let outermostRing = game.rings[0];
                for (let ring of game.rings) {
                    if (ring.radius > outermostRing.radius) {
                        outermostRing = ring;
                    }
                }

                // Create a copy for effects testing without breaking actual game
                const testRing = {
                    x: outermostRing.x,
                    y: outermostRing.y,
                    radius: outermostRing.radius,
                    thickness: outermostRing.thickness,
                    color: outermostRing.color
                };

                // Trigger only visual effects without game logic
                console.log('🎯 Testing effects on outermost ring');
                game.createShatterParticles?.(testRing);
                game.createRingFragments?.(testRing);
                game.triggerShake?.(15, 300); // Strong test shake

            } else {
                console.log('🎛️ No rings available for testing');
            }
        }

        function updateRingLimit(value) {
            console.log('🎛️ Ring limit updated:', value);
            // Update game constants if game exists
            if (window.chainBreakerGame) {
                window.chainBreakerGame.constants.MAX_RINGS = parseInt(value);
                console.log('🎯 New ring limit applied to current game');
            }
        }

        function breakOuterRing() {
            if (window.chainBreakerGame?.rings?.length > 0) {
                const game = window.chainBreakerGame;

                // Find the outermost ring (largest radius, not active ring)
                let outermostRing = null;
                let maxRadius = 0;

                for (let ring of game.rings) {
                    if (ring.radius > maxRadius && ring !== game.activeRing) {
                        maxRadius = ring.radius;
                        outermostRing = ring;
                    }
                }

                if (outermostRing) {
                    console.log('🎯 Breaking outermost ring safely');
                    // Remove from rings array
                    const index = game.rings.indexOf(outermostRing);
                    if (index > -1) {
                        game.rings.splice(index, 1);
                    }
                    // Trigger break animation
                    game.animateRingBreak(outermostRing);
                } else {
                    console.log('🎛️ No outer rings available to break (only active ring remains)');
                }
            } else {
                console.log('🎛️ No rings available');
            }
        }

        function addTestRing() {
            if (window.chainBreakerGame?.rings && window.chainBreakerGame.currentScene === 'game') {
                const game = window.chainBreakerGame;

                // Create a new ring beyond the outermost ring
                let maxRadius = game.constants.BASE_RADIUS;
                if (game.rings.length > 0) {
                    maxRadius = Math.max(...game.rings.map(r => r.radius));
                }

                const newRadius = maxRadius + game.constants.RING_THICKNESS + game.constants.RING_GAP;
                const colorIndex = game.rings.length % game.palettes[game.selectedMode.palette].length;
                const color = game.palettes[game.selectedMode.palette][colorIndex];

                const newRing = {
                    x: game.centerX,
                    y: game.centerY,
                    radius: newRadius,
                    thickness: game.constants.RING_THICKNESS,
                    color: color,
                    sweetSpotAngle: Math.random() * Math.PI * 2,
                    sweetSpotSize: game.selectedMode.sweetSpotSize,
                    alpha: 0,
                    inputReceived: false,
                    proximityEffect: false,
                    isSpawning: true,
                    spawnStartTime: performance.now(),
                    spawnDuration: 800
                };

                game.rings.push(newRing);
                console.log('🎯 Test ring added');
            } else {
                console.log('🎛️ Game not running or no rings array');
            }
        }

        // 🎯 DIŞ PANEL İÇİN GLOBAL FONKSİYONLAR
        // Bu fonksiyonları dış iframe erişebilsin diye global yapalım
        window.testAllEffects = testAllEffects;
        window.breakOuterRing = breakOuterRing;
        window.addTestRing = addTestRing;

        console.log('🎛️ Effects Control Panel ready!');
        console.log('🎛️ Settings:', window.EffectsSettings);

        // ====================
        // VANILLA GAME ENGINE
        // ====================

        class VanillaChainBreaker {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                // MOBILE-SAFE OPTIMIZATION: Context settings for all browsers
                this.ctx = this.canvas.getContext('2d', {
                    alpha: false,           // Disable transparency = faster rendering
                    desynchronized: true,   // Allow async rendering where supported
                    willReadFrequently: false // Force GPU acceleration
                });
                this.currentScene = 'menu';
                this.gameState = 'loading';
                this.lastTime = 0;
                this.deltaTime = 0;

                // Initialize canvas
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                // Device detection and adaptive constants
                this.setupAdaptiveConstants();

                // Color palettes
                this.setupColorPalettes();

                // Game objects
                this.rings = [];
                this.breakingRings = []; // Separate array for breaking rings
                this.particles = [];
                this.stars = [];
                this.needle = null;
                this.activeRing = null;

                // MOBILE-SAFE OPTIMIZATION: Memory pool for particles
                this.particlePool = this.createParticlePool(200); // Max 200 particles

                // Game state
                this.score = 0;
                this.level = 1;
                this.lives = 3;
                this.combo = 0;
                this.feverMode = false;
                this.feverTimer = 0;
                this.gameOverFlag = false;
                this.needleActive = false;
                this.regenTimer = null;
                this.regenDelay = 5000;
                this.originalNeedleSpeed = Math.PI; // 180 degrees per second
                this.lastInputTime = null;
                this.frameCount = 0;

                // UI elements
                this.ui = {
                    scoreText: document.getElementById('scoreText'),
                    levelText: document.getElementById('levelText'),
                    livesText: document.getElementById('livesText'),
                    comboText: document.getElementById('comboText'),
                    feverText: document.getElementById('feverText'),
                    gameTitle: document.getElementById('gameTitle'),
                    menuContainer: document.getElementById('menuContainer'),
                    gameOverScreen: document.getElementById('gameOverScreen')
                };

                // Input handling
                this.setupInput();

                // Initialize menu
                this.createMenuButtons();

                // Start game loop
                this.gameLoop();
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.width = this.canvas.width;
                this.height = this.canvas.height;
                this.centerX = this.width / 2;
                this.centerY = this.height / 2;
            }

            setupAdaptiveConstants() {
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
                const isSmallMobile = window.innerWidth <= 480;

                if (isSmallMobile) {
                    this.constants = {
                        BASE_RADIUS: 60,
                        RING_THICKNESS: 12,
                        RING_GAP: 8,
                        MAX_RINGS: 6, // 🎯 Mobile limit for visual performance only
                        INITIAL_RINGS: 4,
                        TARGET_FPS: 60
                    };
                } else if (isMobile) {
                    this.constants = {
                        BASE_RADIUS: 75,
                        RING_THICKNESS: 15,
                        RING_GAP: 10,
                        MAX_RINGS: 6, // 🎯 Mobile limit for visual performance only
                        INITIAL_RINGS: 5,
                        TARGET_FPS: 90
                    };
                } else {
                    this.constants = {
                        BASE_RADIUS: 100,
                        RING_THICKNESS: 20,
                        RING_GAP: 15,
                        MAX_RINGS: 8, // 🎯 Desktop limit for visual performance only
                        INITIAL_RINGS: 6,
                        TARGET_FPS: 144
                    };
                }
            }

            // MOBILE-SAFE OPTIMIZATION: Memory pool system for particles
            createParticlePool(size) {
                const pool = {
                    particles: [],
                    activeCount: 0,
                    maxSize: size
                };

                // Pre-create all particles
                for (let i = 0; i < size; i++) {
                    pool.particles[i] = {
                        x: 0, y: 0, vx: 0, vy: 0,
                        centerX: 0, centerY: 0,
                        life: 0, decay: 0.012,
                        color: '#ffffff',
                        size: 3,
                        isImploding: false,
                        isFlash: false,
                        active: false
                    };
                }

                return pool;
            }

            getPooledParticle(config) {
                const pool = this.particlePool;

                // Find inactive particle
                for (let i = 0; i < pool.maxSize; i++) {
                    if (!pool.particles[i].active) {
                        const p = pool.particles[i];

                        // Reset particle with new config
                        Object.assign(p, config);
                        p.active = true;

                        // Add to active particles list
                        if (!this.particles.includes(p)) {
                            this.particles.push(p);
                        }

                        return p;
                    }
                }

                return null; // Pool full
            }

            recycleParticle(particle) {
                particle.active = false;
                particle.life = 0;
            }

            setupColorPalettes() {
                this.palettes = {
                    neon: ['#4ECDC4', '#45B7D1', '#96CEB4', '#FECA57', '#FF6B6B', '#A8E6CF', '#74B9FF', '#FD79A8'],
                    sunset: ['#FF6B9D', '#F38BA8', '#E8B4CB', '#C8A2C8', '#FDCB6E', '#E17055', '#F39C12', '#E67E22'],
                    ocean: ['#74B9FF', '#0984E3', '#6C5CE7', '#A29BFE', '#00B894', '#00CEC9', '#55EFC4', '#81ECEC'],
                    fire: ['#E17055', '#FDCB6E', '#F39C12', '#E67E22', '#D63031', '#FF7675', '#FD79A8', '#FDCB6E'],
                    cosmic: ['#6C5CE7', '#A29BFE', '#FD79A8', '#FDCB6E', '#74B9FF', '#00B894', '#FF6B9D', '#FECA57'],
                    aurora: ['#00CEC9', '#55EFC4', '#81ECEC', '#74B9FF', '#A29BFE', '#6C5CE7', '#FD79A8', '#FDCB6E']
                };

                this.modeDesigns = [
                    {
                        name: "Bubble Pop",
                        theme: "Gentle bubbles and smooth precision",
                        palette: 'neon',
                        sweetSpotSize: 15,
                        needleSpeed: 1,
                        ringMovement: false
                    },
                    {
                        name: "Cotton Candy",
                        theme: "Sweet pastels with swift motions",
                        palette: 'sunset',
                        sweetSpotSize: 15,
                        needleSpeed: 1.3,
                        ringMovement: false
                    },
                    {
                        name: "Ocean Waves",
                        theme: "Flowing blues with dancing targets",
                        palette: 'ocean',
                        sweetSpotSize: 15,
                        needleSpeed: 1.2,
                        ringMovement: true,
                        ringSpeed: 0.0005
                    },
                    {
                        name: "Golden Sunset",
                        theme: "Warm golds with precise timing",
                        palette: 'fire',
                        sweetSpotSize: 10,
                        needleSpeed: 1.3,
                        ringMovement: true,
                        ringSpeed: 0.0007
                    },
                    {

                const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
                const isSmallScreen = window.innerWidth <= 480;
                const isTabletScreen = window.innerWidth >= 768 && window.innerWidth <= 1024;

                // Prioritize user agent over screen size for better input detection
                if (isMobileUA || (isTouchDevice && isSmallScreen)) return 'mobile';
                if (isTouchDevice && isTabletScreen) return 'tablet';
                if (!isTouchDevice && !isMobileUA) return 'desktop';

            handleGameClick() {
                const now = performance.now();
                const deviceType = this.getDeviceType();

                // MOBILE-SAFE OPTIMIZATION: Adaptive input debouncing
                const debounceTime = deviceType === 'mobile' ? 25 : 8; // Mobile needs more debouncing

                if (this.lastInputTime && now - this.lastInputTime < debounceTime) {
                    return;
                }

                // Tıklamanın mümkün olup olmadığını en başta kontrol et (daha temiz mantık)
                if (!this.activeRing || !this.needleActive || this.activeRing.inputReceived) {
                    return;
                }

                this.lastInputTime = now;

                // ULTRA BÜYÜK: Collision threshold'u çok daha büyük yap - desktop için
                // Görsel çok büyük göründüğü için collision'ı da ona uygun yapmalıyız
                const baseThreshold = (this.activeRing.sweetSpotSize * Math.PI / 180) / 2;
                const threshold = baseThreshold * 2.5; // %150 büyütme - çok daha kolay vurmak için

                // Yüksek hassasiyetli açı farkı hesaplaması
                let angleDiff = this.needle.angle - this.activeRing.sweetSpotAngle;
                while (angleDiff <= -Math.PI) angleDiff += 2 * Math.PI;
                while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;

                // Collision detection
                const absAngleDiff = Math.abs(angleDiff);
                const isHit = absAngleDiff <= threshold;



                if (isHit) {
                    this.activeRing.inputReceived = true;

                    // 🎯 PRECISION-BASED IMPACT - Better hit = bigger effect
                    const precision = 1 - (absAngleDiff / threshold);
                    const baseIntensity = 8 + (precision * 12); // 8-20 arası
                    const duration = 150 + (precision * 100); // 150-250ms arası

                    this.triggerShake(baseIntensity, duration);
                    this.animateRingBreak(this.activeRing);
                    this.handleSuccessfulHit();
                    this.resetRegenTimer();

                    // 🎊 PRECISION FEEDBACK - Perfect hit bonus effects
                    const perfectThreshold = (window.EffectsSettings?.perfectHit?.threshold || 90) / 100;
                    if (precision > perfectThreshold) {
                        this.createPerfectHitEffect(this.activeRing);
                    }

                } else {
                    this.handleMiss();
                }
            }

                    return `#${Math.min(255, Math.floor(r * factor)).toString(16).padStart(2, '0')}${Math.min(255, Math.floor(g * factor)).toString(16).padStart(2, '0')}${Math.min(255, Math.floor(b * factor)).toString(16).padStart(2, '0')}`;

            // FIXED: Ultra-precise needle drawing with exact collision feedback
            drawNeedle() {
                const ctx = this.ctx;

                // Only draw needle if it's active
                if (!this.needleActive) return;

                const needleX = this.centerX + Math.cos(this.needle.angle) * this.needle.radius;
                const needleY = this.centerY + Math.sin(this.needle.angle) * this.needle.radius;

                // EXACT: Use identical collision logic for visual feedback
                const needleAngle = this.needle.angle;
                const sweetSpotAngle = this.activeRing.sweetSpotAngle;

                // Calculate angle difference with proper wrapping (same as handleGameClick)
                let angleDiff = needleAngle - sweetSpotAngle;
                while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                const absAngleDiff = Math.abs(angleDiff);

                // HASSAS: Çarpışma mantığıyla birebir aynı hesaplama
                const baseThreshold = (this.activeRing.sweetSpotSize * Math.PI / 180) / 2;
                const threshold = baseThreshold * 2.5; // Görsel ile aynı %150 büyütme
                const inSweetSpot = absAngleDiff <= threshold;

                ctx.save();
                // Parlaklık azaltılmış görsel geri bildirim
                if (inSweetSpot) {
                    const precision = 1 - (absAngleDiff / threshold);
                    if (precision > 0.9) {
                        ctx.fillStyle = '#00cc00'; // Daha az parlak yeşil
                        ctx.shadowColor = '#00cc00';
                        ctx.shadowBlur = 4; // Daha az parlaklık
                    } else if (precision > 0.7) {
                        ctx.fillStyle = '#cccc00'; // Daha az parlak sarı
                    } else {
                        ctx.fillStyle = '#cccccc'; // Daha az parlak beyaz
                    }
                } else {
                    ctx.fillStyle = '#cc0000'; // Daha az parlak kırmızı
                }

                // Needle circle
                ctx.beginPath();
                ctx.arc(needleX, needleY, 6, 0, Math.PI * 2);
                ctx.fill();

                // Reset shadow
                ctx.shadowBlur = 0;

                // Needle line
                ctx.strokeStyle = ctx.fillStyle; // Match fill color
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(needleX, needleY);
                ctx.lineTo(needleX + Math.cos(this.needle.angle + Math.PI) * 25,
                    needleY + Math.sin(this.needle.angle + Math.PI) * 25);
                ctx.stroke();

                ctx.restore();
            }

            activateFeverMode() {
                this.feverMode = true;
                this.feverTimer = 5000; // 5 seconds
                this.ui.feverText.textContent = 'FEVER MODE: 5s';
            }

            levelUp() {
                this.level++;
                this.showLevelUpEffect();

                // Bonus life every 3 levels
                if (this.level % 3 === 0) {
                    this.lives = Math.min(this.lives + 1, 5);
                }

                setTimeout(() => {
                    this.startLevel();
                }, 1000);

                this.updateUI();
            }

            gameOver() {
                this.gameOverFlag = true;
                this.ui.gameOverScreen.style.display = 'block';
                document.getElementById('gameOverText').innerHTML = `
          GAME OVER<br>
          <div style="font-size: 24px; margin: 10px 0;">Score: ${this.score}</div>
          <div style="font-size: 24px; margin: 10px 0;">Level: ${this.level}</div>
        `;
            }

            resetGame() {
                this.gameOverFlag = false;
                this.ui.gameOverScreen.style.display = 'none';
                this.currentScene = 'menu';
                this.ui.menuContainer.style.display = 'block';
                this.ui.gameTitle.style.display = 'block';
                this.resetGameState();
            }

            createParticles(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 1,
                        decay: 0.02,
                        color: color,
                        size: Math.random() * 4 + 2
                    });
                }
            }

            showScorePopup(points, x, y) {
                const popup = document.createElement('div');
                popup.className = 'score-popup';
                popup.textContent = '+' + points;
                popup.style.left = x + 'px';
                popup.style.top = y + 'px';
                document.body.appendChild(popup);

                setTimeout(() => {
                    if (popup.parentNode) popup.remove();
                }, 800);
            }

            showLevelUpEffect() {
                const effect = document.createElement('div');
                effect.className = 'level-up';
                effect.textContent = 'LEVEL UP!';
                document.body.appendChild(effect);

                setTimeout(() => {
                    if (effect.parentNode) effect.remove();
                }, 2000);
            }

            showComboEffect() {
                const effect = document.createElement('div');
                effect.className = 'combo-effect';
                effect.textContent = `COMBO x${this.combo}!`;
                document.body.appendChild(effect);

                setTimeout(() => {
                    if (effect.parentNode) effect.remove();
                }, 600);
            }

            updateUI() {
                this.ui.scoreText.textContent = 'Score: ' + this.score;
                this.ui.levelText.textContent = 'Level: ' + this.level;
                this.ui.livesText.textContent = 'Lives: ' + this.lives;
                this.ui.comboText.textContent = 'Combo: ' + this.combo;

                // FPS göstergesi - sadece fever mode için
                if (this.feverMode) {
                    this.ui.feverText.textContent = `FEVER MODE: ${Math.ceil(this.feverTimer / 1000)}s`;
                } else if (this.ui.feverText.textContent.includes('FEVER')) {
                    this.ui.feverText.textContent = '';
                }
            }

            update(deltaTime) {
                if (this.currentScene !== 'game' || this.gameOverFlag) return;

                // Performance optimized frame counter
                if (!this.frameCount) this.frameCount = 0;
                this.performanceMetrics.frameCount++;

                // OPTIMIZED: Sadece gerekli güncellemeler

                // Fever mode - her frame gerekli
                if (this.feverMode) {
                    this.feverTimer -= deltaTime * 1000;
                    if (this.feverTimer <= 0) {
                        this.feverMode = false;
                        this.ui.feverText.textContent = '';
                    }
                }

                // Pluto mood - sadece her 12 frame'de (performance)
                if (this.frameCount % 12 === 0) {
                    this.updatePlutoMood(deltaTime);
                }

                // 🎆 ENHANCED PARTICLE SYSTEM - Advanced physics and effects
                this.particles = this.particles.filter(p => {
                    if (!p.active) return false;

                    // 🌟 Effect-specific behavior
                    switch (p.effectType) {
                        case 'fragment':
                            // Physics simulation for fragments
                            if (p.gravity) p.vy += p.gravity * deltaTime * 60;
                            if (p.rotation !== undefined) {
                                p.rotation += p.rotationSpeed * deltaTime * 60;
                            }
                            break;

                        case 'xpFragment':
                            // XP-style movement: smooth acceleration toward center
                            const toCenter = {
                                x: p.centerX - p.x,
                                y: p.centerY - p.y
                            };
                            const distance = Math.sqrt(toCenter.x * toCenter.x + toCenter.y * toCenter.y);

                            if (distance > 3) {
                                const pullForce = 2 + (1 - p.life) * 3; // Güçlü çekim
                                const normalizedX = toCenter.x / distance;
                                const normalizedY = toCenter.y / distance;

                                p.vx += normalizedX * pullForce * deltaTime * 60;
                                p.vy += normalizedY * pullForce * deltaTime * 60;

                                // Speed limit for smooth motion
                                const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                                if (speed > 8) {
                                    p.vx = (p.vx / speed) * 8;
                                    p.vy = (p.vy / speed) * 8;
                                }
                            }
                            break;

                        case 'energyBurst':
                            // Energy bursts slow down over time
                            p.vx *= 0.98;
                            p.vy *= 0.98;
                            break;

                        case 'sparkle':
                            // Sparkles twinkle - REMOVED
                            break;

                        case 'perfectHit':
                            // Perfect hit particles - SIMPLIFIED
                            p.vx *= 0.95;
                            p.vy *= 0.95;
                            break;

                        case 'dissolveSparkle':
                            // Dissolve sparkles float upward
                            p.vy -= 0.5;
                            if (p.twinkle) {
                                p.twinklePhase = (p.twinklePhase || 0) + deltaTime * 6;
                                p.currentAlpha = p.life * (0.5 + Math.sin(p.twinklePhase) * 0.5);
                            }
                            break;
                    }

                    if (!p.isFlash) {
                        // Advanced imploding behavior
                        if (p.isImploding && p.life > 0.1) {
                            const toCenter = {
                                x: p.centerX - p.x,
                                y: p.centerY - p.y
                            };
                            const distance = Math.sqrt(toCenter.x * toCenter.x + toCenter.y * toCenter.y);

                            if (distance > 5) {
                                const pullForce = 1 + (1 - p.life) * 2; // Stronger pull over time
                                const normalizedX = toCenter.x / distance;
                                const normalizedY = toCenter.y / distance;

                                p.vx += normalizedX * pullForce * deltaTime * 60;
                                p.vy += normalizedY * pullForce * deltaTime * 60;
                            }
                        }

                        // Update position
                        p.x += p.vx * deltaTime * 60;
                        p.y += p.vy * deltaTime * 60;
                        p.life -= p.decay;
                    }

                    // Recycle dead particles
                    if (p.life <= 0) {
                        this.recycleParticle(p);
                        return false;
                    }

                    return true;
                });

                // 🧩 RING FRAGMENTS UPDATE
                if (this.ringFragments) {
                    this.ringFragments = this.ringFragments.filter(f => {
                        f.x += f.vx * deltaTime * 60;
                        f.y += f.vy * deltaTime * 60;
                        f.rotation += f.rotationSpeed * deltaTime * 60;
                        f.life -= f.decay;
                        return f.life > 0;
                    });
                }

                // 🎨 CREATIVE BREAK ANIMATIONS UPDATE
                if (this.breakingRings) {
                    this.breakingRings = this.breakingRings.filter(ring => {
                        if (!ring.isBreaking) return false;

                        const currentTime = performance.now();
                        const progress = (currentTime - ring.breakStartTime) / ring.breakDuration;

                        // Update dissolve animation
                        if (ring.breakPhase === 'dissolve') {
                            ring.dissolveProgress = progress;
                            ring.alpha = 1 - progress;
                        }

                        // Remove completed break animations
                        if (progress >= 1) {
                            const index = this.rings.indexOf(ring);
                            if (index > -1) this.rings.splice(index, 1);
                            return false;
                        }

                        return true;
                    });
                }


                // 🔄 PERSPECTIVE SHIFT UPDATE - Simplified
                if (this.perspectiveShift) {
                    this.perspectiveShift.x *= 0.9; // Simple decay
                    this.perspectiveShift.y *= 0.9;
                    this.perspectiveShift.rotation *= 0.9;
                }

                // Stars - sadece her 6 frame'de (performance boost)
                if (this.frameCount % 6 === 0) {
                    this.stars.forEach(star => {
                        star.alpha += Math.sin(Date.now() * star.twinkleSpeed) * 0.01;
                        star.alpha = Math.max(0.2, Math.min(1, star.alpha));
                    });
                }

                this.frameCount = (this.frameCount + 1) % 24; // Bigger cycle for less computation
            }

            // 🌊 RIPPLE EFFECTS RENDERING - REMOVED
            // Ripple rendering has been removed from the game

            // 🧩 RING FRAGMENTS RENDERING - Large breaking pieces
            drawRingFragments() {
                if (!this.ringFragments || !this.ringFragments.length) return;

                const ctx = this.ctx;
                ctx.save();

                this.ringFragments.forEach(fragment => {
                    ctx.save();
                    ctx.translate(fragment.x, fragment.y);
                    ctx.rotate(fragment.rotation);

                    ctx.globalAlpha = fragment.life;
                    ctx.strokeStyle = fragment.color;
                    ctx.lineWidth = fragment.thickness;
                    ctx.shadowColor = fragment.color;
                    ctx.shadowBlur = 5;

                    // Draw fragment arc
                    ctx.beginPath();
                    ctx.arc(0, 0, fragment.radius, fragment.startAngle, fragment.endAngle);
                    ctx.stroke();

                    ctx.restore();
                });

                ctx.restore();
            }

            // 🔄 PERSPECTIVE SHIFT APPLICATION - Simplified for stability
            applyPerspectiveShift() {
                // Skip complex transforms for now - causing render issues
                return;
            }

            // 🔄 PERSPECTIVE SHIFT RESET
            resetPerspectiveShift() {
                // Skip complex transforms for now
                return;
            }

            // 🎆 ADVANCED PARTICLE RENDERING - Effect-specific drawing
            drawAdvancedParticles(particles) {
                if (!particles.length) return;

                const ctx = this.ctx;
                ctx.save();

                // Group particles by effect type for optimized rendering
                const effectGroups = {};
                particles.forEach(p => {
                    const effectType = p.effectType || 'default';
                    if (!effectGroups[effectType]) {
                        effectGroups[effectType] = [];
                    }
                    effectGroups[effectType].push(p);
                });

                // Render each effect type differently
                Object.entries(effectGroups).forEach(([effectType, effectParticles]) => {
                    switch (effectType) {
                        case 'fragment':
                            this.drawFragmentParticles(effectParticles);
                            break;
                        case 'xpFragment':
                            this.drawXPFragmentParticles(effectParticles);
                            break;
                        case 'energyBurst':
                            this.drawEnergyBurstParticles(effectParticles);
                            break;
                        case 'sparkle':
                            // Sparkles REMOVED
                            break;
                        case 'perfectHit':
                            // Perfect hit SIMPLIFIED
                            break;
                        case 'shockwave':
                            this.drawShockwaveParticles(effectParticles);
                            break;
                        default:
                            this.drawDefaultParticles(effectParticles);
                            break;
                    }
                });

                ctx.restore();
            }

            // 🔥 FRAGMENT PARTICLES - Rotating debris with physics
            drawFragmentParticles(particles) {
                const ctx = this.ctx;

                particles.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    if (p.rotation !== undefined) {
                        ctx.rotate(p.rotation);
                    }

                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 3;

                    // Draw as rotated rectangle
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);

                    ctx.restore();
                });
            }

            // ⭐ XP FRAGMENT PARTICLES - Smooth circular particles moving to center
            drawXPFragmentParticles(particles) {
                const ctx = this.ctx;

                particles.forEach(p => {
                    ctx.save();

                    ctx.globalAlpha = p.life;

                    // Glowing XP orb effect
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 1.5);
                    gradient.addColorStop(0, p.color);
                    gradient.addColorStop(0.7, p.color + '80'); // Semi-transparent
                    gradient.addColorStop(1, 'transparent');

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner bright core
                    ctx.fillStyle = '#FFFFFF';
                    ctx.globalAlpha = p.life * 0.8;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                });
            }

            // ⚡ ENERGY BURST PARTICLES - Glowing trails
            drawEnergyBurstParticles(particles) {
                const ctx = this.ctx;

                particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.life;

                    // Create glowing effect
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    gradient.addColorStop(0, p.color);
                    gradient.addColorStop(0.7, p.color + '80'); // Semi-transparent
                    gradient.addColorStop(1, 'transparent');

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                });
            }

            // ✨ SPARKLE PARTICLES - Twinkling effects
            drawSparkleParticles(particles) {
                const ctx = this.ctx;

                particles.forEach(p => {
                    ctx.save();

                    const alpha = p.currentAlpha !== undefined ? p.currentAlpha : p.life;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 6;

                    // Draw sparkle as diamond shape
                    ctx.translate(p.x, p.y);
                    ctx.rotate(Math.PI / 4);
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);

                    ctx.restore();
                });
            }

            // 🌟 PERFECT HIT PARTICLES - Golden celebration
            drawPerfectHitParticles(particles) {
                const ctx = this.ctx;

                particles.forEach(p => {
                    ctx.save();

                    const alpha = p.currentAlpha !== undefined ? p.currentAlpha : p.life;
                    ctx.globalAlpha = alpha;

                    // Golden glow effect
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2);
                    gradient.addColorStop(0, '#FFD700');
                    gradient.addColorStop(0.5, '#FFA500');
                    gradient.addColorStop(1, 'transparent');

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 1.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Core sparkle
                    ctx.fillStyle = '#FFFFFF';
                    ctx.shadowColor = '#FFD700';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                });
            }

            // 💥 SHOCKWAVE PARTICLES - Expanding blast
            drawShockwaveParticles(particles) {
                const ctx = this.ctx;

                particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 4;

                    // Stretched particle for motion blur effect
                    const stretchFactor = Math.sqrt(p.vx * p.vx + p.vy * p.vy) * 0.5;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(Math.atan2(p.vy, p.vx));
                    ctx.fillRect(-stretchFactor, -p.size / 2, p.size + stretchFactor, p.size);

                    ctx.restore();
                });
            }

            // 🎨 DEFAULT PARTICLES - Standard rendering
            drawDefaultParticles(particles) {
                const ctx = this.ctx;

                // Flash particles
                const flashParticles = particles.filter(p => p.isFlash);
                const normalParticles = particles.filter(p => !p.isFlash);

                // Draw flash particles
                flashParticles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.life;

                    if (p.effectType === 'perfectBurst') {
                        // Perfect hit burst - golden flash
                        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                        gradient.addColorStop(0, '#FFD700');
                        gradient.addColorStop(0.5, '#FFA500');
                        gradient.addColorStop(1, 'transparent');
                        ctx.fillStyle = gradient;
                    } else {
                        // Regular flash
                        ctx.fillStyle = `rgba(255, 255, 255, ${p.life * 0.5})`;
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Batch normal particles by color (existing optimization)
                const particlesByColor = {};
                normalParticles.forEach(p => {
                    if (!particlesByColor[p.color]) {
                        particlesByColor[p.color] = [];
                    }
                    particlesByColor[p.color].push(p);
                });

                Object.entries(particlesByColor).forEach(([color, colorParticles]) => {
                    ctx.fillStyle = color;
                    colorParticles.forEach(p => {
                        ctx.globalAlpha = p.life;
                        ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
                    });
                });

                ctx.globalAlpha = 1;
            }

            render() {
                // HIGH FPS OPTIMIZED RENDER
                this.ctx.save();

                // Set center coordinates for gradient
                this.centerX = this.width / 2;
                this.centerY = this.height / 2;

                // Shake effect - optimized calculation
                if (this.shakeIntensity > 0) {
                    const shakeX = (Math.random() - 0.5) * this.shakeIntensity;
                    const shakeY = (Math.random() - 0.5) * this.shakeIntensity;
                    this.ctx.translate(shakeX, shakeY);
                }

                // Beautiful gradient background from menu.html - EXACT COPY
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.width, this.height);

                // Canvas equivalent of Phaser's fillGradientStyle(0x0f0f23, 0x1a1a2e, 0x16213e, 0x0f3460, 1)
                const gradient = this.ctx.createLinearGradient(0, 0, this.width, this.height);
                gradient.addColorStop(0, '#0f0f23');    // 0x0f0f23 -> top-left
                gradient.addColorStop(0.33, '#1a1a2e'); // 0x1a1a2e -> top-right  
                gradient.addColorStop(0.66, '#16213e'); // 0x16213e -> bottom-left
                gradient.addColorStop(1, '#0f3460');    // 0x0f3460 -> bottom-right
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.width, this.height);

                // ULTRA-OPTIMIZED STARS: Sadece her 30 frame'de çizilir (performance korunur)
                if (!this.starUpdateCounter) this.starUpdateCounter = 0;
                if (this.starUpdateCounter % 30 === 0) {
                    this.drawOptimizedStars();
                }
                this.starUpdateCounter++;

                if (!this.isHighFpsMode) {
                    this.isHighFpsMode = true;
                }

                // Scene rendering
                if (this.currentScene === 'menu') {
                    this.renderMenu();
                } else if (this.currentScene === 'game') {
                    this.renderGameOptimized(); // Optimized version
                }

                this.ctx.restore();
            }

            // OPTIMIZED: Oyun render'ı - daha hızlı
            renderGameOptimized() {
                // Stars - basit çizim
                if (this.frameCount % 3 === 0) { // Her 3 frame'de star update
                    this.ctx.fillStyle = '#ffffff';
                    this.stars.forEach(star => {
                        this.ctx.globalAlpha = star.alpha * 0.3; // Daha hafif
                        this.ctx.fillRect(star.x - 1, star.y - 1, 2, 2); // Basit kare
                    });
                    this.ctx.globalAlpha = 1;
                }

                // 🎆 ENHANCED RENDERING SYSTEM - Multi-layered visual effects

                // 🌊 Ripple effects - REMOVED

                // 🔄 Apply perspective shift
                this.applyPerspectiveShift();

                // MOBILE-SAFE OPTIMIZATION: Batch ring drawing for better performance
                this.drawRingsBatched([...this.rings, ...this.breakingRings]);
                this.breakingRings = this.breakingRings.filter(r => (performance.now() - r.breakStartTime) < r.breakDuration);

                // 🧩 Ring fragments (separate from normal rings)
                this.drawRingFragments();

                // Needle - kritik çizim
                if (this.needle && this.activeRing && this.needleActive) {
                    this.drawNeedle();
                }

                // 🎆 ENHANCED PARTICLE SYSTEM - Advanced rendering
                this.drawAdvancedParticles(this.particles);

                // 🔄 Reset perspective shift
                this.resetPerspectiveShift();
            }

            renderMenu() {
                // Draw title stars
                this.stars.forEach(star => {
                    this.ctx.save();
                    this.ctx.globalAlpha = star.alpha;
                    this.ctx.fillStyle = '#00ffff';
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });
            }

            renderGame() {
                // Draw stars
                this.stars.forEach(star => {
                    this.ctx.save();
                    this.ctx.globalAlpha = star.alpha * 0.5;
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });

                // GÜNCELLE: Halkaları daha verimli çiz
                [...this.rings, ...this.breakingRings].forEach(ring => this.drawRing(ring));
                this.breakingRings = this.breakingRings.filter(r => (performance.now() - r.breakStartTime) < r.breakDuration);

                // Draw needle - FIXED: Only draw if needle is active
                if (this.needle && this.activeRing && this.needleActive) {
                    this.drawNeedle();
                }

                // GÜNCELLE: Flaş parçacığını farklı çiz
                this.particles.forEach(p => {
                    this.ctx.save();
                    this.ctx.globalAlpha = p.life;

                    // YENİ: Güçlü flaş patlaması efekti
                    if (p.isFlash) {
                        const flashSize = p.size * (1.2 - p.life * 0.2); // Büyüyerek başlasın
                        const grad = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, flashSize);
                        grad.addColorStop(0, `rgba(255, 255, 255, ${p.life * 0.9})`);
                        grad.addColorStop(0.5, `rgba(255, 255, 255, ${p.life * 0.4})`);
                        grad.addColorStop(1, 'transparent');
                        this.ctx.fillStyle = grad;
                        this.ctx.beginPath(); this.ctx.arc(p.x, p.y, flashSize, 0, Math.PI * 2); this.ctx.fill();
                    } else {
                        this.ctx.fillStyle = p.color;
                        this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); this.ctx.fill();
                    }
                    this.ctx.restore();
                });
            }

            // MOBILE-SAFE OPTIMIZATION: Batch particle drawing for better performance  
            drawParticlesBatched(particles) {
                if (!particles.length) return;

                const ctx = this.ctx;

                // Separate flash and normal particles
                const flashParticles = particles.filter(p => p.isFlash);
                const normalParticles = particles.filter(p => !p.isFlash);

                // Draw flash particles (can't batch these due to different sizes)
                flashParticles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.life * 0.5})`;
                    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                });

                // Batch normal particles by color
                const particlesByColor = {};
                normalParticles.forEach(p => {
                    if (!particlesByColor[p.color]) {
                        particlesByColor[p.color] = [];
                    }
                    particlesByColor[p.color].push(p);
                });

                // Draw each color group efficiently
                Object.entries(particlesByColor).forEach(([color, colorParticles]) => {
                    ctx.fillStyle = color;

                    // Group by similar alpha levels (every 0.1)
                    const alphaGroups = {};
                    colorParticles.forEach(p => {
                        const alphaKey = Math.floor(p.life * 10) / 10;
                        if (!alphaGroups[alphaKey]) {
                            alphaGroups[alphaKey] = [];
                        }
                        alphaGroups[alphaKey].push(p);
                    });

                    // Draw each alpha group in batch
                    Object.entries(alphaGroups).forEach(([alpha, alphaParticles]) => {
                        ctx.globalAlpha = parseFloat(alpha);
                        alphaParticles.forEach(p => {
                            ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
                        });
                    });
                });

                ctx.globalAlpha = 1;
            }

            // MOBILE-SAFE OPTIMIZATION: Batch drawing for better performance
            drawRingsBatched(rings) {
                if (!rings.length) return;

                const ctx = this.ctx;

                // Group rings by color for batching
                const ringsByColor = {};
                rings.forEach(ring => {
                    if (!ringsByColor[ring.color]) {
                        ringsByColor[ring.color] = [];
                    }
                    ringsByColor[ring.color].push(ring);
                });

                // Draw each color group in batch
                Object.entries(ringsByColor).forEach(([color, colorRings]) => {
                    ctx.save();
                    ctx.strokeStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 5;

                    // Draw all rings of same color in one path
                    colorRings.forEach(ring => {
                        let { x, y, radius, thickness, alpha } = ring;
                        let scale = ring.scale || 1;

                        // Spawn animation - ring doğarken
                        if (ring.isSpawning) {
                            // Doğma animasyonu sırasında ring'in merkezi sabit kalır, sadece boyutu değişir
                            radius *= scale;
                            thickness *= scale;

                            // Spawn rotation effect - dönme efekti
                            if (ring.spawnRotation) {
                                ctx.save();
                                ctx.translate(x, y);
                                ctx.rotate(ring.spawnRotation);
                                ctx.translate(-x, -y);
                            }
                        }

                        // 🎆 CREATIVE BREAKING ANIMATIONS
                        if (ring.isBreaking) {
                            const currentTime = performance.now();
                            const progress = (currentTime - ring.breakStartTime) / ring.breakDuration;

                            // ✨ Dissolve breaking animation - smooth sparkle fade
                            if (progress < 1 && ring.breakPhase === 'dissolve') {
                                ctx.save();

                                // Dissolving ring with sparkles
                                alpha = (1 - ring.dissolveProgress) * alpha;
                                for (let i = 0; i < 10; i++) {
                                    if (Math.random() > ring.dissolveProgress) {
                                        const angle = Math.random() * Math.PI * 2;
                                        const r = radius + (Math.random() - 0.5) * thickness;
                                        ctx.fillStyle = '#FFFFFF';
                                        ctx.fillRect(x + Math.cos(angle) * r - 1, y + Math.sin(angle) * r - 1, 2, 2);
                                    }
                                }

                                ctx.restore();
                            }
                        }

                        ctx.globalAlpha = alpha;
                        ctx.lineWidth = thickness;
                        ctx.beginPath();
                        ctx.arc(x, y, radius, 0, Math.PI * 2);
                        ctx.stroke();

                        // Spawn rotasyonu varsa restore et
                        if (ring.isSpawning && ring.spawnRotation) {
                            ctx.restore();
                        }

                        // Sweet spots - batch these too (spawn animasyonu sırasında da çiz)
                        if (!ring.isBreaking && (!ring.isSpawning || ring.alpha > 0.5)) {
                            const sweetSpotRad = (ring.sweetSpotSize * Math.PI / 180) / 2 * 2.5;
                            ctx.strokeStyle = '#ffffff';
                            ctx.shadowColor = '#ffffff';
                            ctx.shadowBlur = 8;
                            ctx.beginPath();
                            ctx.arc(x, y, radius, ring.sweetSpotAngle - sweetSpotRad, ring.sweetSpotAngle + sweetSpotRad);
                            ctx.stroke();
                            ctx.strokeStyle = color; // Reset color
                            ctx.shadowColor = color;
                            ctx.shadowBlur = 5;
                        }
                    });

                    ctx.restore();
                });
            }

            drawRing(ring) {
                const ctx = this.ctx;
                let { x, y, radius, thickness, color, alpha } = ring;

                // DEĞİŞTİ: Kırılma animasyonu artık daha patlayıcı
                if (ring.isBreaking) {
                    const progress = (performance.now() - ring.breakStartTime) / ring.breakDuration;
                    const easeOut = 1 - Math.pow(1 - progress, 4); // Daha keskin bir başlangıç
                    radius += easeOut * 10; // İçe değil, DIŞA doğru patlayarak genişlesin
                    alpha = 1 - progress; // Hızla kaybolsun
                    thickness *= (1 - progress);
                }

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = color;
                ctx.lineWidth = thickness;
                ctx.shadowColor = color;
                ctx.shadowBlur = 5; // Daha az parlaklık
                ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.stroke();

                // NORMAL SWEET SPOT: Sadece beyaz renkte, normal şekilde
                if (!ring.isBreaking) {
                    // Normal collision alanı - sadece rengi beyaz
                    const sweetSpotRad = (ring.sweetSpotSize * Math.PI / 180) / 2 * 2.5; // Aynı collision alanı

                    // Ana beyaz alan - Normal kalınlıkta, sadece beyaz renk
                    ctx.strokeStyle = '#ffffff'; // Beyaz renk
                    ctx.lineWidth = thickness; // Normal kalınlık
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 8; // Hafif glow
                    ctx.beginPath();
                    ctx.arc(x, y, radius, ring.sweetSpotAngle - sweetSpotRad, ring.sweetSpotAngle + sweetSpotRad);
                    ctx.stroke();
                }
                ctx.restore();
            }



            gameLoop(currentTime = 0) {
                // FPS ölçümü ve optimizasyon
                if (!this.fpsCounter) {
                    this.fpsCounter = {
                        frameCount: 0,
                        lastFpsTime: currentTime,
                        currentFps: 60,
                        frameHistory: [],
                        targetFps: 120 // Hedef FPS artırıldı
                    };
                }

                // FPS BOOST: Delta time'ı sınırla - çok yüksek FPS için
                this.deltaTime = Math.min((currentTime - this.lastTime) / 1000, 1 / 60); // Max 60fps delta
                this.lastTime = currentTime;

                // FPS hesapla
                this.fpsCounter.frameCount++;
                if (currentTime - this.fpsCounter.lastFpsTime >= 1000) {
                    this.fpsCounter.currentFps = Math.round(this.fpsCounter.frameCount * 1000 / (currentTime - this.fpsCounter.lastFpsTime));
                    this.fpsCounter.frameCount = 0;
                    this.fpsCounter.lastFpsTime = currentTime;


                }

                // TRIPLE UPDATE SYSTEM: Ultra responsive için 3 katmanlı güncelleme
                this.ultraFastUpdate(this.deltaTime); // En kritik: Input ve needle
                this.fastUpdate(this.deltaTime);      // Orta: Collision ve efektler  
                this.update(this.deltaTime);          // Normal: Diğer game logic
                this.render();

                // HIGH FPS REQUEST: Daha sık frame talep et
                requestAnimationFrame((time) => this.gameLoop(time));
            }

            // RING SPAWNING ANIMATION - Ring doğma animasyonlarını güncelle
            updateRingSpawning() {
                const currentTime = performance.now();

                this.rings.forEach(ring => {
                    if (ring.isSpawning && currentTime >= ring.spawnStartTime) {
                        // Spawn animasyonu ilerleme hesabı (0-1 arası)
                        const progress = Math.min(1, (currentTime - ring.spawnStartTime) / ring.spawnDuration);

                        // Easing function: cubic-bezier(0.68, -0.55, 0.265, 1.55) - bounce etkisi
                        const t = progress;
                        const easedProgress = t < 0.5
                            ? 4 * t * t * t
                            : 1 - Math.pow(-2 * t + 2, 3) / 2;

                        // Alpha ve scale animasyonu
                        ring.alpha = easedProgress;
                        ring.scale = 0.3 + (easedProgress * 0.7); // 0.3'ten 1.0'a scale

                        // Rotasyon efekti
                        ring.spawnRotation = easedProgress * Math.PI * 2; // 360 derece dönüş

                        // Spawn tamamlandığında
                        if (progress >= 1) {
                            ring.isSpawning = false;
                            ring.alpha = 1;
                            ring.scale = 1;
                            delete ring.spawnRotation;
                        }
                    }
                });
            }

            // YENİ: ULTRA FAST - En kritik işlemler
            ultraFastUpdate(deltaTime) {
                // RING SPAWNING - Her frame güncelle
                if (this.currentScene === 'game') {
                    this.updateRingSpawning();
                }

                // SADECE needle pozisyonu - her frame'de çalışır
                if (this.currentScene === 'game' && !this.gameOverFlag && this.needle && this.activeRing && this.needleActive) {
                    // Multiple needle updates for ultra smooth movement
                    const microDelta = deltaTime / 2; // Daha küçük adımlar
                    for (let i = 0; i < 2; i++) {
                        this.needle.angle += this.needle.speed * microDelta;
                        if (this.needle.angle > Math.PI * 2) {
                            this.needle.angle -= Math.PI * 2;
                        }
                    }
                }
            }

            // ULTRA-OPTIMIZED STARS: Performansı hiç etkilemeyen yıldız sistemi
            drawOptimizedStars() {
                // Lazy initialization - sadece bir kez hesapla
                if (!this.stars) {
                    this.stars = [];
                    for (let i = 0; i < 25; i++) { // Daha az yıldız ama görsel etki aynı
                        this.stars.push({
                            x: Math.random() * this.width,
                            y: Math.random() * this.height,
                            alpha: Math.random() * 0.5 + 0.3, // 0.3-0.8 arası
                            size: Math.random() * 2 + 1, // 1-3 pixel
                            twinkleSpeed: Math.random() * 0.02 + 0.01,
                            baseAlpha: Math.random() * 0.5 + 0.3
                        });
                    }
                }

                // Çok basit ve hızlı çizim - gradient yok, shadow yok
                this.ctx.save();
                this.stars.forEach(star => {
                    // Basit twinkle effect - sin hesabı değil, basit arithmetic
                    star.alpha = star.baseAlpha + Math.sin(Date.now() * star.twinkleSpeed) * 0.2;

                    // Ultra-simple drawing - sadece fillRect
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                    this.ctx.fillRect(star.x, star.y, star.size, star.size);
                });
                this.ctx.restore();
            }

            // YENİ: FAST - Orta öncelik işlemler
            fastUpdate(deltaTime) {
                // Collision detection ve immediate effects
                if (this.currentScene === 'game' && !this.gameOverFlag) {
                    // Titreme efektini hızlı güncelle
                    if (this.shakeDuration > 0) {
                        this.shakeDuration -= deltaTime * 1000;
                        if (this.shakeDuration <= 0) this.shakeIntensity = 0;
                    }

                    // Kritik parçacıkları hızlı güncelle (sadece flaş efektleri)
                    this.particles = this.particles.filter(p => {
                        if (p.isFlash) {
                            p.life -= p.decay * 2; // Flaş efektlerini daha hızlı güncelle
                        }
                        return p.life > 0;
                    });
                }
            }
        }

        // Initialize game when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            window.chainBreakerGame = new VanillaChainBreaker();
        });
    </script>
