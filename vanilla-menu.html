<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chain Breaker - Vanilla Canvas Edition</title>

    <!-- Performance Optimizations -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">

    <!-- Component Styles -->
    <link rel="preload" href="css/components/animations.css?v=3.0" as="style"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="css/components/animations.css?v=3.0">
    </noscript>
    <link rel="preload" href="css/components/pluto.css?v=3.0" as="style"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="css/components/pluto.css?v=3.0">
    </noscript>

    <!-- Responsive System -->
    <link rel="preload" href="css/responsive-unified.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="css/responsive-unified.css">
    </noscript>

    <!-- Optimized Font Loading -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" as="style"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    </noscript>

    <style>
        /* Canvas Viewport Fix */
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
            user-select: none;
            background: #000;
            font-family: 'Orbitron', Arial, sans-serif;
        }

        /* Game Canvas */
        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #1e3c72 0%, #2a5298 50%, #0f0f23 100%);
            cursor: pointer;
        }

        /* UI Overlay */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        .ui-text {
            position: absolute;
            color: #ffffff;
            font-family: 'Orbitron', Arial, sans-serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        /* Game Title */
        .game-title {
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Score UI */
        .score-text {
            top: 20px;
            left: 20px;
            font-size: 24px;
        }

        .level-text {
            top: 50px;
            left: 20px;
            font-size: 20px;
        }

        .lives-text {
            top: 80px;
            left: 20px;
            font-size: 20px;
        }

        .combo-text {
            top: 110px;
            left: 20px;
            font-size: 18px;
        }

        .fever-text {
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            color: #ff6b6b;
            text-align: center;
        }

        /* Popup Effects */
        .score-popup,
        .combo-effect,
        .level-up {
            position: fixed;
            pointer-events: none;
            font-family: 'Orbitron', Arial, sans-serif;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 200;
            animation: popupFade 800ms ease-out forwards;
        }

        .score-popup {
            font-size: 24px;
            color: #00ff00;
        }

        .combo-effect {
            font-size: 32px;
            color: #ffaa00;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .level-up {
            font-size: 48px;
            color: #ff5555;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes popupFade {
            0% {
                opacity: 1;
                transform: translateY(0px) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.2);
            }
        }

        /* Menu Buttons */
        .menu-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 150;
            pointer-events: auto;
        }

        .mode-button {
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid #00aaff;
            border-radius: 15px;
            padding: 15px 30px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 500px;
            text-align: left;
            color: #ffffff;
            font-family: 'Orbitron', Arial, sans-serif;
        }

        .mode-button:hover {
            background: rgba(0, 0, 0, 0.4);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.3);
        }

        .mode-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .mode-theme {
            font-size: 12px;
            color: #cccccc;
            opacity: 0.9;
        }

        .difficulty {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #00aaff;
        }

        /* Game Over Screen */
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 48px;
            color: #ff6b6b;
            font-weight: bold;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
            z-index: 200;
            pointer-events: auto;
            cursor: pointer;
            display: none;
        }

        /* Mobile Optimizations */
        @media screen and (max-width: 768px) {
            .game-title {
                font-size: 2.5em;
                top: 40px;
            }

            .score-popup {
                font-size: 20px;
            }

            .combo-effect {
                font-size: 28px;
            }

            .level-up {
                font-size: 36px;
            }

            .mode-button {
                width: 90vw;
                padding: 12px 20px;
            }

            .mode-name {
                font-size: 18px;
            }
        }

        @media screen and (max-width: 480px) {
            .game-title {
                font-size: 2em;
                top: 30px;
            }

            .score-popup {
                font-size: 18px;
            }

            .combo-effect {
                font-size: 24px;
            }

            .level-up {
                font-size: 30px;
            }

            .mode-name {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div class="ui-overlay">
        <!-- Game Title -->
        <div class="ui-text game-title" id="gameTitle" style="display: none;">CHAIN BREAKER</div>

        <!-- Score UI -->
        <div class="ui-text score-text" id="scoreText">Score: 0</div>
        <div class="ui-text level-text" id="levelText">Level: 1</div>
        <div class="ui-text lives-text" id="livesText">Lives: 3</div>
        <div class="ui-text combo-text" id="comboText">Combo: 0</div>
        <div class="ui-text fever-text" id="feverText"></div>
    </div>

    <!-- Menu Container -->
    <div class="menu-container" id="menuContainer">
        <!-- Menu buttons will be created dynamically -->
    </div>

    <!-- Game Over Screen -->
    <div class="game-over" id="gameOverScreen">
        <div id="gameOverText">GAME OVER</div>
        <div style="font-size: 24px; margin-top: 20px;">Click to Restart</div>
    </div>

    <!-- Vanilla Game Engine -->
    <script>
        // ====================
        // VANILLA GAME ENGINE
        // ====================

        class VanillaChainBreaker {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.currentScene = 'menu';
                this.gameState = 'loading';
                this.lastTime = 0;
                this.deltaTime = 0;

                // Initialize canvas
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                // Device detection and adaptive constants
                this.setupAdaptiveConstants();

                // Color palettes
                this.setupColorPalettes();

                // Game objects
                this.rings = [];
                this.breakingRings = []; // Separate array for breaking rings
                this.particles = [];
                this.stars = [];
                this.needle = null;
                this.activeRing = null;

                // Game state
                this.score = 0;
                this.level = 1;
                this.lives = 3;
                this.combo = 0;
                this.feverMode = false;
                this.feverTimer = 0;
                this.gameOverFlag = false;
                this.needleActive = false;
                this.regenTimer = null;
                this.regenDelay = 5000;
                this.originalNeedleSpeed = Math.PI; // 180 degrees per second
                this.lastInputTime = null;
                this.frameCount = 0;

                // UI elements
                this.ui = {
                    scoreText: document.getElementById('scoreText'),
                    levelText: document.getElementById('levelText'),
                    livesText: document.getElementById('livesText'),
                    comboText: document.getElementById('comboText'),
                    feverText: document.getElementById('feverText'),
                    gameTitle: document.getElementById('gameTitle'),
                    menuContainer: document.getElementById('menuContainer'),
                    gameOverScreen: document.getElementById('gameOverScreen')
                };

                // Input handling
                this.setupInput();

                // Initialize menu
                this.createMenuButtons();

                // Start game loop
                this.gameLoop();
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.width = this.canvas.width;
                this.height = this.canvas.height;
                this.centerX = this.width / 2;
                this.centerY = this.height / 2;
            }

            setupAdaptiveConstants() {
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
                const isSmallMobile = window.innerWidth <= 480;

                if (isSmallMobile) {
                    this.constants = {
                        BASE_RADIUS: 60,
                        RING_THICKNESS: 12,
                        RING_GAP: 8,
                        MAX_RINGS: 8,
                        INITIAL_RINGS: 4,
                        TARGET_FPS: 60
                    };
                } else if (isMobile) {
                    this.constants = {
                        BASE_RADIUS: 75,
                        RING_THICKNESS: 15,
                        RING_GAP: 10,
                        MAX_RINGS: 10,
                        INITIAL_RINGS: 5,
                        TARGET_FPS: 90
                    };
                } else {
                    this.constants = {
                        BASE_RADIUS: 100,
                        RING_THICKNESS: 20,
                        RING_GAP: 15,
                        MAX_RINGS: 12,
                        INITIAL_RINGS: 6,
                        TARGET_FPS: 144
                    };
                }
            }

            setupColorPalettes() {
                this.palettes = {
                    neon: ['#4ECDC4', '#45B7D1', '#96CEB4', '#FECA57', '#FF6B6B', '#A8E6CF', '#74B9FF', '#FD79A8'],
                    sunset: ['#FF6B9D', '#F38BA8', '#E8B4CB', '#C8A2C8', '#FDCB6E', '#E17055', '#F39C12', '#E67E22'],
                    ocean: ['#74B9FF', '#0984E3', '#6C5CE7', '#A29BFE', '#00B894', '#00CEC9', '#55EFC4', '#81ECEC'],
                    fire: ['#E17055', '#FDCB6E', '#F39C12', '#E67E22', '#D63031', '#FF7675', '#FD79A8', '#FDCB6E'],
                    cosmic: ['#6C5CE7', '#A29BFE', '#FD79A8', '#FDCB6E', '#74B9FF', '#00B894', '#FF6B9D', '#FECA57'],
                    aurora: ['#00CEC9', '#55EFC4', '#81ECEC', '#74B9FF', '#A29BFE', '#6C5CE7', '#FD79A8', '#FDCB6E']
                };

                this.modeDesigns = [
                    {
                        name: "Bubble Pop",
                        theme: "Gentle bubbles and smooth precision",
                        palette: 'neon',
                        sweetSpotSize: 15,
                        needleSpeed: 1,
                        ringMovement: false
                    },
                    {
                        name: "Cotton Candy",
                        theme: "Sweet pastels with swift motions",
                        palette: 'sunset',
                        sweetSpotSize: 15,
                        needleSpeed: 1.3,
                        ringMovement: false
                    },
                    {
                        name: "Ocean Waves",
                        theme: "Flowing blues with dancing targets",
                        palette: 'ocean',
                        sweetSpotSize: 15,
                        needleSpeed: 1.2,
                        ringMovement: true,
                        ringSpeed: 0.0005
                    },
                    {
                        name: "Golden Sunset",
                        theme: "Warm golds with precise timing",
                        palette: 'fire',
                        sweetSpotSize: 10,
                        needleSpeed: 1.3,
                        ringMovement: true,
                        ringSpeed: 0.0007
                    },
                    {
                        name: "Magic Prism",
                        theme: "Enchanted colors with wild patterns",
                        palette: 'cosmic',
                        sweetSpotSize: 12,
                        needleSpeed: 1.4,
                        ringMovement: true,
                        ringSpeed: 0.001
                    },
                    {
                        name: "Rainbow Master",
                        theme: "The ultimate cartoon challenge",
                        palette: 'aurora',
                        sweetSpotSize: 8,
                        needleSpeed: 1.8,
                        ringMovement: true,
                        ringSpeed: 0.0015
                    }
                ];
            }

            setupInput() {
                // DESKTOP FIX: Multiple input methods for better compatibility
                this.canvas.addEventListener('click', (e) => {
                    console.log('🖱️ Desktop click detected:', e);
                    this.handleClick(e);
                });

                this.canvas.addEventListener('mousedown', (e) => {
                    console.log('🖱️ Desktop mousedown detected:', e);
                    this.handleClick(e);
                });

                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    console.log('📱 Mobile touch detected:', e.touches[0]);
                    this.handleClick(e.touches[0]);
                });

                // KEYBOARD support for desktop
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' && this.currentScene === 'game') {
                        e.preventDefault();
                        console.log('⌨️ Spacebar detected');
                        this.handleClick({});
                    }
                });
            }

            handleClick(e) {
                if (this.currentScene === 'menu') {
                    // Menu clicks handled by DOM buttons
                    return;
                }

                if (this.currentScene === 'game' && !this.gameOverFlag) {
                    this.handleGameClick();
                    return; // FIXED: Prevent falling through to game over logic
                }

                if (this.gameOverFlag) {
                    this.resetGame();
                }
            }

            createMenuButtons() {
                const container = this.ui.menuContainer;
                container.innerHTML = '';

                this.modeDesigns.forEach((mode, index) => {
                    const button = document.createElement('div');
                    button.className = 'mode-button';
                    button.style.borderColor = this.palettes[mode.palette][0];

                    const difficulty = '●'.repeat(index + 1);

                    button.innerHTML = `
            <div class="mode-name">${mode.name}</div>
            <div class="mode-theme">${mode.theme}</div>
            <div class="difficulty">${difficulty}</div>
          `;

                    button.addEventListener('click', () => {
                        this.selectedMode = mode;
                        this.startGame();
                    });

                    container.appendChild(button);
                });
            }

            startGame() {
                this.currentScene = 'game';
                this.ui.menuContainer.style.display = 'none';
                this.ui.gameTitle.style.display = 'none';
                this.resetGameState();
                this.setupAdvancedFeatures();
                this.setupInputThrottling();
                this.createStars();
                this.startLevel();
            }

            resetGameState() {
                this.score = 0;
                this.level = 1;
                this.lives = 3;
                this.combo = 0;
                this.feverMode = false;
                this.feverTimer = 0;
                this.gameOverFlag = false;
                this.rings = [];
                this.breakingRings = [];
                this.particles = [];
                this.needleActive = false;
                this.regenTimer = null;
                this.regenDelay = 5000;
                this.originalNeedleSpeed = Math.PI; // 180 degrees per second
                this.lastInputTime = null;
                this.frameCount = 0;
                this.updateUI();
            }

            setupAdvancedFeatures() {
                // Device debug info
                this.createDeviceDebugInfo();

                // Performance metrics
                this.performanceMetrics = {
                    frameCount: 0,
                    lastTime: performance.now(),
                    fpsHistory: [],
                    averageFPS: 60
                };

                // Pluto features
                this.plutoMood = 'idle';
                this.plutoOrbitTimer = 0;
                this.plutoOrbitInterval = 15000; // 15 seconds
                this.plutoIsAnimating = false;
                this.plutoMovementTypes = ['orbit', 'fly-around', 'zoom-out', 'spiral-dance'];
                this.lastMovementType = -1;
            }

            createDeviceDebugInfo() {
                const deviceType = this.getDeviceType();
                const debugDiv = document.createElement('div');
                debugDiv.className = 'ui-text';
                debugDiv.style.cssText = `
                    position: fixed;
                    bottom: 100px;
                    left: 10px;
                    font-size: 12px;
                    color: #ffff00;
                    background: rgba(0,0,0,0.5);
                    padding: 5px;
                    border-radius: 3px;
                    font-family: monospace;
                    line-height: 1.4;
                `;
                debugDiv.innerHTML = `
                    Device: ${deviceType}<br>
                    Screen: ${window.innerWidth}x${window.innerHeight}<br>
                    Radius: ${this.constants.BASE_RADIUS}<br>
                    Target FPS: ${this.constants.TARGET_FPS}
                `;
                document.body.appendChild(debugDiv);
                this.deviceDebugDiv = debugDiv;
            }

            getDeviceType() {
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
                const isSmallMobile = window.innerWidth <= 480;
                const isTablet = window.innerWidth >= 768 && window.innerWidth <= 1024;

                if (isSmallMobile) return 'small-mobile';
                if (isMobile) return 'mobile';
                if (isTablet) return 'tablet';
                return 'desktop';
            }

            resetRegenTimer() {
                if (this.regenTimer) {
                    clearTimeout(this.regenTimer);
                }
                this.regenTimer = setTimeout(() => {
                    this.regenerateRing();
                }, this.regenDelay);
            }

            regenerateRing() {
                if (this.activeRing && !this.activeRing.inputReceived) {
                    this.combo = 0;
                    this.updateUI();
                }

                const maxRings = Math.min(this.constants.MAX_RINGS, this.constants.INITIAL_RINGS + Math.floor(this.level / 3));

                if (this.rings.length >= maxRings) {
                    this.gameOver();
                    return;
                }

                const lastRadius = this.rings.length > 0
                    ? this.rings[this.rings.length - 1].radius
                    : this.constants.BASE_RADIUS - (this.constants.RING_THICKNESS + this.constants.RING_GAP);

                const newRadius = lastRadius + this.constants.RING_THICKNESS + this.constants.RING_GAP;
                const colorIndex = this.rings.length % this.palettes[this.selectedMode.palette].length;
                const color = this.palettes[this.selectedMode.palette][colorIndex];

                const ring = {
                    x: this.centerX,
                    y: this.centerY,
                    radius: newRadius,
                    thickness: this.constants.RING_THICKNESS,
                    color: color,
                    sweetSpotAngle: Math.random() * Math.PI * 2,
                    sweetSpotSize: this.selectedMode.sweetSpotSize,
                    alpha: 1,
                    inputReceived: false,
                    proximityEffect: false
                };

                this.rings.push(ring);
                this.activeRing = ring;
                this.needle.radius = ring.radius + ring.thickness / 2 + 15;
                this.resetRegenTimer();
            }

            updatePlutoMood(deltaTime) {
                if (this.plutoIsAnimating) return;

                this.plutoOrbitTimer += deltaTime * 1000;

                let newMood = 'idle';

                if (this.feverMode) {
                    newMood = 'excited';
                } else if (this.lives <= 1) {
                    newMood = 'sad';
                } else if (this.combo >= 3) {
                    newMood = 'excited';
                } else if (this.plutoOrbitTimer >= this.plutoOrbitInterval) {
                    let randomIndex;
                    do {
                        randomIndex = Math.floor(Math.random() * this.plutoMovementTypes.length);
                    } while (randomIndex === this.lastMovementType);

                    newMood = this.plutoMovementTypes[randomIndex];
                    this.lastMovementType = randomIndex;
                    this.plutoOrbitTimer = 0;
                }

                if (this.plutoMood !== newMood) {
                    this.changePlutoMood(newMood);
                }

                this.checkRingProximity();
            }

            changePlutoMood(mood) {
                this.plutoMood = mood;

                switch (mood) {
                    case 'excited':
                        // Add visual indication or animation
                        break;
                    case 'sad':
                        // Add visual indication
                        break;
                    case 'orbit':
                    case 'fly-around':
                    case 'zoom-out':
                    case 'spiral-dance':
                        this.plutoIsAnimating = true;
                        setTimeout(() => {
                            this.plutoIsAnimating = false;
                            this.changePlutoMood('idle');
                        }, 8000);
                        break;
                    default:
                        this.plutoIsAnimating = false;
                        break;
                }
            }

            checkRingProximity() {
                if (!this.rings.length) return;

                this.rings.forEach(ring => {
                    const distance = ring.radius;
                    if (distance < 150) {
                        ring.proximityEffect = true;
                    } else {
                        ring.proximityEffect = false;
                    }
                });
            }

            setupInputThrottling() {
                this.lastInputTime = 0;
                // DESKTOP/MOBILE OPTIMIZED: Different throttling for different devices
                const deviceType = this.getDeviceType();
                if (deviceType === 'desktop') {
                    // DESKTOP: Virtually no throttling - mouse is super precise
                    this.inputThrottleNormal = 0;  // No throttling
                    this.inputThrottleFever = 0;   // No throttling
                } else {
                    // MOBILE: Light throttling to prevent double-taps
                    this.inputThrottleNormal = 8;  // ~125 FPS response
                    this.inputThrottleFever = 4;   // ~250 FPS response in fever mode
                }
                console.log(`🎮 Input setup for ${deviceType}: throttle=${this.inputThrottleNormal}ms`);
            }

            canProcessInput() {
                const now = performance.now();
                const throttle = this.feverMode ? this.inputThrottleFever : this.inputThrottleNormal;

                if (this.lastInputTime && now - this.lastInputTime < throttle) {
                    return false;
                }

                this.lastInputTime = now;
                return true;
            }

            createStars() {
                this.stars = [];
                for (let i = 0; i < 50; i++) {
                    this.stars.push({
                        x: Math.random() * this.width,
                        y: Math.random() * this.height,
                        size: Math.random() * 2 + 0.5,
                        alpha: Math.random() * 0.8 + 0.2,
                        twinkleSpeed: Math.random() * 0.02 + 0.01
                    });
                }
            }

            startLevel() {
                this.rings = [];

                // Stop needle during ring creation
                this.needleActive = false;

                // Create rings
                const numRings = Math.min(this.constants.MAX_RINGS, this.constants.INITIAL_RINGS + Math.floor(this.level / 5));
                const radiusIncrement = this.constants.RING_THICKNESS + this.constants.RING_GAP;

                for (let i = 0; i < numRings; i++) {
                    const radius = this.constants.BASE_RADIUS + i * radiusIncrement;
                    const colorIndex = i % this.palettes[this.selectedMode.palette].length;
                    const color = this.palettes[this.selectedMode.palette][colorIndex];

                    const ring = {
                        x: this.centerX,
                        y: this.centerY,
                        radius: radius,
                        thickness: this.constants.RING_THICKNESS,
                        color: color,
                        sweetSpotAngle: Math.random() * Math.PI * 2,
                        sweetSpotSize: this.selectedMode.sweetSpotSize,
                        alpha: 1,
                        inputReceived: false,
                        proximityEffect: false
                    };

                    this.rings.push(ring);
                }

                this.activeRing = this.rings[this.rings.length - 1];

                // Create needle
                this.needle = {
                    angle: 0,
                    speed: this.originalNeedleSpeed * this.selectedMode.needleSpeed,
                    radius: this.activeRing.radius + this.activeRing.thickness / 2 + 15
                };

                // Start needle after brief delay with console debug
                console.log('🎯 Starting needle in 500ms...');
                setTimeout(() => {
                    console.log('🎯 Needle is now ACTIVE!');
                    this.needleActive = true;
                }, 500);

                // Start regeneration timer
                this.resetRegenTimer();
            }

            // ===================================================================
            // CORE GAMEPLAY LOGIC - REBUILT FOR PRECISION AND FEEL
            // ===================================================================
            handleGameClick() {
                console.log('🎯 handleGameClick called', {
                    activeRing: !!this.activeRing,
                    needleActive: this.needleActive,
                    inputReceived: this.activeRing?.inputReceived,
                    scene: this.currentScene
                });

                // Tıklamanın mümkün olup olmadığını en başta kontrol et (daha temiz mantık)
                if (!this.activeRing || !this.needleActive || this.activeRing.inputReceived) {
                    console.log('🚫 Click blocked - conditions not met');
                    return;
                }

                // BÜYÜTÜLMÜŞ: Collision threshold'u daha da büyük
                // Görsel %50 büyük, collision da %50 büyük olmalı
                const baseThreshold = (this.activeRing.sweetSpotSize * Math.PI / 180) / 2;
                const threshold = baseThreshold * 1.5; // %50 büyütme

                // Yüksek hassasiyetli açı farkı hesaplaması
                let angleDiff = this.needle.angle - this.activeRing.sweetSpotAngle;
                while (angleDiff <= -Math.PI) angleDiff += 2 * Math.PI;
                while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;

                // Enhanced debug info
                if (this.deviceDebugDiv) {
                    this.deviceDebugDiv.innerHTML = `
                        Device: ${this.getDeviceType()}<br>
                        Screen: ${window.innerWidth}x${window.innerHeight}<br>
                        Needle: ${(this.needle.angle * 180 / Math.PI).toFixed(3)}°<br>
                        Sweet: ${(this.activeRing.sweetSpotAngle * 180 / Math.PI).toFixed(3)}°<br>
                        Diff: ${(Math.abs(angleDiff) * 180 / Math.PI).toFixed(3)}°<br>
                        Threshold: ${(threshold * 180 / Math.PI).toFixed(3)}°<br>
                        <span style="color: ${Math.abs(angleDiff) <= threshold ? '#00ff00' : '#ff0000'}; font-weight: bold;">
                        ${Math.abs(angleDiff) <= threshold ? '✅ PERFECT HIT!' : '❌ MISS'}
                        </span><br>
                        Lives: ${this.lives}<br>
                        Combo: ${this.combo}
                    `;
                }

                if (Math.abs(angleDiff) <= threshold) {
                    // BAŞARILI VURUŞ:
                    this.activeRing.inputReceived = true; // Hileleri önlemek için ANINDA işle
                    this.handleSuccessfulHit();
                    this.resetRegenTimer(); // Zamanlayıcıyı sadece başarıda sıfırla
                } else {
                    // ISKA:
                    this.handleMiss();
                }
            }

            handleSuccessfulHit() {
                const points = Math.floor(10 * (this.feverMode ? 2 : (1 + this.combo * 0.1)));
                this.score += points;
                this.combo++;

                // ANINDA GERİ BİLDİRİM - Tüm efektler tıklama ile aynı anda tetiklenir
                this.triggerShake(3, 100); // Hafif ve anlık bir sarsıntı
                this.animateRingBreak(this.activeRing); // Kırılma animasyonunu ve parçacıkları BAŞLAT
                this.showScorePopup(points, this.centerX, this.centerY); // Skoru göster

                // Oyun mantığını devam ettir
                this.rings.pop();

                if (this.rings.length === 0) {
                    this.levelUp();
                } else {
                    this.activeRing = this.rings[this.rings.length - 1];
                    this.needle.radius = this.activeRing.radius + this.activeRing.thickness / 2 + 15;
                }

                this.needle.speed *= 1.02; // Hızı hafifçe artır
                this.regenDelay = Math.max(2500, this.regenDelay * 0.98); // Bekleme süresini azalt
                if (this.combo >= 5 && !this.feverMode) this.activateFeverMode();
                if (this.combo > 0 && this.combo % 5 === 0) this.showComboEffect();
                this.updateUI();
            }

            // EKLE: Bu fonksiyonu class'ınıza ekleyin
            triggerShake(intensity, duration) {
                // Mevcut sarsıntıdan daha güçlüyse üzerine yaz
                this.shakeIntensity = Math.max(this.shakeIntensity || 0, intensity);
                this.shakeDuration = Math.max(this.shakeDuration || 0, duration);
            }

            // Bu fonksiyon artık sadece görsel animasyonu yönetiyor.
            animateRingBreak(ring) {
                ring.isBreaking = true;
                ring.breakStartTime = performance.now();
                ring.breakDuration = 300; // Ultra hızlı, tatmin edici kırılma süresi
                ring.originalRadius = ring.radius;
                ring.originalThickness = ring.thickness;
                this.breakingRings.push(ring);

                // Yeni parçacık fonksiyonunu çağır
                this.createShatterParticles(ring);
            }

            // YENİ FONKSİYON: Patlama hissini yaratır
            createShatterParticles(ring) {
                const count = 20; // Daha fazla parçacık
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.1;
                    const speed = Math.random() * 4 + 3; // Daha enerjik hız
                    this.particles.push({
                        x: ring.x + Math.cos(angle) * ring.radius,
                        y: ring.y + Math.sin(angle) * ring.radius,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        decay: 0.015,
                        color: ring.color,
                        size: Math.random() * 4 + 2
                    });
                }
                // Merkezde büyük bir beyaz flaş patlaması efekti
                this.particles.push({
                    x: ring.x, y: ring.y, vx: 0, vy: 0, life: 1, decay: 0.05,
                    color: '#FFFFFF', size: ring.radius, isFlash: true // Flaş parçacığı
                });
            }

            // FIXED: Ultra-precise needle drawing with exact collision feedback
            drawNeedle() {
                const ctx = this.ctx;

                // Only draw needle if it's active
                if (!this.needleActive) return;

                const needleX = this.centerX + Math.cos(this.needle.angle) * this.needle.radius;
                const needleY = this.centerY + Math.sin(this.needle.angle) * this.needle.radius;

                // EXACT: Use identical collision logic for visual feedback
                const needleAngle = this.needle.angle;
                const sweetSpotAngle = this.activeRing.sweetSpotAngle;

                // Calculate angle difference with proper wrapping (same as handleGameClick)
                let angleDiff = needleAngle - sweetSpotAngle;
                while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                const absAngleDiff = Math.abs(angleDiff);

                // HASSAS: Çarpışma mantığıyla birebir aynı hesaplama
                const baseThreshold = (this.activeRing.sweetSpotSize * Math.PI / 180) / 2;
                const threshold = baseThreshold * 1.5; // Görsel ile aynı %50 büyütme
                const inSweetSpot = absAngleDiff <= threshold;

                ctx.save();
                // Parlaklık azaltılmış görsel geri bildirim
                if (inSweetSpot) {
                    const precision = 1 - (absAngleDiff / threshold);
                    if (precision > 0.9) {
                        ctx.fillStyle = '#00cc00'; // Daha az parlak yeşil
                        ctx.shadowColor = '#00cc00';
                        ctx.shadowBlur = 4; // Daha az parlaklık
                    } else if (precision > 0.7) {
                        ctx.fillStyle = '#cccc00'; // Daha az parlak sarı
                    } else {
                        ctx.fillStyle = '#cccccc'; // Daha az parlak beyaz
                    }
                } else {
                    ctx.fillStyle = '#cc0000'; // Daha az parlak kırmızı
                }

                // Needle circle
                ctx.beginPath();
                ctx.arc(needleX, needleY, 6, 0, Math.PI * 2);
                ctx.fill();

                // Reset shadow
                ctx.shadowBlur = 0;

                // Needle line
                ctx.strokeStyle = ctx.fillStyle; // Match fill color
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(needleX, needleY);
                ctx.lineTo(needleX + Math.cos(this.needle.angle + Math.PI) * 25,
                    needleY + Math.sin(this.needle.angle + Math.PI) * 25);
                ctx.stroke();

                ctx.restore();
            }

            handleMiss() {
                this.combo = 0;
                this.lives--;

                if (this.lives <= 0) {
                    this.gameOver();
                }

                this.updateUI();
            }

            activateFeverMode() {
                this.feverMode = true;
                this.feverTimer = 5000; // 5 seconds
                this.ui.feverText.textContent = 'FEVER MODE: 5s';
            }

            levelUp() {
                this.level++;
                this.showLevelUpEffect();

                // Bonus life every 3 levels
                if (this.level % 3 === 0) {
                    this.lives = Math.min(this.lives + 1, 5);
                }

                setTimeout(() => {
                    this.startLevel();
                }, 1000);

                this.updateUI();
            }

            gameOver() {
                this.gameOverFlag = true;
                this.ui.gameOverScreen.style.display = 'block';
                document.getElementById('gameOverText').innerHTML = `
          GAME OVER<br>
          <div style="font-size: 24px; margin: 10px 0;">Score: ${this.score}</div>
          <div style="font-size: 24px; margin: 10px 0;">Level: ${this.level}</div>
        `;
            }

            resetGame() {
                this.gameOverFlag = false;
                this.ui.gameOverScreen.style.display = 'none';
                this.currentScene = 'menu';
                this.ui.menuContainer.style.display = 'block';
                this.ui.gameTitle.style.display = 'block';
                this.resetGameState();
            }

            createParticles(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 1,
                        decay: 0.02,
                        color: color,
                        size: Math.random() * 4 + 2
                    });
                }
            }

            showScorePopup(points, x, y) {
                const popup = document.createElement('div');
                popup.className = 'score-popup';
                popup.textContent = '+' + points;
                popup.style.left = x + 'px';
                popup.style.top = y + 'px';
                document.body.appendChild(popup);

                setTimeout(() => {
                    if (popup.parentNode) popup.remove();
                }, 800);
            }

            showLevelUpEffect() {
                const effect = document.createElement('div');
                effect.className = 'level-up';
                effect.textContent = 'LEVEL UP!';
                document.body.appendChild(effect);

                setTimeout(() => {
                    if (effect.parentNode) effect.remove();
                }, 2000);
            }

            showComboEffect() {
                const effect = document.createElement('div');
                effect.className = 'combo-effect';
                effect.textContent = `COMBO x${this.combo}!`;
                document.body.appendChild(effect);

                setTimeout(() => {
                    if (effect.parentNode) effect.remove();
                }, 600);
            }

            updateUI() {
                this.ui.scoreText.textContent = 'Score: ' + this.score;
                this.ui.levelText.textContent = 'Level: ' + this.level;
                this.ui.livesText.textContent = 'Lives: ' + this.lives;
                this.ui.comboText.textContent = 'Combo: ' + this.combo;
            }

            update(deltaTime) {
                if (this.currentScene !== 'game' || this.gameOverFlag) return;

                // Initialize frame counter
                if (!this.frameCount) this.frameCount = 0;

                // Performance tracking
                this.performanceMetrics.frameCount++;

                // Update needle - FIXED: Only update if needle is active
                if (this.needle && this.activeRing && this.needleActive) {
                    this.needle.angle += this.needle.speed * deltaTime;
                    if (this.needle.angle > Math.PI * 2) {
                        this.needle.angle -= Math.PI * 2;
                    }
                }

                // Update fever mode
                if (this.feverMode) {
                    this.feverTimer -= deltaTime * 1000;
                    if (this.feverTimer <= 0) {
                        this.feverMode = false;
                        this.ui.feverText.textContent = '';
                    } else {
                        this.ui.feverText.textContent = 'FEVER MODE: ' + Math.ceil(this.feverTimer / 1000) + 's';
                    }
                }

                // Update Pluto mood system
                if (this.frameCount % 6 === 0) { // Every 6 frames for performance
                    this.updatePlutoMood(deltaTime);
                }

                // GÜNCELLE: Sarsıntı mantığını ekleyin
                if (this.shakeDuration > 0) {
                    this.shakeDuration -= deltaTime * 1000;
                    if (this.shakeDuration <= 0) this.shakeIntensity = 0; // Süre bitince sarsıntıyı sıfırla
                }

                this.particles = this.particles.filter(p => {
                    p.x += p.vx * deltaTime * 60; // Parçacık hızı deltaTime'a bağlı olsun
                    p.y += p.vy * deltaTime * 60;
                    p.life -= p.decay;
                    return p.life > 0;
                });

                // Update stars
                this.stars.forEach(star => {
                    star.alpha += Math.sin(Date.now() * star.twinkleSpeed) * 0.01;
                    star.alpha = Math.max(0.2, Math.min(1, star.alpha));
                });

                this.frameCount = (this.frameCount + 1) % 12; // Reset cycle
            }

            render() {
                // Apply screen shake effect with new system
                this.ctx.save();
                if (this.shakeIntensity > 0) {
                    const shakeX = (Math.random() - 0.5) * this.shakeIntensity;
                    const shakeY = (Math.random() - 0.5) * this.shakeIntensity;
                    this.ctx.translate(shakeX, shakeY);
                }

                // Clear canvas
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.width, this.height);

                // Draw gradient background
                const gradient = this.ctx.createRadialGradient(
                    this.centerX, this.centerY, 0,
                    this.centerX, this.centerY, Math.max(this.width, this.height)
                );
                gradient.addColorStop(0, '#1e3c72');
                gradient.addColorStop(0.5, '#2a5298');
                gradient.addColorStop(1, '#0f0f23');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.width, this.height);

                if (this.currentScene === 'menu') {
                    this.renderMenu();
                } else if (this.currentScene === 'game') {
                    this.renderGame();
                }

                // Restore canvas transform after shake effect
                this.ctx.restore();
            }

            renderMenu() {
                // Draw title stars
                this.stars.forEach(star => {
                    this.ctx.save();
                    this.ctx.globalAlpha = star.alpha;
                    this.ctx.fillStyle = '#00ffff';
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });
            }

            renderGame() {
                // Draw stars
                this.stars.forEach(star => {
                    this.ctx.save();
                    this.ctx.globalAlpha = star.alpha * 0.5;
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });

                // GÜNCELLE: Halkaları daha verimli çiz
                [...this.rings, ...this.breakingRings].forEach(ring => this.drawRing(ring));
                this.breakingRings = this.breakingRings.filter(r => (performance.now() - r.breakStartTime) < r.breakDuration);

                // Draw needle - FIXED: Only draw if needle is active
                if (this.needle && this.activeRing && this.needleActive) {
                    this.drawNeedle();
                }

                // GÜNCELLE: Flaş parçacığını farklı çiz
                this.particles.forEach(p => {
                    this.ctx.save();
                    this.ctx.globalAlpha = p.life;

                    // YENİ: Flaş parçacığını farklı çiz
                    if (p.isFlash) {
                        const grad = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * (1 - p.life));
                        grad.addColorStop(0, `rgba(255, 255, 255, ${p.life})`);
                        grad.addColorStop(1, 'transparent');
                        this.ctx.fillStyle = grad;
                        this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); this.ctx.fill();
                    } else {
                        this.ctx.fillStyle = p.color;
                        this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); this.ctx.fill();
                    }
                    this.ctx.restore();
                });
            }

            drawRing(ring) {
                const ctx = this.ctx;
                let { x, y, radius, thickness, color, alpha } = ring;

                // DEĞİŞTİ: Kırılma animasyonu artık daha patlayıcı
                if (ring.isBreaking) {
                    const progress = (performance.now() - ring.breakStartTime) / ring.breakDuration;
                    const easeOut = 1 - Math.pow(1 - progress, 4); // Daha keskin bir başlangıç
                    radius += easeOut * 10; // İçe değil, DIŞA doğru patlayarak genişlesin
                    alpha = 1 - progress; // Hızla kaybolsun
                    thickness *= (1 - progress);
                }

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = color;
                ctx.lineWidth = thickness;
                ctx.shadowColor = color;
                ctx.shadowBlur = 5; // Daha az parlaklık
                ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.stroke();

                // ULTRA-VISIBLE COLLISION ZONE: Çok büyük ve tam beyaz
                if (!ring.isBreaking) {
                    // Collision alanını %50 büyüt - çok daha kolay vurmak için
                    const sweetSpotRad = (ring.sweetSpotSize * Math.PI / 180) / 2 * 1.5; // 50% büyük görsel

                    // Arka plan (koyu kenarlık) - daha kalın
                    ctx.strokeStyle = '#222222';
                    ctx.lineWidth = thickness + 12;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, ring.sweetSpotAngle - sweetSpotRad, ring.sweetSpotAngle + sweetSpotRad);
                    ctx.stroke();

                    // Ana beyaz alan - TAM BEYAZ ve çok belirgin
                    ctx.strokeStyle = '#ffffff'; // Tam beyaz
                    ctx.lineWidth = thickness + 10;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 12; // Daha belirgin glow
                    ctx.beginPath();
                    ctx.arc(x, y, radius, ring.sweetSpotAngle - sweetSpotRad, ring.sweetSpotAngle + sweetSpotRad);
                    ctx.stroke();
                }
                ctx.restore();
            }



            gameLoop(currentTime = 0) {
                this.deltaTime = (currentTime - this.lastTime) / 1000;
                this.lastTime = currentTime;

                this.update(this.deltaTime);
                this.render();

                requestAnimationFrame((time) => this.gameLoop(time));
            }
        }

        // Initialize game when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new VanillaChainBreaker();
        });
    </script>
