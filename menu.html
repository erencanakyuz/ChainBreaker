  <!-- Canvas Viewport Fix -->
  <style>
    /* Prevent scrolling and canvas overflow */
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    /* Game container should fill screen exactly */
    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
    }

    /* Phaser canvas should not grow */
    #phaser-game {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Phaser canvas element direct styling for crisp rendering */
    #phaser-game canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      image-rendering: auto;
      image-rendering: crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      object-fit: contain;
    }

    /* Prevent any scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }

    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* GLOBAL PLUTO CENTERING - Force center on all devices */
    #game-pluto-container {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
    }

    .pluto-entity {
      position: relative;
      left: 0;
      top: 0;
      transform: none;
    }

    /* MOBILE RESPONSIVE OPTIMIZATIONS */
    @media screen and (max-width: 768px) {

      /* Enhanced touch targets for mobile */
      body {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* Optimized canvas for mobile performance */
      #phaser-game canvas {
        image-rendering: auto;
        image-rendering: optimizeSpeed;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        -webkit-perspective: 1000;
        perspective: 1000;
      }

      /* Mobile-friendly UI scaling */
      .game-title {
        font-size: 2.5em;
        top: 40px;
      }

      /* Touch-optimized score popup */
      .score-popup {
        font-size: 24px;
        font-weight: bold;
        pointer-events: none;
      }

      /* Larger combo effects for mobile */
      .combo-effect {
        font-size: 28px;
        font-weight: bold;
      }

      /* Mobile-optimized level up */
      .level-up {
        font-size: 36px;
        top: 25%;
      }

      /* Mobile Pluto optimizations - behind rings */
      #game-pluto-container {
        z-index: 1;
        opacity: 0.85;
      }

      .pluto-entity {
        max-width: 45px;
        max-height: 45px;
      }

      /* Slow down Pluto animations on mobile */
      #game-pluto-container *,
      .pluto-entity * {
        animation-duration: 3s;
        transition-duration: 0.8s;
      }
    }

    /* Small mobile devices (phones) */
    @media screen and (max-width: 480px) {
      .game-title {
        font-size: 2em;
        top: 30px;
        letter-spacing: 2px;
      }

      /* Smaller UI elements for tiny screens */
      .score-popup {
        font-size: 20px;
      }

      .combo-effect {
        font-size: 24px;
      }

      .level-up {
        font-size: 30px;
      }

      /* Small mobile Pluto optimizations */
      .pluto-entity {
        max-width: 30px;
        max-height: 30px;
      }

      /* Extra slow animations for very small screens */
      #game-pluto-container *,
      .pluto-entity * {
        animation-duration: 5s;
        transition-duration: 1.2s;
      }
    }

    /* Tablet optimizations */
    @media screen and (min-width: 768px) and (max-width: 1024px) {
      .game-title {
        font-size: 3em;
        top: 50px;
      }
    }

    /* High DPI displays */
    @media (-webkit-min-device-pixel-ratio: 2),
    (min-resolution: 192dpi) {
      #phaser-game canvas {
        image-rendering: -webkit-optimize-contrast;
        image-rendering: optimize-contrast;
        -ms-interpolation-mode: nearest-neighbor;
      }
    }

  <!-- Load Phaser synchronously to ensure availability -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>
    // Simplified Color Palettes - No overengineering
    const Palettes = {
      neon: ['#4ECDC4', '#45B7D1', '#96CEB4', '#FECA57', '#FF6B6B', '#A8E6CF', '#74B9FF', '#FD79A8'],
      sunset: ['#FF6B9D', '#F38BA8', '#E8B4CB', '#C8A2C8', '#FDCB6E', '#E17055', '#F39C12', '#E67E22'],
      ocean: ['#74B9FF', '#0984E3', '#6C5CE7', '#A29BFE', '#00B894', '#00CEC9', '#55EFC4', '#81ECEC'],
      fire: ['#E17055', '#FDCB6E', '#F39C12', '#E67E22', '#D63031', '#FF7675', '#FD79A8', '#FDCB6E'],
      cosmic: ['#6C5CE7', '#A29BFE', '#FD79A8', '#FDCB6E', '#74B9FF', '#00B894', '#FF6B9D', '#FECA57'],
      aurora: ['#00CEC9', '#55EFC4', '#81ECEC', '#74B9FF', '#A29BFE', '#6C5CE7', '#FD79A8', '#FDCB6E']
    };

    // Simple utility functions
    const getPhaserColors = (paletteName) => {
      return Palettes[paletteName].map(color => parseInt(color.replace('#', '0x'), 16));
    };

    const getGradientColors = (paletteName, steps = 5) => {
      const palette = Palettes[paletteName] || Palettes.neon;
      const result = [];
      for (let i = 0; i < steps; i++) {
        const index = Math.floor((i / (steps - 1)) * (palette.length - 1));
        result.push(parseInt(palette[index].replace('#', '0x'), 16));
      }
      return result;
    };

    // Simplified color system object
    const colorSystem = {
      convertedPalettes: {
        neon: getPhaserColors('neon'),
        sunset: getPhaserColors('sunset'),
        ocean: getPhaserColors('ocean'),
        fire: getPhaserColors('fire'),
        cosmic: getPhaserColors('cosmic'),
        aurora: getPhaserColors('aurora')
      },
      getGradientColors: getGradientColors
    };

    // GAME CONSTANTS - Single source of truth
    const GAME_CONSTANTS = {
      // Ring properties
      BASE_RADIUS: 100,
      RING_THICKNESS: 20,
      RING_GAP: 15,
      MAX_RINGS: 12,
      INITIAL_RINGS: 6,

      // Timing
      REGEN_DELAY: 5000,
      FEVER_DURATION: 5000,
      INPUT_THROTTLE_NORMAL: 85,
      INPUT_THROTTLE_FEVER: 60,

      // Gameplay
      INITIAL_LIVES: 3,
      MAX_LIVES: 5,
      COMBO_FOR_FEVER: 5,
      POINTS_BASE: 10,
      NEEDLE_SPEED_MULTIPLIER: 1.03,

      // Performance
      TARGET_FPS: 144,
      DOM_POOL_SIZE: 80,

      // Update frequencies (frame skipping)
      UPDATE_CRITICAL: 1,      // Every frame
      UPDATE_ESSENTIAL: 2,     // Every 2 frames
      UPDATE_VISUAL: 4,        // Every 4 frames
      UPDATE_NONCRITICAL: 6,   // Every 6 frames
      UPDATE_CYCLE: 12,        // Reset cycle

      // Animation durations
      ANIM_SCORE_POPUP: 800,
      ANIM_COMBO_EFFECT: 600,
      ANIM_LEVEL_UP: 2000,
      ANIM_RING_BREAK: 800,
      ANIM_RING_SPAWN: 300,
      ANIM_RING_SPAWN_DELAY: 480
    };

    // RESPONSIVE SYSTEM - Mobile/Desktop Detection and Adaptive Constants
    const DeviceDetector = {
      isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
          window.innerWidth <= 768 ||
          ('ontouchstart' in window);
      },

      isTablet() {
        return /iPad|Android(?=.*Tablet)|tablet/i.test(navigator.userAgent) ||
          (window.innerWidth >= 768 && window.innerWidth <= 1024);
      },

      isSmallMobile() {
        return window.innerWidth <= 480;
      },

      getDeviceType() {
        if (this.isSmallMobile()) return 'small-mobile';
        if (this.isMobile()) return 'mobile';
        if (this.isTablet()) return 'tablet';
        return 'desktop';
      }
    };

    // ADAPTIVE CONSTANTS - Adjust based on device type
    const getAdaptiveConstants = () => {
      const deviceType = DeviceDetector.getDeviceType();
      const baseConstants = { ...GAME_CONSTANTS };

      // Calculate safe area for rings (leave margins)
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const safeMargin = 40; // Minimum margin from screen edges
      const maxRingRadius = Math.min(screenWidth, screenHeight) / 2 - safeMargin;

      switch (deviceType) {
        case 'small-mobile':
          return {
            ...baseConstants,
            BASE_RADIUS: Math.min(60, maxRingRadius * 0.3),
            RING_THICKNESS: 12,
            RING_GAP: 8,
            MAX_RINGS: 8,
            INITIAL_RINGS: 4,
            TARGET_FPS: 60, // Lower FPS for battery life
            DOM_POOL_SIZE: 40,
            ANIM_RING_SPAWN_DELAY: 300, // Faster spawning
            // Touch-friendly adjustments
            INPUT_THROTTLE_NORMAL: 120,
            INPUT_THROTTLE_FEVER: 90,
            // Pluto responsive settings
            PLUTO_SCALE: 0.2,
            PLUTO_POSITION_OFFSET: 0,
            PLUTO_ANIMATION_SPEED: 0.4
          };

        case 'mobile':
          return {
            ...baseConstants,
            BASE_RADIUS: Math.min(75, maxRingRadius * 0.4),
            RING_THICKNESS: 15,
            RING_GAP: 10,
            MAX_RINGS: 10,
            INITIAL_RINGS: 5,
            TARGET_FPS: 90,
            DOM_POOL_SIZE: 60,
            ANIM_RING_SPAWN_DELAY: 360,
            // Touch-friendly adjustments
            INPUT_THROTTLE_NORMAL: 100,
            INPUT_THROTTLE_FEVER: 75,
            // Pluto responsive settings
            PLUTO_SCALE: 0.25,
            PLUTO_POSITION_OFFSET: 0,
            PLUTO_ANIMATION_SPEED: 0.6
          };

        case 'tablet':
          return {
            ...baseConstants,
            BASE_RADIUS: Math.min(90, maxRingRadius * 0.5),
            RING_THICKNESS: 18,
            RING_GAP: 12,
            MAX_RINGS: 11,
            INITIAL_RINGS: 5,
            TARGET_FPS: 120,
            DOM_POOL_SIZE: 70,
            ANIM_RING_SPAWN_DELAY: 420,
            // Pluto responsive settings
            PLUTO_SCALE: 0.3,
            PLUTO_POSITION_OFFSET: 0,
            PLUTO_ANIMATION_SPEED: 0.8
          };

        default: // desktop
          return {
            ...baseConstants,
            BASE_RADIUS: Math.min(100, maxRingRadius * 0.6),
            // Pluto responsive settings
            PLUTO_SCALE: 0.35,
            PLUTO_POSITION_OFFSET: 0,
            PLUTO_ANIMATION_SPEED: 1.0
          };
      }
    };

    // Get responsive constants (will be used throughout the game)
    let RESPONSIVE_CONSTANTS = getAdaptiveConstants();

    // Update constants when window resizes
    window.addEventListener('resize', () => {
      const newConstants = getAdaptiveConstants();
      RESPONSIVE_CONSTANTS = newConstants;

      // If game is running, trigger resize handler
      if (window.currentGameInstance) {
        window.currentGameInstance.handleResize(newConstants);
      }
    });

    // BootScene: Enhanced with gradient loading and better visuals
    class BootScene extends Phaser.Scene {
      constructor() {
        super('BootScene');
      }

      preload() {
        const { width, height } = this.cameras.main;

        // Create gradient background for loading
        const gradientGraphics = this.add.graphics();
        gradientGraphics.fillGradientStyle(0x1e3c72, 0x1e3c72, 0x2a5298, 0x2a5298, 1);
        gradientGraphics.fillRect(0, 0, width, height);

        // Enhanced progress box with gradient
        let progressBox = this.add.graphics();
        progressBox.fillGradientStyle(0x333333, 0x333333, 0x555555, 0x555555, 0.9);
        progressBox.fillRoundedRect(width / 2 - 160, height / 2 - 25, 320, 50, 10);

        let loadingText = this.add.text(width / 2, height / 2 - 70, 'Loading Amazing Colors...', {
          font: '24px Arial',
          fill: '#ffffff',
          stroke: '#000000',
          strokeThickness: 2
        }).setOrigin(0.5);

        // Add pulsing effect to loading text
        this.tweens.add({
          targets: loadingText,
          alpha: 0.3,
          duration: 1000,
          yoyo: true,
          repeat: -1
        });

        this.load.on('progress', (value) => {
          let bar = this.add.graphics();
          const gradientColors = colorSystem.getGradientColors('neon', 3);
          bar.fillGradientStyle(gradientColors[0], gradientColors[1], gradientColors[2], gradientColors[0], 1);
          bar.fillRoundedRect(width / 2 - 150, height / 2 - 15, 300 * value, 30, 8);
        });

        this.load.on('complete', () => {
          progressBox.destroy();
          loadingText.destroy();

          // Hide HTML loading screen
          const loadingDiv = document.getElementById('loading');
          if (loadingDiv) {
            loadingDiv.style.opacity = '0';
            setTimeout(() => loadingDiv.style.display = 'none', 500);
          }
        });

        // Enhanced cartoon-style particle textures
        let particleGraphics = this.make.graphics({ x: 0, y: 0, add: false });

        // Create a cartoon bubble-style particle
        particleGraphics.fillGradientStyle(0xFFFFFF, 0xFFFFFF, 0x4ECDC4, 0x45B7D1, 1);
        particleGraphics.fillCircle(4, 4, 3.5);

        // Add highlight for 3D effect
        particleGraphics.fillStyle(0xFFFFFF, 0.8);
        particleGraphics.fillCircle(5, 3, 1.5);

        // Add subtle outline
        particleGraphics.lineStyle(1, 0x000000, 0.3);
        particleGraphics.strokeCircle(4, 4, 3.5);
        particleGraphics.generateTexture('particle', 8, 8);

        // Create cartoon-style star texture
        let starGraphics = this.make.graphics({ x: 0, y: 0, add: false });

        // Draw cartoon star with gradient
        starGraphics.fillGradientStyle(0xFECA57, 0xFECA57, 0xE17055, 0xD63031, 1);

        const cx = 4, cy = 4, spikes = 5, outerRadius = 3.5, innerRadius = 1.8;
        let rot = Math.PI / 2 * 3;
        let x = cx, y = cy;
        const step = Math.PI / spikes;

        starGraphics.beginPath();
        starGraphics.moveTo(cx, cy - outerRadius);

        for (let i = 0; i < spikes; i++) {
          x = cx + Math.cos(rot) * outerRadius;
          y = cy + Math.sin(rot) * outerRadius;
          starGraphics.lineTo(x, y);
          rot += step;

          x = cx + Math.cos(rot) * innerRadius;
          y = cy + Math.sin(rot) * innerRadius;
          starGraphics.lineTo(x, y);
          rot += step;
        }
        starGraphics.lineTo(cx, cy - outerRadius);
        starGraphics.closePath();
        starGraphics.fillPath();

        // Add star highlight
        starGraphics.fillStyle(0xFFFFAA, 0.9);
        starGraphics.fillCircle(5, 3, 1);

        // Add star outline
        starGraphics.lineStyle(1, 0x000000, 0.4);
        starGraphics.strokePath();
        starGraphics.generateTexture('star', 8, 8);

        // Create cartoon gem/diamond texture
        let diamondGraphics = this.make.graphics({ x: 0, y: 0, add: false });

        // Create a sparkling gem effect
        diamondGraphics.fillGradientStyle(0xA29BFE, 0xA29BFE, 0x6C5CE7, 0x5F3DC4, 1);

        // Diamond shape
        diamondGraphics.beginPath();
        diamondGraphics.moveTo(4, 1);
        diamondGraphics.lineTo(7, 4);
        diamondGraphics.lineTo(4, 7);
        diamondGraphics.lineTo(1, 4);
        diamondGraphics.closePath();
        diamondGraphics.fillPath();

        // Add sparkle highlights
        diamondGraphics.fillStyle(0xFFFFFF, 0.9);
        diamondGraphics.fillCircle(3, 3, 0.8);
        diamondGraphics.fillCircle(5.5, 2.5, 0.5);

        // Diamond outline
        diamondGraphics.lineStyle(1, 0x000000, 0.5);
        diamondGraphics.beginPath();
        diamondGraphics.moveTo(4, 1);
        diamondGraphics.lineTo(7, 4);
        diamondGraphics.lineTo(4, 7);
        diamondGraphics.lineTo(1, 4);
        diamondGraphics.closePath();
        diamondGraphics.strokePath();
        diamondGraphics.generateTexture('diamond', 8, 8);
      }

      create() {
        this.scene.start('MenuScene');
      }
    }

      // DOM Pool Manager Class
      createDOMPool(className) {
        return {
          pool: [],
          active: new Set(),
          className: className,
          get: function () {
            let element = this.pool.pop();
            if (!element) {
              element = document.createElement('div');
              element.className = this.className;
            }
            this.active.add(element);
            element.style.display = 'block';
            return element;
          },
          release: function (element) {
            if (this.active.delete(element)) {
              if (element.parentNode) {
                element.remove();
              }
              element.style.display = 'none';
              element.textContent = '';
              if (this.pool.length < RESPONSIVE_CONSTANTS.DOM_POOL_SIZE) {
                this.pool.push(element);
              }
            }
          },
          clear: function () {
            this.active.forEach(element => {
              if (element.parentNode) element.remove();
            });
            this.pool.forEach(element => {
              if (element.parentNode) element.remove();
            });
            this.active.clear();
            this.pool.length = 0;
          }
        };
      }

      update(time, delta) {
        if (this.gameOverFlag) return;

        // Initialize frame counter if not exists
        if (!this.frameCount) this.frameCount = 0;

        // PRIORITY 1: Critical needle update (every frame)
        this.updateNeedle(delta * 0.001);

        // PRIORITY 2: Essential updates
        if (this.frameCount % RESPONSIVE_CONSTANTS.UPDATE_ESSENTIAL === 0) {
          this.updateFeverMode(delta);
        }

        // PRIORITY 3: Visual updates
        if (this.frameCount % RESPONSIVE_CONSTANTS.UPDATE_VISUAL === 0) {
          this.updateBackgroundGlow(time);
        }

        // PRIORITY 4: Ring updates (using essential frequency)
        if (this.frameCount % RESPONSIVE_CONSTANTS.UPDATE_ESSENTIAL === 0 && this.ringStack && this.ringStack.length > 0) {
          this.ringStack.forEach(ring => {
            if (ring.needsUpdate && ring.graphics && ring.movementEnabled) {
              ring.update(delta);
            }
          });
        }

        // PRIORITY 5: Non-critical updates
        if (this.frameCount % RESPONSIVE_CONSTANTS.UPDATE_NONCRITICAL === 0) {
          this.updatePlutoMood(delta);

          // Pluto animations handled by unified system
        }

        this.frameCount = (this.frameCount + 1) % RESPONSIVE_CONSTANTS.UPDATE_CYCLE;
      }

      setupNeedle() {
        // Create simple and visible needle system
        this.needleAngle = 0;
        this.originalNeedleSpeed = Phaser.Math.DegToRad(180);
        this.needleSpeed = this.originalNeedleSpeed;

      drawNeedle() {
        this.needle.clear();

        // Draw a simple but very visible needle
        const needleColor = this.isInSweetSpot ? 0xFFFFFF : 0xFF0000; // White in sweet spot, red otherwise

        // Draw needle as a thick line with circle
        this.needle.fillStyle(needleColor);
        this.needle.fillCircle(0, 0, 6); // Center circle

        this.needle.lineStyle(4, needleColor);
        this.needle.beginPath();
        this.needle.moveTo(0, 0);
        this.needle.lineTo(25, 0); // Point outward
        this.needle.strokePath();

        // Add a triangle tip for better visibility
        this.needle.fillStyle(needleColor);
        this.needle.beginPath();
        this.needle.moveTo(25, 0);   // tip
        this.needle.lineTo(15, -4);  // top
        this.needle.lineTo(15, 4);   // bottom
        this.needle.closePath();
        this.needle.fillPath();
      }

      getActiveDesign() {
        // Cache the active design to avoid recalculation
        if (this.cachedDesign && this.cachedDesign.level === this.level) {
          return this.cachedDesign;
        }

        let design;
        if (this.baseMode) {
          const mod = this.level - 1;
          const difficultyMultiplier = Math.min(mod * 0.08, 3); // Cap difficulty scaling

          design = {
            name: this.baseMode.name,
            theme: this.baseMode.theme,
            color: this.baseMode.color,
            bgColor: this.baseMode.bgColor,
            particleColors: this.baseMode.particleColors,
            ringColors: this.baseMode.ringColors,
            specialEffects: this.baseMode.specialEffects,
            sweetSpotSize: Math.max(this.baseMode.sweetSpotSize - mod * 0.5, 3), // Slower reduction
            needleSpeed: this.baseMode.needleSpeed * (1 + difficultyMultiplier),
            ringMovement: this.baseMode.ringMovement,
            ringSpeed: (this.baseMode.ringSpeed || 0) * (1 + difficultyMultiplier * 0.5),
            needleReverseProb: this.baseMode.needleReverseProb || 0
          };
        } else {
          const designIndex = Math.min(this.level - 1, this.levelDesigns.length - 1);
          design = this.levelDesigns[designIndex];
        }

        // Cache the design with level info
        this.cachedDesign = { ...design, level: this.level };
        return design;
      }



      updateBackgroundGlow(time) {
        // Ultra-conservative update - only when significant change
        const newIntensity = this.feverMode ? 0.3 : 0.1;
        const newPulseFactor = Math.sin(time / 800) * 0.03 + newIntensity; // Slower, smaller pulse

        // Skip update if change is tiny (increased threshold for performance)
        if (this.lastPulseFactor && Math.abs(newPulseFactor - this.lastPulseFactor) < 0.02) {
          return;
        }

        // Cache design color to avoid repeated calls
        if (!this.cachedGlowColor || this.frameCount % 60 === 0) {
          this.cachedGlowColor = this.getActiveDesign().color;
        }

        this.backgroundGlow.clear();
        this.backgroundGlow.fillStyle(this.cachedGlowColor, newPulseFactor);
        this.backgroundGlow.fillCircle(this.center.x, this.center.y, this.baseRadius * 2.5); // Smaller glow

        this.lastPulseFactor = newPulseFactor;
      }

      updateNeedle(dt) {
        // Only update needle if it's active (all rings created)
        if (!this.needleActive || !this.activeRing) return;

        // Update needle angle
        this.needleAngle += this.needleSpeed * dt;

        // Keep angle in range
        this.needleAngle = this.needleAngle % (Math.PI * 2);
        if (this.needleAngle < 0) this.needleAngle += Math.PI * 2;

        // Calculate needle position on active ring
        const radius = this.activeRing.radius + this.activeRing.thickness / 2 + 15;
        const x = this.center.x + Math.cos(this.needleAngle) * radius;
        const y = this.center.y + Math.sin(this.needleAngle) * radius;

        // Update needle position and rotation
        this.needle.x = x;
        this.needle.y = y;
        this.needle.rotation = this.needleAngle + Math.PI; // Point toward center

        // Check sweet spot
        const angleDiff = Math.abs(Phaser.Math.Angle.Wrap(this.needleAngle - this.activeRing.sweetSpotAngle));
        const sweetSpotThreshold = Phaser.Math.DegToRad(this.getActiveDesign().sweetSpotSize);
        const wasInSweetSpot = this.isInSweetSpot;
        this.isInSweetSpot = angleDiff <= sweetSpotThreshold;

        // Redraw needle only when absolutely necessary (performance optimization)
        if (this.isInSweetSpot !== wasInSweetSpot || this.frameCount % 10 === 0) {
          this.drawNeedle();
        }
      }

      updateFeverMode(delta) {
        if (this.feverMode) {
          this.feverTimer -= delta;
          if (this.feverTimer <= 0) {
            this.feverMode = false;
            this.feverText.setText('');
            // Remove fever overlay if still exists
            const existingFever = document.getElementById('current-fever-overlay');
            if (existingFever) {
              existingFever.remove();
            }
          } else {
            this.feverText.setText('FEVER MODE: ' + Math.ceil(this.feverTimer / 1000) + 's');
          }
        }
      }

      updatePlutoMood(delta) {
        if (!this.plutoBody) return;

        // Don't change mood if Pluto is in the middle of a special animation
        if (this.plutoIsAnimating) {
          this.checkRingProximity();
          return;
        }

        // Update orbit timer
        this.plutoOrbitTimer += delta;

        // Determine Pluto's mood based on game state
        let newMood = 'idle';

        // Priority system: special animations have lower priority than game states
        if (this.feverMode) {
          newMood = 'excited';
        } else if (this.lives <= 1) {
          newMood = 'sad';
        } else if (this.combo >= 3) {
          newMood = 'excited';
        } else if (this.plutoOrbitTimer >= this.plutoOrbitInterval) {
          // Only trigger special animations if in neutral game state
          let randomIndex;
          do {
            randomIndex = Math.floor(Math.random() * this.plutoMovementTypes.length);
          } while (randomIndex === this.lastMovementType); // Don't repeat the same movement

          newMood = this.plutoMovementTypes[randomIndex];
          this.lastMovementType = randomIndex;
          this.plutoOrbitTimer = 0; // Reset timer
        }

        // Apply mood change if different
        if (this.plutoMood !== newMood) {
          this.changePlutoMood(newMood);
        }

        // Check ring proximity for interaction effects
        this.checkRingProximity();
      }

      changePlutoMood(mood) {
        // Use unified Pluto system instead of legacy plutoBody
        if (this.pluto && this.pluto.setAnimation) {
          this.plutoMood = mood;

          // Map moods to unified Pluto animations
          switch (mood) {
            case 'excited':
              this.pluto.setAnimation('excited');
              this.plutoIsAnimating = false; // Excited can be interrupted
              break;
            case 'sad':
              this.pluto.setMood('sad');
              this.plutoIsAnimating = false; // Sad can be interrupted
              break;
            case 'orbit':
              this.pluto.setAnimation('curious'); // Map to available animation
              this.plutoIsAnimating = true; // Block other animations

              // Return to idle after orbit
              setTimeout(() => {
                if (this.plutoMood === 'orbit') {
                  this.plutoIsAnimating = false;
                  this.changePlutoMood('idle');
                }
              }, 8000);
              break;
            case 'fly-around':
              this.pluto.setAnimation('cute-wiggle'); // Map to available animation
              this.plutoIsAnimating = true; // Block other animations

              // Return to idle after flying around
              setTimeout(() => {
                if (this.plutoMood === 'fly-around') {
                  this.plutoIsAnimating = false;
                  this.changePlutoMood('idle');
                }
              }, 10000);
              break;
            case 'zoom-out':
              this.pluto.setAnimation('excited');
              this.plutoIsAnimating = true; // Block other animations

              // Return to idle after zoom
              setTimeout(() => {
                if (this.plutoMood === 'zoom-out') {
                  this.plutoIsAnimating = false;
                  this.changePlutoMood('idle');
                }
              }, 6000);
              break;
            case 'spiral-dance':
              this.pluto.setAnimation('cute-wiggle');
              this.plutoIsAnimating = true; // Block other animations

              // Return to idle after spiral dance
              setTimeout(() => {
                if (this.plutoMood === 'spiral-dance') {
                  this.plutoIsAnimating = false;
                  this.changePlutoMood('idle');
                }
              }, 8000);
              break;
            default: // idle
              this.pluto.setAnimation('idle');
              this.plutoIsAnimating = false;
              break;
          }
        }
      }

      checkRingProximity() {
        if (!this.ringStack || !this.plutoBody) return;

        const plutoCenterX = this.center.x;
        const plutoCenterY = this.center.y;

        // Check each ring's distance from Pluto
        this.ringStack.forEach((ring, index) => {
          const ringDistance = ring.radius;

          // If ring is close to Pluto (within 150px), add proximity effect
          if (ringDistance < 150) {
            // For graphics objects, use tint property directly
            ring.graphics.tint = 0xffaa00; // Golden tint when close
            ring.graphics.alpha = 0.9 + Math.sin(Date.now() * 0.01) * 0.1; // Pulsing

            // Add extra glow effect by modifying the ring's special state
            if (!ring.proximityEffect) {
              ring.proximityEffect = true;
              // Mark ring as special - it will be redrawn with glow
              ring.isDirty = true;
            }
          } else {
            // Remove tint and effects
            ring.graphics.tint = 0xffffff; // Reset to white (normal)
            ring.graphics.alpha = 1;

            if (ring.proximityEffect) {
              ring.proximityEffect = false;
              ring.isDirty = true; // Redraw without special effects
            }
          }
        });
      }

      handleInput() {
        try {
          // Enhanced null checks for touch stability
          if (this.gameOverFlag || !this.activeRing || !this.activeRing.graphics || this.activeRing.graphics.destroyed) {
            return;
          }

          // Dynamic input throttling - Responsive to device type
          const now = performance.now();
          const dynamicThrottle = this.feverMode ?
            RESPONSIVE_CONSTANTS.INPUT_THROTTLE_FEVER :
            RESPONSIVE_CONSTANTS.INPUT_THROTTLE_NORMAL;
          if (this.lastInputTime && now - this.lastInputTime < dynamicThrottle) return;
          this.lastInputTime = now;

          // Verify activeRing properties exist before using them
          if (typeof this.needleAngle === 'undefined' || typeof this.activeRing.sweetSpotAngle === 'undefined') {
            console.warn('Touch event received with undefined angle values');
            return;
          }

          this.activeRing.inputReceived = true;

          // Cached angle difference calculation with safety checks
          const angleDiff = Phaser.Math.Angle.Wrap(this.needleAngle - this.activeRing.sweetSpotAngle);
          const absAngleDiff = Math.abs(angleDiff);

          // Pre-calculate threshold to avoid repeated calculations
          if (!this.cachedThreshold) {
            const design = this.getActiveDesign();
            if (design && typeof design.sweetSpotSize !== 'undefined') {
              this.cachedThreshold = Phaser.Math.DegToRad(design.sweetSpotSize);
            } else {
              this.cachedThreshold = Phaser.Math.DegToRad(15); // Default fallback
            }
          }

          if (absAngleDiff <= this.cachedThreshold) {
            this.handleSuccessfulHit();
          } else {
            // Wrong place click - add shake effect here too
            if (this.cameras && this.cameras.main) {
              this.cameras.main.shake(200, 0.02); // Medium intensity shake for wrong place
            }

            // Safety check before animating
            if (this.activeRing && this.activeRing.graphics && !this.activeRing.graphics.destroyed) {
              this.tweens.add({
                targets: this.activeRing.graphics,
                x: this.activeRing.x + 7,
                y: this.activeRing.y + 7,
                yoyo: true,
                duration: 60,
                repeat: 2,
                onComplete: () => {
                  // Double-check ring still exists
                  if (this.activeRing && this.activeRing.graphics && !this.activeRing.graphics.destroyed) {
                    this.activeRing.graphics.x = this.activeRing.x;
                    this.activeRing.graphics.y = this.activeRing.y;
                  }
                }
              });
            }

            // Trigger quick Pluto reaction for wrong place
            this.changePlutoMood('sad');

            this.handleMiss();
          }
          this.resetRegenTimer();
        } catch (error) {
          console.error('Touch input error:', error);
          // Gracefully continue - don't crash the game
          if (this.activeRing) {
            this.activeRing.inputReceived = true;
          }
        }
      }

      handleSuccessfulHit() {
        // Flash effect removed for better user experience

        // Set chain break flag for animation
        this.justBrokeChain = true;

        // Ultra-reduced particle count for maximum performance
        this.emitParticles('break', this.center.x, this.center.y);

        // Minimal spark effects
        this.emitParticles('spark', this.center.x, this.center.y);
        this.cameras.main.shake(100, 0.008); // Shorter, less intense shake

        // Background particles already configured with design colors

        // Activate fever mode particle effects
        if (this.feverMode) {
          this.emitParticles('fever');
        }

        let multiplier = this.feverMode ? 2 : (1 + this.combo * 0.1);
        let points = Math.floor(10 * multiplier);
        let popupX = this.center.x + Math.cos(this.needleAngle) * this.activeRing.radius;
        let popupY = this.center.y + Math.sin(this.needleAngle) * this.activeRing.radius;
        this.showScorePopup(points, popupX, popupY);

        // Store reference to broken ring for animation
        const brokenRing = this.activeRing;

        // Immediately switch to next ring (don't wait for animation)
        Phaser.Utils.Array.Remove(this.ringStack, this.activeRing);
        if (this.ringStack.length === 0) {
          this.levelUp();
        } else {
          this.activeRing = this.ringStack[this.ringStack.length - 1];
        }

        // Play broken ring animation in background
        this.tweens.add({
          targets: brokenRing.graphics,
          scaleX: 0,
          scaleY: 0,
          alpha: 0,
          ease: 'Power2',
          duration: 800, // Slower animation for visual appeal
          onComplete: () => {
            brokenRing.destroy(); // Clean up when animation finishes
          }
        });
        this.combo++;
        this.comboText.setText('Combo: ' + this.combo);
        this.score += points;
        this.scoreText.setText('Score: ' + this.score);
        this.needleSpeed *= 1.03;
        this.regenDelay = Math.max(3000, this.regenDelay * 0.98);

        // Trigger Pluto reactions based on combo - use changePlutoMood instead
        // Only trigger excited on specific combo milestones, not every hit
        if (this.combo === 5 || this.combo === 10 || this.combo === 15) {
          this.changePlutoMood('excited');
          // Return to idle after 2 seconds
          setTimeout(() => {
            this.changePlutoMood('idle');
          }, 2000);
        }

        if (this.combo >= 5 && !this.feverMode) {
          this.activateFeverMode();
        }

        // Show combo effect for significant combos
        if (this.combo > 0 && this.combo % 3 === 0) {
          this.showComboEffect();
        }
      }

      // Enhanced score popup with object pooling - performance optimized
      showScorePopup(points, x, y) {
        // Throttle score popup creation to prevent spam
        if (this.lastScorePopupTime && Date.now() - this.lastScorePopupTime < 50) return;
        this.lastScorePopupTime = Date.now();

        // Use DOM pool manager
        const scoreDiv = this.domPools.scorePopup.get();
        scoreDiv.textContent = '+' + points;
        scoreDiv.style.left = x + 'px';
        scoreDiv.style.top = y + 'px';
        document.body.appendChild(scoreDiv);

        // Return to pool after animation completes
        this.time.delayedCall(800, () => {
          this.domPools.scorePopup.release(scoreDiv);
        });
      }

      handleMiss() {
        this.combo = 0;
        this.comboText.setText('Combo: ' + this.combo);
        this.lives--;
        this.livesText.setText('Lives: ' + this.lives);

        // Pluto reacts to miss - first sad, then idle
        this.changePlutoMood('sad');
        setTimeout(() => {
          this.changePlutoMood('idle');
        }, 1500);

        // Stronger shake effect - increased duration and intensity
        this.cameras.main.shake(300, 0.03); // Increased from 150, 0.015
        this.tweens.add({
          targets: this.activeRing.graphics,
          x: this.activeRing.x + 10, // Increased from 5
          y: this.activeRing.y + 10, // Increased from 5
          yoyo: true,
          duration: 80, // Increased from 50
          repeat: 3,    // Increased from 2
          onComplete: () => {
            this.activeRing.graphics.x = this.activeRing.x;
            this.activeRing.graphics.y = this.activeRing.y;
          }
        });
        if (this.lives <= 0) {
          this.gameOver();
        }
      }

      activateFeverMode() {
        this.feverMode = true;
        this.feverTimer = this.feverModeDuration;
        this.feverText.setText('FEVER MODE: 5s');
        this.cameras.main.flash(500, 255, 0, 255);

        // Use DOM pool for fever overlay
        const feverDiv = this.domPools.fever.get();
        feverDiv.id = 'current-fever-overlay';
        document.body.appendChild(feverDiv);

        // Store reference for cleanup
        this.currentFeverOverlay = feverDiv;

        // Return to pool when fever mode ends
        this.time.delayedCall(this.feverModeDuration, () => {
          if (this.currentFeverOverlay) {
            this.domPools.fever.release(this.currentFeverOverlay);
            this.currentFeverOverlay = null;
          }
        });
      }

      showComboEffect() {
        // Throttle combo effect to prevent spam
        if (this.lastComboEffectTime && Date.now() - this.lastComboEffectTime < 500) return;
        this.lastComboEffectTime = Date.now();

        // Use DOM pool manager
        const comboDiv = this.domPools.comboEffect.get();
        comboDiv.textContent = `COMBO x${this.combo}!`;
        document.body.appendChild(comboDiv);

        // Return to pool after animation completes
        this.time.delayedCall(600, () => {
          this.domPools.comboEffect.release(comboDiv);
        });
      }

      resetRegenTimer() {
        if (this.regenTimer) {
          this.regenTimer.remove(false);
        }
        this.regenTimer = this.time.addEvent({
          delay: this.regenDelay,
          callback: this.regenerateRing,
          callbackScope: this
        });
      }

      regenerateRing() {
        if (this.activeRing && !this.activeRing.inputReceived) {
          this.combo = 0;
          this.comboText.setText('Combo: 0');
          // Return to idle when combo resets due to timeout
          this.changePlutoMood('idle');
        }

        // Dynamic max rings based on level design and device capabilities
        const design = this.getActiveDesign();
        const maxRings = Math.min(RESPONSIVE_CONSTANTS.MAX_RINGS, RESPONSIVE_CONSTANTS.INITIAL_RINGS + Math.floor(this.level / 3));

        if (this.ringStack.length >= maxRings) {
          this.gameOver();
          return;
        }
        let lastRadius = this.ringStack.length > 0
          ? this.ringStack[this.ringStack.length - 1].radius
          : this.baseRadius - (this.ringThickness + this.ringGap);
        let newRadius = lastRadius + this.ringThickness + this.ringGap;
        let ringColor = Phaser.Utils.Array.GetRandom(this.getActiveDesign().ringColors);
        let newRing = new Ring(this, this.center.x, this.center.y, newRadius, this.ringThickness, ringColor, this.getActiveDesign());

        // Ring spawns instantly during gameplay - no animation for speed
        newRing.graphics.alpha = 1;
        newRing.graphics.scaleX = 1;
        newRing.graphics.scaleY = 1;

        // Ring is immediately interactive - no delay
        newRing.inputReceived = false;

        // No animation - instant spawn for fast gameplay
        // Ring appears immediately without any transition

        this.ringStack.push(newRing);
        this.activeRing = newRing;
        this.resetRegenTimer();
      }

      levelUp() {
        // Ultra-reduced confetti for performance
        this.emitParticles('confetti', this.center.x, this.center.y);
        this.cameras.main.flash(300, 0, 255, 0); // Shorter flash

        // Set level complete flag for animation
        this.levelComplete = true;

        // Reset after animation (Phaser timing optimization)
        this.time.delayedCall(2500, () => {
          this.levelComplete = false;
        });

        // Use DOM pool for level-up effect
        const levelUpDiv = this.domPools.levelUp.get();
        levelUpDiv.textContent = 'LEVEL UP!';
        document.body.appendChild(levelUpDiv);

        // Return to pool after animation completes
        this.time.delayedCall(2000, () => {
          this.domPools.levelUp.release(levelUpDiv);
        });
        this.level++;
        this.levelText.setText('Level: ' + this.level);
        const design = this.getActiveDesign();
        this.themeText.setText(design.name + ': ' + design.theme);
        this.needleSpeed = this.originalNeedleSpeed * design.needleSpeed;
        this.needleReverseProb = design.needleReverseProb || 0;
        this.regenDelay = Math.max(2000, 5000 - (this.level * 200));
        if (this.level % 3 === 0) {
          this.lives = Math.min(this.lives + 1, 5);
          this.livesText.setText('Lives: ' + this.lives);
          let bonusText = this.add.text(this.center.x, this.center.y + 60, '+1 LIFE!', {
            font: '32px Arial',
            fill: '#ff5555',
            stroke: '#000000',
            strokeThickness: 4
          }).setOrigin(0.5);
          this.tweens.add({
            targets: bonusText,
            alpha: 0,
            y: this.center.y + 30,
            duration: 1200,
            ease: 'Power2',
            onComplete: () => bonusText.destroy()
          });
        }
        this.time.delayedCall(1000, () => { this.startLevel(); }, [], this);
      }

      startLevel() {
        const design = this.getActiveDesign();
        this.currentRingColor = design.color;
        this.cameras.main.setBackgroundColor(design.bgColor);
        // Background particles already configured with design colors
        this.themeText.setText(design.name + ': ' + design.theme);
        this.ringStack = [];

        // Stop needle during ring creation
        this.needleActive = false;

        // Dynamic ring count based on device and difficulty
        const numRings = Math.min(RESPONSIVE_CONSTANTS.MAX_RINGS, RESPONSIVE_CONSTANTS.INITIAL_RINGS + Math.floor(this.level / 5));
        const radiusIncrement = this.ringThickness + this.ringGap;

        // Pre-calculate colors for better performance
        const colorPool = [...design.ringColors];

        for (let i = 0; i < numRings; i++) {
          const radius = this.baseRadius + i * radiusIncrement;
          const ringColor = colorPool[i % colorPool.length]; // Cycle through colors
          const ring = new Ring(this, this.center.x, this.center.y, radius, this.ringThickness, ringColor, design);

          // Add smooth spawn animation for initial rings - simple and fluid
          ring.graphics.alpha = 0;
          ring.graphics.scaleX = 0.5;
          ring.graphics.scaleY = 0.5;

          // Responsive staggered animations based on device performance
          this.tweens.add({
            targets: ring.graphics,
            alpha: 1,
            scaleX: 1,
            scaleY: 1,
            duration: RESPONSIVE_CONSTANTS.ANIM_RING_SPAWN,
            ease: 'Sine.easeOut',
            delay: i * RESPONSIVE_CONSTANTS.ANIM_RING_SPAWN_DELAY,
            onComplete: () => {
              ring.graphics.alpha = 1;
              ring.graphics.scaleX = 1;
              ring.graphics.scaleY = 1;

              // If this is the last ring, start the needle
              if (i === numRings - 1) {
                this.time.delayedCall(300, () => {
                  this.needleActive = true;

                });
              }
            }
          });

          this.ringStack.push(ring);
        }

        this.activeRing = this.ringStack[this.ringStack.length - 1];

        // Invalidate cached values when starting new level
        this.cachedDesign = null;
        this.cachedThreshold = null;

        // Create 3D CSS Pluto in the center
        // Pluto is already set up and positioned for game mode

        this.resetRegenTimer();
      }

      gameOver() {
        this.gameOverFlag = true;
        this.gameOverText.setText('GAME OVER\nScore: ' + this.score + '\nLevel: ' + this.level + '\nClick to Restart');
        this.ringStack.forEach(ring => {
          this.tweens.add({
            targets: ring.graphics,
            alpha: 0,
            duration: 500
          });
        });
        this.input.once('pointerdown', () => {
          this.resetGame();
          this.gameOverFlag = false;
          this.gameOverText.setText('');
        });
      }

      resetGame() {
        // Clean up global references
        if (window.currentGameInstance === this) {
          window.currentGameInstance = null;
        }

        // Disable global speech bubbles when resetting
        document.body.classList.remove('game-active');

        // Clear all timers and tweens
        if (this.regenTimer) this.regenTimer.remove(false);

        // Clean up space background effect timers (only stars now)

        this.tweens.killAll();

        // Clean up CSS effects from DOM
        this.cleanupCSSEffects();

        // Clean up CSS Pluto
        if (this.cssPlutoContainer) {
          this.cssPlutoContainer.remove();
          this.cssPlutoContainer = null;
          this.plutoBody = null;
          this.plutoMood = 'idle';
          this.plutoOrbitTimer = 0;
          this.lastMovementType = -1;
          this.plutoIsAnimating = false;
        }

        // Clean up space background containers
        if (this.starsContainer) {
          this.starsContainer.destroy();
          this.starsContainer = null;
        }

        // Clean up ring stack
        if (this.ringStack) {
          this.ringStack.forEach(ring => ring.destroy());
          this.ringStack.length = 0; // Clear array
        }

        // Clean up DOM pools properly
        if (this.domPools) {
          Object.values(this.domPools).forEach(pool => {
            pool.clear();
          });
        }

        // Memory cleanup (texture cache removed for stability)

        // Reset game state - complete reset including timers
        this.level = 1;
        this.score = 0;
        this.combo = 0;
        this.lives = RESPONSIVE_CONSTANTS.INITIAL_LIVES;
        this.needleSpeed = this.originalNeedleSpeed;
        this.regenDelay = RESPONSIVE_CONSTANTS.REGEN_DELAY;
        this.feverMode = false;
        this.cachedThreshold = null; // Clear cached threshold
        this.frameCount = 0;

        // Reset throttling timers to prevent input blocking after restart
        this.lastInputTime = null;
        this.lastScorePopupTime = null;
        this.lastComboEffectTime = null;

        // Reset performance optimization variables
        this.lastNeedleColor = null;
        this.lastPulseFactor = null;

        // Update UI
        this.levelText.setText('Level: ' + this.level);
        this.scoreText.setText('Score: 0');
        this.comboText.setText('Combo: 0');
        this.livesText.setText('Lives: 3');
        this.feverText.setText('');

        // Recreate space background effects
        if (typeof this.createStarsBackground === 'function') {
          this.createStarsBackground();
        }

        this.startLevel();
      }

      cleanupCSSEffects() {
        // Remove any remaining CSS effects from DOM
        const effectClasses = ['level-up', 'score-popup', 'combo-effect', 'fever-mode'];
        effectClasses.forEach(className => {
          const elements = document.querySelectorAll('.' + className);
          elements.forEach(element => element.remove());
        });

        // Remove any fever overlay with ID
        const feverOverlay = document.getElementById('current-fever-overlay');
        if (feverOverlay) {
          feverOverlay.remove();
        }
      }

      // Missing function: Pluto animation trigger
      triggerPlutoAnimation(mood) {
        // Safety check to prevent errors
        if (!this.cssPlutoContainer || !this.plutoBody) {
          return;
        }

        try {
          // Simple CSS class-based mood system
          this.plutoBody.className = 'pluto-body ' + mood;
          this.plutoMood = mood;

          // Optional: Add some basic animation effects
          switch (mood) {
            case 'excited':
              this.plutoBody.style.transform = 'scale(1.1)';
              break;
            case 'happy':
              this.plutoBody.style.transform = 'scale(1.05)';
              break;
            case 'confused':
              this.plutoBody.style.transform = 'scale(0.95) rotate(5deg)';
              break;
            case 'idle':
            default:
              this.plutoBody.style.transform = 'scale(1)';
              break;
          }

          // Reset transform after animation (Phaser timing optimization)
          this.time.delayedCall(300, () => {
            if (this.plutoBody) {
              this.plutoBody.style.transform = 'scale(1)';
            }
          });
        } catch (error) {
          console.warn('Pluto animation error:', error);
        }
      }

      // Missing function: Stars background creation
      createStarsBackground() {
        // Safety check - don't create if already exists
        if (this.starsContainer) {
          return;
        }

        try {
          // Create simple stars background
          this.starsContainer = this.add.group();

          // Create fewer stars for better performance
          for (let i = 0; i < 50; i++) {
            const star = this.add.circle(
              Phaser.Math.Between(0, this.cameras.main.width),
              Phaser.Math.Between(0, this.cameras.main.height),
              Phaser.Math.FloatBetween(0.5, 2),
              0xffffff,
              Phaser.Math.FloatBetween(0.3, 0.8)
            );

            // Simple twinkling effect
            this.tweens.add({
              targets: star,
              alpha: Phaser.Math.FloatBetween(0.2, 1),
              duration: Phaser.Math.Between(1000, 3000),
              yoyo: true,
              repeat: -1,
              ease: 'Sine.easeInOut'
            });

            this.starsContainer.add(star);
          }
        } catch (error) {
          console.warn('Stars background creation error:', error);
        }
      }

      // Unified particle emission method
      emitParticles(type, x, y) {
        const config = this.particleConfigs[type];
        if (!config) return;

        // Configure emitter based on type
        const baseConfig = {
          ...config,
          tint: this.selectedMode ? this.selectedMode.particleColors : colorSystem.convertedPalettes.neon,
          emitting: false
        };

        // Special positioning for certain types
        if (type === 'fever') {
          baseConfig.x = { min: 0, max: this.cameras.main.width };
          baseConfig.y = { min: 0, max: this.cameras.main.height };
        } else if (type === 'confetti') {
          baseConfig.x = { min: 0, max: this.cameras.main.width };
          baseConfig.y = -50;
        }

        // Update emitter configuration
        this.unifiedParticles.setTexture(config.texture);
        this.unifiedParticles.setConfig(baseConfig);

        // Emit particles
        if (type === 'fever') {
          this.unifiedParticles.start();
          this.time.delayedCall(500, () => { this.unifiedParticles.stop(); });
        } else {
          this.unifiedParticles.explode(config.quantity, x || this.center.x, y || this.center.y);
        }
      }

      // Handle responsive resize - updates game dimensions and constants
      handleResize(newConstants) {
        if (this.gameOverFlag) return;

        // Update instance constants
        this.maxPoolSize = newConstants.DOM_POOL_SIZE;
        this.targetFPS = newConstants.TARGET_FPS;
        this.frameBudget = 1000 / this.targetFPS;
        this.baseRadius = newConstants.BASE_RADIUS;
        this.ringThickness = newConstants.RING_THICKNESS;
        this.ringGap = newConstants.RING_GAP;
        this.feverModeDuration = newConstants.FEVER_DURATION;
        this.regenDelay = newConstants.REGEN_DELAY;

        // Update center point
        this.center = {
          x: window.innerWidth / 2,
          y: window.innerHeight / 2
        };

        // Recreate background to fit new dimensions
        if (this.backgroundGradient) {
          this.backgroundGradient.clear();
          this.backgroundGradient.fillGradientStyle(
            0x1b2735, 0x1b2735, 0x090a0f, 0x090a0f, 1
          );
          this.backgroundGradient.fillRect(0, 0, this.cameras.main.width, this.cameras.main.height);
        }

        // Recreate ambient light
        if (this.ambientLight) {
          this.ambientLight.clear();
          this.ambientLight.fillGradientStyle(
            0x1e3c72, 0x16213e, 0x0f3460, 0x533483, 0.3
          );
          this.ambientLight.fillRect(0, 0, this.cameras.main.width, this.cameras.main.height);
        }

        // Adjust existing rings to fit new constraints
        if (this.ringStack && this.ringStack.length > 0) {
          this.adjustRingsToNewDimensions(newConstants);
        }

        // Update Pluto responsive settings
        if (this.pluto && this.pluto.element) {
          this.applyPlutoResponsiveSettings();
        }

        console.log(`🔧 Game resized for ${DeviceDetector.getDeviceType()}: ${window.innerWidth}x${window.innerHeight}`);
      }

      // Adjust existing rings to new screen dimensions
      adjustRingsToNewDimensions(newConstants) {
        const maxAllowedRadius = Math.min(window.innerWidth, window.innerHeight) / 2 - 60;

        this.ringStack.forEach((ring, index) => {
          const newRadius = newConstants.BASE_RADIUS + index * (newConstants.RING_THICKNESS + newConstants.RING_GAP);

          // Only adjust if ring would fit on screen
          if (newRadius <= maxAllowedRadius) {
            ring.radius = newRadius;
            ring.thickness = newConstants.RING_THICKNESS;
            ring.x = this.center.x;
            ring.y = this.center.y;

            // Update ring graphics position
            if (ring.graphics) {
              ring.graphics.x = this.center.x;
              ring.graphics.y = this.center.y;
              ring.isDirty = true; // Mark for redraw
            }
          } else {
            // Remove rings that don't fit
            ring.destroy();
            this.ringStack.splice(index, 1);
          }
        });

        // Update active ring reference
        if (this.ringStack.length > 0) {
          this.activeRing = this.ringStack[this.ringStack.length - 1];
        }
      }

      // Apply responsive settings to Pluto
      applyPlutoResponsiveSettings() {
        if (!this.pluto || !this.pluto.element) return;

        const scale = RESPONSIVE_CONSTANTS.PLUTO_SCALE;
        const deviceType = DeviceDetector.getDeviceType();

        // Apply scaling to the container (centering is handled by CSS)
        this.plutoContainer.style.transform = `translate(-50%, -50%) scale(${scale})`;
        this.plutoContainer.style.transformOrigin = 'center center';

        // Apply animation speed to all CSS animations
        const animationSpeed = RESPONSIVE_CONSTANTS.PLUTO_ANIMATION_SPEED;
        this.pluto.element.style.animationDuration = `${2 / animationSpeed}s`; // Base 2s animation

        // Apply to all child elements that might have animations
        const childElements = this.pluto.element.querySelectorAll('*');
        childElements.forEach(child => {
          child.style.animationDuration = `inherit`;
        });

        // Note: Z-index and opacity are now handled by CSS media queries

        // Force Pluto to recenter after all changes
        if (this.pluto.resetPosition) {
          setTimeout(() => {
            this.pluto.resetPosition();
            // Re-apply scaling to container (centering is guaranteed by CSS)
            this.plutoContainer.style.transform = `translate(-50%, -50%) scale(${scale})`;
            this.plutoContainer.style.transformOrigin = 'center center';
          }, 100);
        }

        console.log(`🔧 Pluto centered and scaled to ${scale}x, anim speed: ${RESPONSIVE_CONSTANTS.PLUTO_ANIMATION_SPEED}x for ${deviceType}`);
      }

    }


    // Ring sınıfı: Her çemberi, glow, 3D gölge, sweet spot ve ok ile çizer.
    class Ring {
      constructor(scene, x, y, radius, thickness, ringColor, design = {}) {
        this.scene = scene;
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.thickness = thickness;
        this.ringColor = ringColor || 0x00ffff;
        this.graphics = scene.add.graphics({ x: x, y: y });
        this.sweetSpotAngle = Phaser.Math.FloatBetween(0, Math.PI * 2);
        this.debugText = null;
        this.design = design;
        this.pulseDirection = 1;
        this.pulseMagnitude = 0;
        this.inputReceived = false;
        this.movementEnabled = design.ringMovement || false;
        this.movementSpeed = design.ringSpeed || 0.0005;
        this.needsUpdate = this.movementEnabled || design.pulsingRings;
        this.proximityEffect = false; // For Pluto proximity interactions

        // Performance: Pre-calculate frequently used values
        this.arcWidth = Phaser.Math.DegToRad(this.design.sweetSpotSize || 15);
        this.arrowCosCache = Math.cos(this.sweetSpotAngle);
        this.arrowSinCache = Math.sin(this.sweetSpotAngle);
        this.isDirty = true;
        this.hasDrawn = false;

        if (this.scene.debugMode) {
          this.debugText = this.scene.add.text(this.x, this.y, '', { font: '12px Arial', fill: '#ff0000' }).setOrigin(0.5);
        }
        this.draw();
      }

      draw() {
        // Enhanced caching system - skip if no changes
        if (!this.isDirty && this.hasDrawn) return;

        // Skip clear if graphics hasn't changed significantly
        if (this.isDirty || !this.hasDrawn) {
          this.graphics.clear();
        }

        // Simplified ring drawing for performance - remove excessive gradients
        const coreColor = this.ringColor;
        const glowColor = this.proximityEffect ? 0xffd700 : coreColor;

        // Single shadow layer (removed multiple shadows)
        this.graphics.fillStyle(0x000000, 0.2);
        this.graphics.fillCircle(2, 2, this.radius + 1);

        // Simplified glow (single layer instead of multiple)
        const glowAlpha = this.proximityEffect ? 0.3 : 0.1;
        this.graphics.lineStyle(this.thickness + 4, glowColor, glowAlpha);
        this.graphics.strokeCircle(0, 0, this.radius);

        // Main ring (single layer instead of 4 layers)
        this.graphics.lineStyle(this.thickness, coreColor, 1.0);
        this.graphics.strokeCircle(0, 0, this.radius);

        // Simplified sweet spot (2 layers instead of multiple)
        const sweetSpotColor = 0xFFFFFF;

        // Sweet spot glow
        this.graphics.lineStyle(this.thickness + 2, sweetSpotColor, 0.4);
        this.graphics.beginPath();
        this.graphics.arc(0, 0, this.radius, this.sweetSpotAngle - this.arcWidth, this.sweetSpotAngle + this.arcWidth, false);
        this.graphics.strokePath();

        // Sweet spot main
        this.graphics.lineStyle(this.thickness - 2, sweetSpotColor, 1.0);
        this.graphics.beginPath();
        this.graphics.arc(0, 0, this.radius, this.sweetSpotAngle - this.arcWidth, this.sweetSpotAngle + this.arcWidth, false);
        this.graphics.strokePath();

        // Simplified arrow (removed shadows and excessive details)
        const arrowX = this.arrowCosCache * (this.radius - this.thickness - 6);
        const arrowY = this.arrowSinCache * (this.radius - this.thickness - 6);

        // Simple arrow (single layer)
        this.graphics.fillStyle(sweetSpotColor, 1);
        this.graphics.beginPath();
        this.graphics.moveTo(arrowX, arrowY);
        this.graphics.lineTo(arrowX - 6, arrowY - 8);
        this.graphics.lineTo(arrowX + 6, arrowY - 8);
        this.graphics.closePath();
        this.graphics.fillPath();

        // Cache state
        this.hasDrawn = true;
        this.isDirty = false;

        // Debug text only if enabled
        if (this.debugText && this.scene.debugMode) {
          this.debugText.setText('A:' + Math.round(Phaser.Math.RadToDeg(this.sweetSpotAngle)));
        }
      }

      update(delta) {
        let needsRedraw = false;

        // Movement optimization - higher threshold to reduce unnecessary updates
        if (this.movementEnabled) {
          const oldAngle = this.sweetSpotAngle;
          this.sweetSpotAngle += this.movementSpeed * delta;
          if (this.sweetSpotAngle > Math.PI * 2) this.sweetSpotAngle -= Math.PI * 2;

          // Higher threshold for redraw (performance optimization)
          if (Math.abs(oldAngle - this.sweetSpotAngle) > 0.01) {
            // Update cached trigonometric values
            this.arrowCosCache = Math.cos(this.sweetSpotAngle);
            this.arrowSinCache = Math.sin(this.sweetSpotAngle);
            this.isDirty = true;
            needsRedraw = true;
          }
        }

        // Pulse optimization - less sensitive updates
        if (this.design.pulsingRings) {
          const oldMagnitude = this.pulseMagnitude;
          this.pulseMagnitude += this.pulseDirection * 0.0008 * delta; // Slower pulse
          if (this.pulseMagnitude > 0.03 || this.pulseMagnitude < -0.03) this.pulseDirection *= -1; // Smaller pulse

          // Higher threshold for scale update (performance optimization)
          if (Math.abs(oldMagnitude - this.pulseMagnitude) > 0.003) {
            this.graphics.scaleX = 1 + this.pulseMagnitude;
            this.graphics.scaleY = 1 + this.pulseMagnitude;
          }
        }

        // Only redraw if absolutely necessary
        if (needsRedraw) {
          this.draw();
        }

        // Update needsUpdate flag more conservatively
        this.needsUpdate = this.movementEnabled || this.design.pulsingRings;
      }

      destroy() {
        this.graphics.destroy();
        if (this.debugText) this.debugText.destroy();
      }
    }

    // Simple game initialization - Phaser is already loaded
    function initializeGame() {
      // Prevent duplicate initialization
      if (window.phaserGameInitialized) {
        console.log('🎮 Game already initialized, skipping...');
        return;
      }

      console.log('🎮 Initializing game...');

      // Ensure parent element exists
      const gameContainer = document.getElementById('phaser-game');
      if (!gameContainer) {
        console.error('❌ #phaser-game container not found!');
        return;
      }

      // Clear any existing content
      gameContainer.innerHTML = '';

      // Set initialization flag
      window.phaserGameInitialized = true;

      const loadingElement = document.getElementById('loading');
      if (loadingElement) {
        loadingElement.style.display = 'none';
      }

      // Try WebGL first, fallback to Canvas if failed
      let game;
      try {
        console.log('🎮 Attempting WebGL renderer...');
        game = new Phaser.Game(config);

        // Apply high-quality canvas styles after creation
        setTimeout(() => {
          const canvas = document.querySelector('#phaser-game canvas');
          if (canvas) {
            // Native resolution for crisp rendering
            const pixelRatio = window.devicePixelRatio || 1;
            const width = window.innerWidth;
            const height = window.innerHeight;

            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            canvas.style.imageRendering = 'auto';
            canvas.style.imageRendering = 'crisp-edges';
            canvas.style.imageRendering = '-webkit-optimize-contrast';

            console.log(`✅ Canvas styled for ${width}x${height} @ ${pixelRatio}x`);
          }
        }, 100);

      } catch (error) {
        console.warn('⚠️ WebGL failed, falling back to Canvas:', error);
        // Fallback to Canvas renderer
        const canvasConfig = { ...config, type: Phaser.CANVAS };
        try {
          game = new Phaser.Game(canvasConfig);

          // Apply high-quality canvas styles after fallback creation
          setTimeout(() => {
            const canvas = document.querySelector('#phaser-game canvas');
            if (canvas) {
              // Native resolution for crisp rendering (fallback)
              const pixelRatio = window.devicePixelRatio || 1;
              const width = window.innerWidth;
              const height = window.innerHeight;

              canvas.style.position = 'fixed';
              canvas.style.top = '0';
              canvas.style.left = '0';
              canvas.style.width = width + 'px';
              canvas.style.height = height + 'px';
              canvas.style.imageRendering = 'auto';
              canvas.style.imageRendering = 'crisp-edges';
              canvas.style.imageRendering = '-webkit-optimize-contrast';

              console.log(`✅ Canvas styled for ${width}x${height} @ ${pixelRatio}x (fallback)`);
            }
          }, 100);

        } catch (canvasError) {
          console.error('❌ Both WebGL and Canvas failed:', canvasError);
          // Show fallback error message
          const errorDiv = document.createElement('div');
          errorDiv.innerHTML = `
            <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                        background: #333; color: white; padding: 20px; border-radius: 10px; 
                        font-family: Arial, sans-serif; text-align: center; z-index: 10000;">
              <h3>🎮 Game Initialization Failed</h3>
              <p>Your browser doesn't support WebGL or Canvas rendering.</p>
              <p>Please try updating your browser or enabling hardware acceleration.</p>
              <button onclick="window.location.reload()" style="padding: 10px 20px; margin-top: 10px; 
                             background: #007acc; color: white; border: none; border-radius: 5px; cursor: pointer;">
                Retry
              </button>
            </div>
          `;
          document.body.appendChild(errorDiv);
          return;
        }
      }

      // High-quality canvas maintenance system (only if game initialized successfully)
      if (game) {
        const maintainCanvasQuality = () => {
          const canvas = document.querySelector('#phaser-game canvas');
          if (canvas) {
            const currentWidth = parseInt(canvas.style.width);
            const currentHeight = parseInt(canvas.style.height);
            const expectedWidth = window.innerWidth;
            const expectedHeight = window.innerHeight;

            // Maintain correct size and quality
            if (currentWidth !== expectedWidth || currentHeight !== expectedHeight) {
              const pixelRatio = window.devicePixelRatio || 1;

              canvas.style.position = 'fixed';
              canvas.style.top = '0';
              canvas.style.left = '0';
              canvas.style.width = expectedWidth + 'px';
              canvas.style.height = expectedHeight + 'px';
              canvas.style.imageRendering = 'auto';
              canvas.style.imageRendering = 'crisp-edges';
              canvas.style.imageRendering = '-webkit-optimize-contrast';

              console.log(`🔧 Canvas quality maintained: ${expectedWidth}x${expectedHeight} @ ${pixelRatio}x`);
            }
          }
        };

        // Monitor canvas quality every 3 seconds
        setInterval(maintainCanvasQuality, 3000);
      }

      // High-quality resize handler (only if game initialized)
      if (game) {
        let resizeTimeout;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(() => {
            const newWidth = window.innerWidth;
            const newHeight = window.innerHeight;
            const pixelRatio = window.devicePixelRatio || 1;

            // Update Phaser scale manager for proper internal resolution
            game.scale.resize(newWidth, newHeight);

            // Apply high-quality canvas styling
            const canvas = document.querySelector('#phaser-game canvas');
            if (canvas) {
              canvas.style.position = 'fixed';
              canvas.style.top = '0';
              canvas.style.left = '0';
              canvas.style.width = newWidth + 'px';
              canvas.style.height = newHeight + 'px';
              canvas.style.imageRendering = 'auto';
              canvas.style.imageRendering = 'crisp-edges';
              canvas.style.imageRendering = '-webkit-optimize-contrast';

              console.log(`🔧 Canvas resized to ${newWidth}x${newHeight} @ ${pixelRatio}x`);
            }
          }, 100); // Debounce resize events
        });
      }
    }

    // Enhanced DOM ready check with multiple safeguards
    function safeStart() {
      // Check if DOM is ready and elements exist
      if (document.readyState !== 'loading' && document.getElementById('phaser-game')) {
        initializeGame();
      } else {
        // Wait for DOM to be fully ready
        setTimeout(safeStart, 50);
      }
    }

    // Multiple initialization attempts for reliability
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', safeStart);
    } else {
      safeStart();
    }

    // Backup initialization after page load
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (!window.phaserGameInitialized) {
          console.log('🔄 Backup initialization attempt...');
          initializeGame();
        }
      }, 1000);
    });
  </script>
