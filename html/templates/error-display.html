<div class="error-display"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: #ff4444; z-index: 9999; display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace;">
    <div class="error-content"
        style="background: #1a1a1a; padding: 30px; border-radius: 10px; border: 2px solid #ff4444; text-align: center; max-width: 500px;">
        <div class="error-icon" style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
        <div class="error-title" style="font-size: 16px; margin-bottom: 15px; color: #ff6666;">{{errorTitle}}</div>
        <div class="error-message" style="font-size: 10px; margin-bottom: 20px; line-height: 1.5;">{{errorMessage}}
        </div>
        <div class="error-details" style="font-size: 8px; color: #888; margin-bottom: 20px; word-break: break-all;">
            {{errorDetails}}</div>
        <button class="error-reload"
            style="background: #ff4444; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-family: inherit; font-size: 8px; cursor: pointer;"
            onclick="window.location.reload()">Reload Game</button>
    </div>
</div>
