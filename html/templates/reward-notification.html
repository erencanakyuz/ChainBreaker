<div class="reward-notification"
    style="position: fixed; top: 20px; right: 20px; background: linear-gradient(45deg, #4ecdc4, #44a08d); color: white; padding: 20px; border-radius: 10px; font-family: 'Press Start 2P', monospace; font-size: 12px; text-align: center; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: slideInRight 0.5s ease-out;">
    <div class="reward-icon">🎉</div>
    <div class="reward-title">{{rewardType}} Unlocked!</div>
    <div class="reward-name">{{rewardName}}</div>
    <div class="reward-description">{{rewardDescription}}</div>
</div>
