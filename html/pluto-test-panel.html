<!-- ==================================================
     🪐 PLUTO TEST PANEL - HTML STRUCTURE
     Extracted from index.html for better organization
     ================================================== -->

<div id="pluto-test-panel" class="test-panel">
    <div class="panel-header">
        <h3>🪐 Pluto Test Lab</h3>
        <button id="toggle-panel" class="toggle-btn">━</button>
    </div>

    <div class="panel-content">
        <!-- Animation Tests -->
        <div class="test-section">
            <h4>🎭 Basic Animations</h4>
            <div class="button-grid">
                <button onclick="testPlutoAnimation('orbit')" class="test-btn orbit">🛸 Orbit</button>
                <button onclick="testPlutoAnimation('fly-around')" class="test-btn fly">✈️ Fly Around</button>
                <button onclick="testPlutoAnimation('zoom-out')" class="test-btn zoom">🔍 Zoom Out</button>
                <button onclick="testPlutoAnimation('spiral-dance')" class="test-btn spiral">🌀 Spiral Dance</button>
                <button onclick="testPlutoAnimation('excited')" class="test-btn excited">😄 Excited</button>
                <button onclick="testPlutoAnimation('sad')" class="test-btn sad">😢 Sad</button>
                <button onclick="testPlutoAnimation('idle')" class="test-btn idle">😴 Idle</button>
                <button onclick="stopPlutoAnimation()" class="test-btn stop">⏹️ Stop</button>
            </div>
        </div>

        <!-- Advanced Animations -->
        <div class="test-section">
            <h4>🚀 Advanced Animations</h4>
            <div class="button-grid">
                <button onclick="testPlutoAnimation('ring-hunter')" class="test-btn hunter">🎯 Ring Hunter</button>
                <button onclick="testPlutoAnimation('screen-explorer')" class="test-btn explorer">🗺️ Screen
                    Explorer</button>
                <button onclick="testPlutoAnimation('cosmic-drift')" class="test-btn cosmic">🌌 Cosmic Drift</button>
                <button onclick="testPlutoAnimation('chase-rings')" class="test-btn chase">🏃 Chase Rings</button>
                <button onclick="testPlutoAnimation('dimensional-travel')" class="test-btn dimension">🌀 Dimension
                    Travel</button>
                <button onclick="testPlutoAnimation('patrol')" class="test-btn patrol">🔍 Patrol Mode</button>
            </div>
        </div>

        <!-- Speech Tests -->
        <div class="test-section">
            <h4>💬 Speech Tests</h4>
            <div class="button-grid">
                <button onclick="testPlutoSpeech('greeting')" class="test-btn speech">👋 Greeting</button>
                <button onclick="testPlutoSpeech('encouragement')" class="test-btn speech">💪 Encourage</button>
                <button onclick="testPlutoSpeech('lore')" class="test-btn speech">📚 Lore</button>
                <button onclick="testPlutoSpeech('joke')" class="test-btn speech">😂 Joke</button>
                <button onclick="testPlutoSpeech('tip')" class="test-btn speech">💡 Tip</button>
                <button onclick="testPlutoSpeech('celebration')" class="test-btn speech">🎉 Celebrate</button>
            </div>
        </div>

        <!-- Mood Tests -->
        <div class="test-section">
            <h4>🎭 Mood Tests</h4>
            <div class="button-grid">
                <button onclick="testPlutoMood('happy')" class="test-btn mood happy">😊 Happy</button>
                <button onclick="testPlutoMood('angry')" class="test-btn mood angry">😠 Angry</button>
                <button onclick="testPlutoMood('sleepy')" class="test-btn mood sleepy">😴 Sleepy</button>
                <button onclick="testPlutoMood('excited')" class="test-btn mood excited">🤩 Excited</button>
                <button onclick="testPlutoMood('confused')" class="test-btn mood confused">🤔 Confused</button>
                <button onclick="testPlutoMood('wise')" class="test-btn mood wise">🧙 Wise</button>
            </div>
        </div>

        <!-- Advanced Features -->
        <div class="test-section">
            <h4>⚡ Advanced Features</h4>
            <div class="button-grid">
                <button onclick="testPlutoFeature('roam')" class="test-btn feature">🚶 Auto Roam</button>
                <button onclick="testPlutoFeature('react')" class="test-btn feature">⚡ Ring React</button>
                <button onclick="testPlutoFeature('weather')" class="test-btn feature">🌦️ Weather Mode</button>
                <button onclick="testPlutoFeature('party')" class="test-btn feature">🎊 Party Mode</button>
                <button onclick="testPlutoFeature('meditation')" class="test-btn feature">🧘 Meditation</button>
                <button onclick="testPlutoFeature('reset')" class="test-btn feature reset">🔄 Reset</button>
            </div>
        </div>

        <!-- Status Display -->
        <div class="test-section">
            <h4>📊 Status</h4>
            <div id="pluto-status" class="status-display">
                <div>Animation: <span id="current-animation">idle</span></div>
                <div>Mood: <span id="current-mood">neutral</span></div>
                <div>Speech: <span id="current-speech">silent</span></div>
                <div>Feature: <span id="current-feature">none</span></div>
            </div>
        </div>
    </div>
</div>
