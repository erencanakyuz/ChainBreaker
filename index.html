<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Chain Breaker Pro - Precision Ring-Breaking Game</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">

  <!-- Link to external CSS file -->
  <link rel="stylesheet" href="styles.css?v=1.0">

  <!-- Pluto Test Panel Styles -->
  <style>
    .test-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 320px;
      background: linear-gradient(135deg, rgba(20, 20, 50, 0.95), rgba(40, 40, 80, 0.95));
      border: 2px solid rgba(142, 45, 226, 0.6);
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      font-family: 'Arial', sans-serif;
      z-index: 10000;
      transition: all 0.3s ease;
      max-height: 90vh;
      overflow-y: auto;
    }

    .test-panel.collapsed .panel-content {
      display: none;
    }

    .test-panel.collapsed {
      width: 200px;
    }

    .panel-header {
      background: linear-gradient(135deg, rgba(142, 45, 226, 0.8), rgba(74, 0, 224, 0.8));
      padding: 12px 15px;
      border-radius: 13px 13px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(142, 45, 226, 0.3);
    }

    .panel-header h3 {
      margin: 0;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .toggle-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .panel-content {
      padding: 15px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .test-section {
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(142, 45, 226, 0.2);
      padding-bottom: 15px;
    }

    .test-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .test-section h4 {
      color: #ffffff;
      margin: 0 0 10px 0;
      font-size: 14px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .test-btn {
      background: linear-gradient(135deg, rgba(74, 0, 224, 0.7), rgba(142, 45, 226, 0.7));
      border: 1px solid rgba(142, 45, 226, 0.5);
      color: white;
      padding: 8px 6px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .test-btn:hover {
      background: linear-gradient(135deg, rgba(142, 45, 226, 0.8), rgba(180, 80, 255, 0.8));
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(142, 45, 226, 0.4);
    }

    .test-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(142, 45, 226, 0.3);
    }

    /* Special button colors */
    .test-btn.excited {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.7), rgba(255, 165, 0, 0.7));
    }

    .test-btn.sad {
      background: linear-gradient(135deg, rgba(100, 100, 255, 0.7), rgba(50, 50, 200, 0.7));
    }

    .test-btn.stop {
      background: linear-gradient(135deg, rgba(220, 20, 60, 0.7), rgba(178, 34, 34, 0.7));
    }

    .test-btn.reset {
      background: linear-gradient(135deg, rgba(34, 139, 34, 0.7), rgba(0, 128, 0, 0.7));
    }

    .test-btn.mood.happy {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.7), rgba(255, 255, 0, 0.7));
    }

    .test-btn.mood.angry {
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.7), rgba(220, 20, 60, 0.7));
    }

    .test-btn.mood.sleepy {
      background: linear-gradient(135deg, rgba(75, 0, 130, 0.7), rgba(138, 43, 226, 0.7));
    }

    .test-btn.mood.excited {
      background: linear-gradient(135deg, rgba(255, 69, 0, 0.7), rgba(255, 140, 0, 0.7));
    }

    .test-btn.mood.confused {
      background: linear-gradient(135deg, rgba(128, 128, 128, 0.7), rgba(169, 169, 169, 0.7));
    }

    .test-btn.mood.wise {
      background: linear-gradient(135deg, rgba(25, 25, 112, 0.7), rgba(72, 61, 139, 0.7));
    }

    /* Advanced animation button colors */
    .test-btn.hunter {
      background: linear-gradient(135deg, rgba(255, 165, 0, 0.7), rgba(255, 69, 0, 0.7));
    }

    .test-btn.explorer {
      background: linear-gradient(135deg, rgba(0, 191, 255, 0.7), rgba(30, 144, 255, 0.7));
    }

    .test-btn.cosmic {
      background: linear-gradient(135deg, rgba(138, 43, 226, 0.7), rgba(75, 0, 130, 0.7));
    }

    .test-btn.chase {
      background: linear-gradient(135deg, rgba(50, 205, 50, 0.7), rgba(34, 139, 34, 0.7));
    }

    .test-btn.dimension {
      background: linear-gradient(135deg, rgba(255, 20, 147, 0.7), rgba(199, 21, 133, 0.7));
    }

    .test-btn.patrol {
      background: linear-gradient(135deg, rgba(70, 130, 180, 0.7), rgba(25, 25, 112, 0.7));
    }

    .status-display {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      color: #ffffff;
      line-height: 1.4;
    }

    .status-display div {
      margin-bottom: 5px;
    }

    .status-display span {
      color: #ffd700;
      font-weight: bold;
    }

    /* Scrollbar styling */
    .panel-content::-webkit-scrollbar {
      width: 6px;
    }

    .panel-content::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
    }

    .panel-content::-webkit-scrollbar-thumb {
      background: rgba(142, 45, 226, 0.6);
      border-radius: 3px;
    }

    .panel-content::-webkit-scrollbar-thumb:hover {
      background: rgba(142, 45, 226, 0.8);
    }

    /* Speech bubble for Pluto */
    .pluto-speech-bubble {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -180px);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(240, 240, 255, 0.95));
      border: 2px solid rgba(142, 45, 226, 0.6);
      border-radius: 20px;
      padding: 15px 20px;
      max-width: 300px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      z-index: 20000;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      font-family: 'Arial', sans-serif;
      font-size: 14px;
      color: #333;
      text-align: center;
      line-height: 1.4;
      backdrop-filter: blur(5px);
    }

    .pluto-speech-bubble.show {
      opacity: 1;
      transform: translate(-50%, -200px);
    }

    /* Responsive speech bubble positioning */
    @media (max-width: 768px) {
      .pluto-speech-bubble {
        max-width: 250px;
        font-size: 12px;
        padding: 12px 16px;
      }
    }

    .pluto-speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 12px solid rgba(255, 255, 255, 0.95);
    }

    /* Animation indicators */
    .animation-indicator {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 15000;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .animation-indicator.show {
      opacity: 1;
    }
  </style>
</head>

  <!-- Load external color libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>

  <!-- Load latest Phaser 3 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script>
    // Simplified Color Palettes - No overengineering
    const Palettes = {
      neon: ['#4ECDC4', '#45B7D1', '#96CEB4', '#FECA57', '#FF6B6B', '#A8E6CF', '#74B9FF', '#FD79A8'],
      sunset: ['#FF6B9D', '#F38BA8', '#E8B4CB', '#C8A2C8', '#FDCB6E', '#E17055', '#F39C12', '#E67E22'],
      ocean: ['#74B9FF', '#0984E3', '#6C5CE7', '#A29BFE', '#00B894', '#00CEC9', '#55EFC4', '#81ECEC'],
      fire: ['#E17055', '#FDCB6E', '#F39C12', '#E67E22', '#D63031', '#FF7675', '#FD79A8', '#FDCB6E'],
      cosmic: ['#6C5CE7', '#A29BFE', '#FD79A8', '#FDCB6E', '#74B9FF', '#00B894', '#FF6B9D', '#FECA57'],
      aurora: ['#00CEC9', '#55EFC4', '#81ECEC', '#74B9FF', '#A29BFE', '#6C5CE7', '#FD79A8', '#FDCB6E']
    };

    // Simple utility functions
    const getPhaserColors = (paletteName) => {
      return Palettes[paletteName].map(color => parseInt(color.replace('#', '0x'), 16));
    };

    const getGradientColors = (paletteName, steps = 5) => {
      const palette = Palettes[paletteName] || Palettes.neon;
      const result = [];
      for (let i = 0; i < steps; i++) {
        const index = Math.floor((i / (steps - 1)) * (palette.length - 1));
        result.push(parseInt(palette[index].replace('#', '0x'), 16));
      }
      return result;
    };

    // Simplified color system object
    const colorSystem = {
      convertedPalettes: {
        neon: getPhaserColors('neon'),
        sunset: getPhaserColors('sunset'),
        ocean: getPhaserColors('ocean'),
        fire: getPhaserColors('fire'),
        cosmic: getPhaserColors('cosmic'),
        aurora: getPhaserColors('aurora')
      },
      getGradientColors: getGradientColors
    };

    // BootScene: Enhanced with gradient loading and better visuals
    class BootScene extends Phaser.Scene {
      constructor() {
        super('BootScene');
      }

      preload() {
        const { width, height } = this.cameras.main;

        // Create gradient background for loading
        const gradientGraphics = this.add.graphics();
        gradientGraphics.fillGradientStyle(0x1e3c72, 0x1e3c72, 0x2a5298, 0x2a5298, 1);
        gradientGraphics.fillRect(0, 0, width, height);

        // Enhanced progress box with gradient
        let progressBox = this.add.graphics();
        progressBox.fillGradientStyle(0x333333, 0x333333, 0x555555, 0x555555, 0.9);
        progressBox.fillRoundedRect(width / 2 - 160, height / 2 - 25, 320, 50, 10);

        let loadingText = this.add.text(width / 2, height / 2 - 70, 'Loading Amazing Colors...', {
          font: '24px Arial',
          fill: '#ffffff',
          stroke: '#000000',
          strokeThickness: 2
        }).setOrigin(0.5);

        // Add pulsing effect to loading text
        this.tweens.add({
          targets: loadingText,
          alpha: 0.3,
          duration: 1000,
          yoyo: true,
          repeat: -1
        });

        this.load.on('progress', (value) => {
          let bar = this.add.graphics();
          const gradientColors = colorSystem.getGradientColors('neon', 3);
          bar.fillGradientStyle(gradientColors[0], gradientColors[1], gradientColors[2], gradientColors[0], 1);
          bar.fillRoundedRect(width / 2 - 150, height / 2 - 15, 300 * value, 30, 8);
        });

        this.load.on('complete', () => {
          progressBox.destroy();
          loadingText.destroy();

          // Hide HTML loading screen
          const loadingDiv = document.getElementById('loading');
          if (loadingDiv) {
            loadingDiv.style.opacity = '0';
            setTimeout(() => loadingDiv.style.display = 'none', 500);
          }
        });

        // Enhanced cartoon-style particle textures
        let particleGraphics = this.make.graphics({ x: 0, y: 0, add: false });

        // Create a cartoon bubble-style particle
        particleGraphics.fillGradientStyle(0xFFFFFF, 0xFFFFFF, 0x4ECDC4, 0x45B7D1, 1);
        particleGraphics.fillCircle(4, 4, 3.5);

        // Add highlight for 3D effect
        particleGraphics.fillStyle(0xFFFFFF, 0.8);
        particleGraphics.fillCircle(5, 3, 1.5);

        // Add subtle outline
        particleGraphics.lineStyle(1, 0x000000, 0.3);
        particleGraphics.strokeCircle(4, 4, 3.5);
        particleGraphics.generateTexture('particle', 8, 8);

        // Create cartoon-style star texture
        let starGraphics = this.make.graphics({ x: 0, y: 0, add: false });

        // Draw cartoon star with gradient
        starGraphics.fillGradientStyle(0xFECA57, 0xFECA57, 0xE17055, 0xD63031, 1);

        const cx = 4, cy = 4, spikes = 5, outerRadius = 3.5, innerRadius = 1.8;
        let rot = Math.PI / 2 * 3;
        let x = cx, y = cy;
        const step = Math.PI / spikes;

        starGraphics.beginPath();
        starGraphics.moveTo(cx, cy - outerRadius);

        for (let i = 0; i < spikes; i++) {
          x = cx + Math.cos(rot) * outerRadius;
          y = cy + Math.sin(rot) * outerRadius;
          starGraphics.lineTo(x, y);
          rot += step;

          x = cx + Math.cos(rot) * innerRadius;
          y = cy + Math.sin(rot) * innerRadius;
          starGraphics.lineTo(x, y);
          rot += step;
        }
        starGraphics.lineTo(cx, cy - outerRadius);
        starGraphics.closePath();
        starGraphics.fillPath();

        // Add star highlight
        starGraphics.fillStyle(0xFFFFAA, 0.9);
        starGraphics.fillCircle(5, 3, 1);

        // Add star outline
        starGraphics.lineStyle(1, 0x000000, 0.4);
        starGraphics.strokePath();
        starGraphics.generateTexture('star', 8, 8);

        // Create cartoon gem/diamond texture
        let diamondGraphics = this.make.graphics({ x: 0, y: 0, add: false });

        // Create a sparkling gem effect
        diamondGraphics.fillGradientStyle(0xA29BFE, 0xA29BFE, 0x6C5CE7, 0x5F3DC4, 1);

        // Diamond shape
        diamondGraphics.beginPath();
        diamondGraphics.moveTo(4, 1);
        diamondGraphics.lineTo(7, 4);
        diamondGraphics.lineTo(4, 7);
        diamondGraphics.lineTo(1, 4);
        diamondGraphics.closePath();
        diamondGraphics.fillPath();

        // Add sparkle highlights
        diamondGraphics.fillStyle(0xFFFFFF, 0.9);
        diamondGraphics.fillCircle(3, 3, 0.8);
        diamondGraphics.fillCircle(5.5, 2.5, 0.5);

        // Diamond outline
        diamondGraphics.lineStyle(1, 0x000000, 0.5);
        diamondGraphics.beginPath();
        diamondGraphics.moveTo(4, 1);
        diamondGraphics.lineTo(7, 4);
        diamondGraphics.lineTo(4, 7);
        diamondGraphics.lineTo(1, 4);
        diamondGraphics.closePath();
        diamondGraphics.strokePath();
        diamondGraphics.generateTexture('diamond', 8, 8);
      }

      create() {
        this.scene.start('MenuScene');
      }
    }

    // MenuScene: Enhanced with beautiful gradients and modern color palettes
    class MenuScene extends Phaser.Scene {
      constructor() {
        super('MenuScene');
      }

      create() {
        const { width, height } = this.cameras.main;

        // Create gradient background
        const bgGraphics = this.add.graphics();
        bgGraphics.fillGradientStyle(0x1a1a2e, 0x16213e, 0x0f3460, 0x533483, 1);
        bgGraphics.fillRect(0, 0, width, height);

        // Add animated background particles (Phaser 3.70 syntax)
        this.backgroundParticles = this.add.particles(0, 0, 'diamond', {
          x: { min: 0, max: width },
          y: { min: 0, max: height },
          lifespan: 8000,
          speed: { min: 20, max: 60 },
          scale: { start: 0.3, end: 0 },
          quantity: 2,
          blendMode: 'ADD',
          tint: colorSystem.convertedPalettes.cosmic,
          alpha: { start: 0.6, end: 0 }
        });

        // Create DOM element for samurai-styled title
        const titleElement = document.createElement('h1');
        titleElement.className = 'game-title';
        titleElement.textContent = 'ChainX';
        titleElement.style.position = 'absolute';
        titleElement.style.top = '1rem';
        titleElement.style.left = '50%';
        titleElement.style.transform = 'translateX(-50%)';
        titleElement.style.zIndex = '1000';
        titleElement.style.pointerEvents = 'none'; // Don't block clicks
        document.body.appendChild(titleElement);

        // Store reference to remove when scene changes
        this.titleElement = titleElement;

        const subtitleText = this.add.text(width / 2, 200, 'Choose Your Path, Warrior', {
          fontFamily: '"Press Start 2P", monospace',
          fontSize: '16px',
          fill: '#edab50',
          stroke: '#8c241d',
          strokeThickness: 2
        }).setOrigin(0.5);

        // Story Button
        const storyButtonBg = this.add.graphics();
        storyButtonBg.fillGradientStyle(0x6C5CE7, 0x6C5CE7, 0x4834D4, 0x4834D4, 0.8);
        storyButtonBg.fillRoundedRect(width / 2 - 100, 150, 200, 40, 10);
        storyButtonBg.lineStyle(2, 0xA29BFE, 0.9);
        storyButtonBg.strokeRoundedRect(width / 2 - 100, 150, 200, 40, 10);

        const storyText = this.add.text(width / 2, 170, '📖 STORY MODE', {
          font: '16px Arial',
          fill: '#ffffff',
          stroke: '#4834D4',
          strokeThickness: 2
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

        // Story button interactions
        [storyButtonBg, storyText].forEach(element => {
          if (element !== storyButtonBg) {
            element.setInteractive({ useHandCursor: true });
          }

          element.on('pointerdown', () => {
            // Remove title immediately when starting story
            if (this.titleElement) {
              this.titleElement.remove();
              this.titleElement = null;
            }

            // Add flash effect on selection

      setupParticleEffects() {
        // Bu bölümde daha önce oluşturduğumuz partikül emitter'leri zaten create() içerisinde ayarlandı.
      }

      setupNeedle() {
        // Create needle once as a render texture for optimal performance
        this.createNeedleTexture();
        this.needleAngle = 0;
        this.originalNeedleSpeed = Phaser.Math.DegToRad(180);
        this.needleSpeed = this.originalNeedleSpeed;
        this.needleReverseProb = 0;

        // Performance optimization variables
        this.lastNeedleColor = null;
        this.lastPulseFactor = null;
      }

      createNeedleTexture() {
        // Create simple arrow pointing towards center
        this.needle = this.add.graphics();
        this.drawSimpleArrow();

        // Set up timer for gradient animation
        this.needleAnimationTimer = 0;
      }

      drawSimpleArrow() {
        this.needle.clear();

        // Check if needle is in sweet spot area (collision zone)
        let needleColor = 0x000000; // Default black
        if (this.activeRing) {
          const angleDiff = Phaser.Math.Angle.Wrap(this.needleAngle - this.activeRing.sweetSpotAngle);
          const absAngleDiff = Math.abs(angleDiff);
          const sweetSpotThreshold = Phaser.Math.DegToRad(this.getActiveDesign().sweetSpotSize);

          // Turn white when in sweet spot area
          if (absAngleDiff <= sweetSpotThreshold) {
            needleColor = 0xFFFFFF; // White when in collision zone
          }
        }

        // Bigger arrow with solid color (black or white based on position)
        this.needle.fillStyle(needleColor);
        this.needle.lineStyle(2, 0x666666); // Gray outline

        // Draw bigger arrow pointing inward toward center (local coordinate system)
        // Arrow points to the right in local coordinates, will be rotated to point toward center
        this.needle.beginPath();
        this.needle.moveTo(15, 0);   // Arrow tip pointing right (toward center when properly rotated)
        this.needle.lineTo(-10, -8); // Top left of arrow base
        this.needle.lineTo(-5, 0);   // Middle notch
        this.needle.lineTo(-10, 8);  // Bottom left of arrow base
        this.needle.closePath();
        this.needle.fillPath();
        this.needle.strokePath();
      }

      setupLevelDesigns() {
        if (this.selectedMode) {
          this.baseMode = this.selectedMode;
        } else {
          this.levelDesigns = [{
            name: "Beginner's Circle",
            theme: "Standard rings with stationary targets",
            color: 0x00aaff,
            bgColor: 0x001a33,
            particleColors: [0x00aaff, 0x00cfff, 0x0099ff],
            ringColors: [0x00aaff, 0xff0000, 0x00ff00, 0xffff00],
            specialEffects: false,
            sweetSpotSize: 15,
            needleSpeed: 1,
            ringMovement: false
          }];
        }
      }

      getActiveDesign() {
        // Cache the active design to avoid recalculation
        if (this.cachedDesign && this.cachedDesign.level === this.level) {
          return this.cachedDesign;
        }

        let design;
        if (this.baseMode) {
          const mod = this.level - 1;
          const difficultyMultiplier = Math.min(mod * 0.08, 3); // Cap difficulty scaling

          design = {
            name: this.baseMode.name,
            theme: this.baseMode.theme,
            color: this.baseMode.color,
            bgColor: this.baseMode.bgColor,
            particleColors: this.baseMode.particleColors,
            ringColors: this.baseMode.ringColors,
            specialEffects: this.baseMode.specialEffects,
            sweetSpotSize: Math.max(this.baseMode.sweetSpotSize - mod * 0.5, 3), // Slower reduction
            needleSpeed: this.baseMode.needleSpeed * (1 + difficultyMultiplier),
            ringMovement: this.baseMode.ringMovement,
            ringSpeed: (this.baseMode.ringSpeed || 0) * (1 + difficultyMultiplier * 0.5),
            needleReverseProb: this.baseMode.needleReverseProb || 0
          };
        } else {
          const designIndex = Math.min(this.level - 1, this.levelDesigns.length - 1);
          design = this.levelDesigns[designIndex];
        }

        // Cache the design with level info
        this.cachedDesign = { ...design, level: this.level };
        return design;
      }

      update(time, delta) {
        if (this.gameOverFlag) return;

        // Performance monitoring with enhanced metrics
        this.updatePerformanceMetrics(delta);

        // Advanced frame budgeting for consistent performance
        const startTime = performance.now();
        let dt = delta / 1000;
        this.frameCount = (this.frameCount || 0) + 1;

        // Priority 1: Critical game logic (always runs)
        this.updateNeedle(dt);
        this.updateFeverMode(delta);
        this.updatePlutoMood(delta);

        // Priority 2: Visual updates (skip if frame budget exceeded)
        if (performance.now() - startTime < this.frameBudget * 0.6) { // Reduced threshold for better performance
          // Update background glow less frequently (every 5th frame instead of 3rd)
          if (this.frameCount % 5 === 0) {
            this.updateBackgroundGlow(time);
          }

          // Update all moving rings every frame - critical for smooth movement
          this.ringStack.forEach(ring => {
            if (ring.needsUpdate) {
              ring.update(delta);
            }
          });
        }

        // Priority 3: Non-critical updates (skip if running slow)
        if (performance.now() - startTime < this.frameBudget * 0.8) { // Increased threshold
          if (this.frameCount % 30 === 0) { // Reduced frequency from 15 to 30 frames
            this.debugText.setText(
              'Rings: ' + this.ringStack.length +
              '\nCombo: ' + this.combo +
              '\nLevel: ' + this.level +
              '\nMin FPS: ' + this.performanceMetrics.minFPS +
              '\nAvg FPS: ' + this.performanceMetrics.averageFPS +
              '\nMemory: ' + this.getMemoryUsage() + 'MB'
            );
          }
        }
      }

      updatePerformanceMetrics(delta) {
        const currentFPS = Math.round(1000 / delta);

        // Update FPS history for averaging
        this.performanceMetrics.fpsHistory.push(currentFPS);
        if (this.performanceMetrics.fpsHistory.length > 60) { // Keep last 60 frames
          this.performanceMetrics.fpsHistory.shift();
        }

        // Calculate average FPS
        const sum = this.performanceMetrics.fpsHistory.reduce((a, b) => a + b, 0);
        this.performanceMetrics.averageFPS = Math.round(sum / this.performanceMetrics.fpsHistory.length);

        // Track min and max FPS
        this.performanceMetrics.minFPS = Math.min(this.performanceMetrics.minFPS, currentFPS);
        this.performanceMetrics.maxFPS = Math.max(this.performanceMetrics.maxFPS, currentFPS);

        // Update FPS display with color coding
        let fpsColor = '#00ff00'; // Green for good FPS
        if (currentFPS < 30) fpsColor = '#ff0000'; // Red for bad FPS
        else if (currentFPS < 45) fpsColor = '#ffff00'; // Yellow for moderate FPS

        this.fpsText.setFill(fpsColor);
        this.fpsText.setText(`FPS: ${currentFPS}`);

        // Performance warning
        if (currentFPS < 20 && this.frameCount % 120 === 0) {
          console.warn('Performance Warning: FPS below 20, consider reducing effects');
        }
      }

      updateBackgroundGlow(time) {
        // Only update if intensity actually changed to reduce expensive graphics operations
        const newIntensity = this.feverMode ? 0.3 : 0.1;
        const newPulseFactor = Math.sin(time / 500) * 0.05 + newIntensity;

        // Skip update if change is too small (performance optimization)
        if (this.lastPulseFactor && Math.abs(newPulseFactor - this.lastPulseFactor) < 0.01) {
          return;
        }

        this.backgroundGlow.clear();
        this.backgroundGlow.fillStyle(this.getActiveDesign().color, newPulseFactor);
        this.backgroundGlow.fillCircle(this.center.x, this.center.y, this.baseRadius * 3);

        this.lastPulseFactor = newPulseFactor;
      }

      updateNeedle(dt) {
        const design = this.getActiveDesign();
        if (design.needleReverseProb && Math.random() < design.needleReverseProb) {
          this.needleSpeed = -this.needleSpeed;
        }

        this.needleAngle += this.needleSpeed * dt;
        if (this.needleAngle >= Math.PI * 2) this.needleAngle -= Math.PI * 2;
        if (this.needleAngle < 0) this.needleAngle += Math.PI * 2;

        // Check if needle is in sweet spot area (collision zone) - optimized
        let needleColor = 0x000000; // Default black
        if (this.activeRing) {
          const angleDiff = Phaser.Math.Angle.Wrap(this.needleAngle - this.activeRing.sweetSpotAngle);
          const absAngleDiff = Math.abs(angleDiff);
          const sweetSpotThreshold = Phaser.Math.DegToRad(this.getActiveDesign().sweetSpotSize);

          // Turn white when in sweet spot area
          if (absAngleDiff <= sweetSpotThreshold) {
            needleColor = 0xFFFFFF; // White when in collision zone
          }
        }

        // Only redraw needle if color changed to reduce graphics operations
        if (this.lastNeedleColor !== needleColor) {
          this.needle.clear();
          this.needle.fillStyle(needleColor);
          this.needle.lineStyle(2, 0x666666); // Gray outline

          // Draw bigger arrow pointing inward toward center (local coordinate system)
          this.needle.beginPath();
          this.needle.moveTo(15, 0);   // Arrow tip pointing right (toward center when properly rotated)
          this.needle.lineTo(-10, -8); // Top left of arrow base
          this.needle.lineTo(-5, 0);   // Middle notch
          this.needle.lineTo(-10, 8);  // Bottom left of arrow base
          this.needle.closePath();
          this.needle.fillPath();
          this.needle.strokePath();

          this.lastNeedleColor = needleColor;
        }

        // Position needle around the active ring with proper rotation
        if (this.activeRing) {
          const radius = this.activeRing.radius + this.activeRing.thickness / 2 + 15; // Small margin outside ring

          this.needle.x = this.center.x + Math.cos(this.needleAngle) * radius;
          this.needle.y = this.center.y + Math.sin(this.needleAngle) * radius;

          // Rotate arrow to point towards center 
          // Since needle is positioned at needleAngle, we need it to point 180° back toward center
          this.needle.rotation = this.needleAngle + Math.PI; // +PI to point back toward center
        }
      }

      updateFeverMode(delta) {
        if (this.feverMode) {
          this.feverTimer -= delta;
          if (this.feverTimer <= 0) {
            this.feverMode = false;
            this.feverText.setText('');
            // Remove fever overlay if still exists
            const existingFever = document.getElementById('current-fever-overlay');
            if (existingFever) {
              existingFever.remove();
            }
          } else {
            this.feverText.setText('FEVER MODE: ' + Math.ceil(this.feverTimer / 1000) + 's');
          }
        }
      }

      updatePlutoMood(delta) {
        if (!this.plutoBody) return;

        // Don't change mood if Pluto is in the middle of a special animation
        if (this.plutoIsAnimating) {
          this.checkRingProximity();
          return;
        }

        // Update orbit timer
        this.plutoOrbitTimer += delta;

        // Determine Pluto's mood based on game state
        let newMood = 'idle';

        // Priority system: special animations have lower priority than game states
        if (this.feverMode) {
          newMood = 'excited';
        } else if (this.lives <= 1) {
          newMood = 'sad';
        } else if (this.combo >= 3) {
          newMood = 'excited';
        } else if (this.plutoOrbitTimer >= this.plutoOrbitInterval) {
          // Only trigger special animations if in neutral game state
          let randomIndex;
          do {
            randomIndex = Math.floor(Math.random() * this.plutoMovementTypes.length);
          } while (randomIndex === this.lastMovementType); // Don't repeat the same movement

          newMood = this.plutoMovementTypes[randomIndex];
          this.lastMovementType = randomIndex;
          this.plutoOrbitTimer = 0; // Reset timer
        }

        // Apply mood change if different
        if (this.plutoMood !== newMood) {
          this.changePlutoMood(newMood);
        }

        // Check ring proximity for interaction effects
        this.checkRingProximity();
      }

      changePlutoMood(mood) {
        if (!this.plutoBody) return;

        console.log('Pluto mood changing to:', mood); // Debug log
        this.plutoMood = mood;

        // Remove all mood animations
        this.plutoBody.style.animation = '';

        // Apply new mood animation
        switch (mood) {
          case 'excited':
            this.plutoBody.style.animation = 'pluto-excited 0.8s infinite ease-in-out';
            this.plutoIsAnimating = false; // Excited can be interrupted
            break;
          case 'sad':
            this.plutoBody.style.animation = 'pluto-sad 2s infinite ease-in-out';
            this.plutoIsAnimating = false; // Sad can be interrupted
            break;
          case 'orbit':
            this.plutoBody.style.animation = 'pluto-orbit-mode 8s ease-in-out';
            this.plutoIsAnimating = true; // Block other animations
            console.log('Starting orbit animation (8s)');
            // Return to idle after orbit
            setTimeout(() => {
              if (this.plutoMood === 'orbit') {
                this.plutoIsAnimating = false;
                this.changePlutoMood('idle');
              }
            }, 8000);
            break;
          case 'fly-around':
            this.plutoBody.style.animation = 'pluto-fly-around 10s ease-in-out';
            this.plutoIsAnimating = true; // Block other animations
            console.log('Starting fly-around animation (10s)');
            // Return to idle after flying around
            setTimeout(() => {
              if (this.plutoMood === 'fly-around') {
                this.plutoIsAnimating = false;
                console.log('Fly-around finished, returning to idle');
                this.changePlutoMood('idle');
              }
            }, 10000);
            break;
          case 'zoom-out':
            this.plutoBody.style.animation = 'pluto-zoom-out 6s ease-in-out';
            this.plutoIsAnimating = true; // Block other animations
            console.log('Starting zoom-out animation (6s)');
            // Return to idle after zoom
            setTimeout(() => {
              if (this.plutoMood === 'zoom-out') {
                this.plutoIsAnimating = false;
                this.changePlutoMood('idle');
              }
            }, 6000);
            break;
          case 'spiral-dance':
            this.plutoBody.style.animation = 'pluto-spiral-dance 8s ease-in-out';
            this.plutoIsAnimating = true; // Block other animations
            console.log('Starting spiral-dance animation (8s)');
            // Return to idle after spiral dance
            setTimeout(() => {
              if (this.plutoMood === 'spiral-dance') {
                this.plutoIsAnimating = false;
                this.changePlutoMood('idle');
              }
            }, 8000);
            break;
          default: // idle
            this.plutoBody.style.animation = 'pluto-idle-pulse 4s infinite ease-in-out';
            this.plutoIsAnimating = false;
            break;
        }
      }

      checkRingProximity() {
        if (!this.ringStack || !this.plutoBody) return;

        const plutoCenterX = this.center.x;
        const plutoCenterY = this.center.y;

        // Check each ring's distance from Pluto
        this.ringStack.forEach((ring, index) => {
          const ringDistance = ring.radius;

          // If ring is close to Pluto (within 150px), add proximity effect
          if (ringDistance < 150) {
            // For graphics objects, use tint property directly
            ring.graphics.tint = 0xffaa00; // Golden tint when close
            ring.graphics.alpha = 0.9 + Math.sin(Date.now() * 0.01) * 0.1; // Pulsing

            // Add extra glow effect by modifying the ring's special state
            if (!ring.proximityEffect) {
              ring.proximityEffect = true;
              // Mark ring as special - it will be redrawn with glow
              ring.isDirty = true;
            }
          } else {
            // Remove tint and effects
            ring.graphics.tint = 0xffffff; // Reset to white (normal)
            ring.graphics.alpha = 1;

            if (ring.proximityEffect) {
              ring.proximityEffect = false;
              ring.isDirty = true; // Redraw without special effects
            }
          }
        });
      }

      handleInput() {
        if (this.gameOverFlag || !this.activeRing) return;

        // Prevent input spam - minimum 100ms between inputs
        const now = performance.now();
        if (this.lastInputTime && now - this.lastInputTime < 100) return;
        this.lastInputTime = now;

        this.activeRing.inputReceived = true;

        // Cached angle difference calculation
        const angleDiff = Phaser.Math.Angle.Wrap(this.needleAngle - this.activeRing.sweetSpotAngle);
        const absAngleDiff = Math.abs(angleDiff);

        // Pre-calculate threshold to avoid repeated calculations
        if (!this.cachedThreshold) {
          this.cachedThreshold = Phaser.Math.DegToRad(this.getActiveDesign().sweetSpotSize);
        }

        if (absAngleDiff <= this.cachedThreshold) {
          this.handleSuccessfulHit();
        } else {
          this.handleMiss();
        }
        this.resetRegenTimer();
      }

      handleSuccessfulHit() {
        // Flash effect removed for better user experience

        // Reduce particle count for better performance
        this.breakParticles.explode(15, this.center.x, this.center.y);

        // Additional spark effects with reduced count
        this.sparkEmitter.explode(12, this.center.x, this.center.y);
        this.cameras.main.shake(100, 0.008); // Shorter, less intense shake

        // Background particles already configured with design colors

        // Activate fever mode particle effects
        if (this.feverMode) {
          this.feverParticles.start();
          this.time.delayedCall(500, () => { this.feverParticles.stop(); });
        }

        let multiplier = this.feverMode ? 2 : (1 + this.combo * 0.1);
        let points = Math.floor(10 * multiplier);
        let popupX = this.center.x + Math.cos(this.needleAngle) * this.activeRing.radius;
        let popupY = this.center.y + Math.sin(this.needleAngle) * this.activeRing.radius;
        this.showScorePopup(points, popupX, popupY);

        // Store reference to broken ring for animation
        const brokenRing = this.activeRing;

        // Immediately switch to next ring (don't wait for animation)
        Phaser.Utils.Array.Remove(this.ringStack, this.activeRing);
        if (this.ringStack.length === 0) {
          this.levelUp();
        } else {
          this.activeRing = this.ringStack[this.ringStack.length - 1];
        }

        // Play broken ring animation in background
        this.tweens.add({
          targets: brokenRing.graphics,
          scaleX: 0,
          scaleY: 0,
          alpha: 0,
          ease: 'Power2',
          duration: 800, // Slower animation for visual appeal
          onComplete: () => {
            brokenRing.destroy(); // Clean up when animation finishes
          }
        });
        this.combo++;
        this.comboText.setText('Combo: ' + this.combo);
        this.score += points;
        this.scoreText.setText('Score: ' + this.score);
        this.needleSpeed *= 1.03;
        this.regenDelay = Math.max(3000, this.regenDelay * 0.98);
        if (this.combo >= 5 && !this.feverMode) {
          this.activateFeverMode();
        }

        // Show combo effect for significant combos
        if (this.combo > 0 && this.combo % 3 === 0) {
          this.showComboEffect();
        }
      }

      // Enhanced score popup with object pooling - performance optimized
      showScorePopup(points, x, y) {
        // Throttle score popup creation to prevent spam
        if (this.lastScorePopupTime && Date.now() - this.lastScorePopupTime < 50) return;
        this.lastScorePopupTime = Date.now();

        // Use object pool for DOM elements to reduce creation/destruction overhead
        let scoreDiv = this.scorePopupPool.pop();
        if (!scoreDiv) {
          scoreDiv = document.createElement('div');
          scoreDiv.className = 'score-popup';
        }

        scoreDiv.textContent = '+' + points;
        scoreDiv.style.left = x + 'px';
        scoreDiv.style.top = y + 'px';
        scoreDiv.style.display = 'block';
        document.body.appendChild(scoreDiv);

        // Return to pool after animation completes
        setTimeout(() => {
          if (scoreDiv.parentNode) {
            scoreDiv.remove();
            scoreDiv.style.display = 'none';
            // Return to pool if not full
            if (this.scorePopupPool.length < this.maxPoolSize) {
              this.scorePopupPool.push(scoreDiv);
            }
          }
        }, 800); // Reduced timeout to match CSS animation
      }

      handleMiss() {
        this.combo = 0;
        this.comboText.setText('Combo: ' + this.combo);
        this.lives--;
        this.livesText.setText('Lives: ' + this.lives);
        this.cameras.main.shake(150, 0.015);
        this.tweens.add({
          targets: this.activeRing.graphics,
          x: this.activeRing.x + 5,
          y: this.activeRing.y + 5,
          yoyo: true,
          duration: 50,
          repeat: 2,
          onComplete: () => {
            this.activeRing.graphics.x = this.activeRing.x;
            this.activeRing.graphics.y = this.activeRing.y;
          }
        });
        if (this.lives <= 0) {
          this.gameOver();
        }
      }

      activateFeverMode() {
        this.feverMode = true;
        this.feverTimer = this.feverModeDuration;
        this.feverText.setText('FEVER MODE: 5s');
        this.cameras.main.flash(500, 255, 0, 255);

        // Add CSS fever mode overlay
        const feverDiv = document.createElement('div');
        feverDiv.className = 'fever-mode';
        feverDiv.id = 'current-fever-overlay';
        document.body.appendChild(feverDiv);

        // Remove fever overlay when fever mode ends
        setTimeout(() => {
          const existingFever = document.getElementById('current-fever-overlay');
          if (existingFever) {
            existingFever.remove();
          }
        }, this.feverModeDuration);
      }

      showComboEffect() {
        // Throttle combo effect to prevent spam
        if (this.lastComboEffectTime && Date.now() - this.lastComboEffectTime < 500) return;
        this.lastComboEffectTime = Date.now();

        // Use object pool for combo effects to reduce DOM creation overhead
        let comboDiv = this.comboEffectPool.pop();
        if (!comboDiv) {
          comboDiv = document.createElement('div');
          comboDiv.className = 'combo-effect';
        }

        comboDiv.textContent = `COMBO x${this.combo}!`;
        comboDiv.style.display = 'block';
        document.body.appendChild(comboDiv);

        // Return to pool after animation completes
        setTimeout(() => {
          if (comboDiv.parentNode) {
            comboDiv.remove();
            comboDiv.style.display = 'none';
            // Return to pool if not full
            if (this.comboEffectPool.length < this.maxPoolSize) {
              this.comboEffectPool.push(comboDiv);
            }
          }
        }, 600); // Reduced timeout to match CSS animation
      }

      resetRegenTimer() {
        if (this.regenTimer) {
          this.regenTimer.remove(false);
        }
        this.regenTimer = this.time.addEvent({
          delay: this.regenDelay,
          callback: this.regenerateRing,
          callbackScope: this
        });
      }

      regenerateRing() {
        if (this.activeRing && !this.activeRing.inputReceived) {
          this.combo = 0;
          this.comboText.setText('Combo: 0');
        }

        // Dynamic max rings based on level design instead of arbitrary number
        const design = this.getActiveDesign();
        const maxRings = Math.min(12, 8 + Math.floor(this.level / 3)); // Scales with level

        if (this.ringStack.length >= maxRings) {
          this.gameOver();
          return;
        }
        let lastRadius = this.ringStack.length > 0
          ? this.ringStack[this.ringStack.length - 1].radius
          : this.baseRadius - (this.ringThickness + this.ringGap);
        let newRadius = lastRadius + this.ringThickness + this.ringGap;
        let ringColor = Phaser.Utils.Array.GetRandom(this.getActiveDesign().ringColors);
        let newRing = new Ring(this, this.center.x, this.center.y, newRadius, this.ringThickness, ringColor, this.getActiveDesign());
        this.ringStack.push(newRing);
        this.activeRing = newRing;
        this.resetRegenTimer();
      }

      levelUp() {
        // Reduce particle count for better performance
        this.confettiParticles.explode(25, this.center.x, this.center.y);
        this.cameras.main.flash(300, 0, 255, 0); // Shorter flash

        // Use CSS level-up effect instead of just Phaser text
        const levelUpDiv = document.createElement('div');
        levelUpDiv.className = 'level-up';
        levelUpDiv.textContent = 'LEVEL UP!';
        document.body.appendChild(levelUpDiv);

        // Remove CSS effect after animation completes
        setTimeout(() => {
          if (levelUpDiv.parentNode) {
            levelUpDiv.remove();
          }
        }, 2000);
        this.level++;
        this.levelText.setText('Level: ' + this.level);
        const design = this.getActiveDesign();
        this.themeText.setText(design.name + ': ' + design.theme);
        this.needleSpeed = this.originalNeedleSpeed * design.needleSpeed;
        this.needleReverseProb = design.needleReverseProb || 0;
        this.regenDelay = Math.max(2000, 5000 - (this.level * 200));
        if (this.level % 3 === 0) {
          this.lives = Math.min(this.lives + 1, 5);
          this.livesText.setText('Lives: ' + this.lives);
          let bonusText = this.add.text(this.center.x, this.center.y + 60, '+1 LIFE!', {
            font: '32px Arial',
            fill: '#ff5555',
            stroke: '#000000',
            strokeThickness: 4
          }).setOrigin(0.5);
          this.tweens.add({
            targets: bonusText,
            alpha: 0,
            y: this.center.y + 30,
            duration: 1200,
            ease: 'Power2',
            onComplete: () => bonusText.destroy()
          });
        }
        this.time.delayedCall(1000, () => { this.startLevel(); }, [], this);
      }

      startLevel() {
        const design = this.getActiveDesign();
        this.currentRingColor = design.color;
        this.cameras.main.setBackgroundColor(design.bgColor);
        // Background particles already configured with design colors
        this.themeText.setText(design.name + ': ' + design.theme);
        this.ringStack = [];

        // Dynamic ring count based on difficulty
        const numRings = Math.min(8, 6 + Math.floor(this.level / 5));
        const radiusIncrement = this.ringThickness + this.ringGap;

        // Pre-calculate colors for better performance
        const colorPool = [...design.ringColors];

        for (let i = 0; i < numRings; i++) {
          const radius = this.baseRadius + i * radiusIncrement;
          const ringColor = colorPool[i % colorPool.length]; // Cycle through colors
          const ring = new Ring(this, this.center.x, this.center.y, radius, this.ringThickness, ringColor, design);
          this.ringStack.push(ring);
        }

        this.activeRing = this.ringStack[this.ringStack.length - 1];

        // Invalidate cached values when starting new level
        this.cachedDesign = null;
        this.cachedThreshold = null;

        // Create 3D CSS Pluto in the center
        this.setupPluto();

        this.resetRegenTimer();
      }

      gameOver() {
        this.gameOverFlag = true;
        this.gameOverText.setText('GAME OVER\nScore: ' + this.score + '\nLevel: ' + this.level + '\nClick to Restart');
        this.ringStack.forEach(ring => {
          this.tweens.add({
            targets: ring.graphics,
            alpha: 0,
            duration: 500
          });
        });
        this.input.once('pointerdown', () => {
          this.resetGame();
          this.gameOverFlag = false;
          this.gameOverText.setText('');
        });
      }

      resetGame() {
        // Clear all timers and tweens
        if (this.regenTimer) this.regenTimer.remove(false);

        // Clean up space background effect timers (only stars now)

        this.tweens.killAll();

        // Clean up CSS effects from DOM
        this.cleanupCSSEffects();

        // Clean up CSS Pluto
        if (this.cssPlutoContainer) {
          this.cssPlutoContainer.remove();
          this.cssPlutoContainer = null;
          this.plutoBody = null;
          this.plutoMood = 'idle';
          this.plutoOrbitTimer = 0;
          this.lastMovementType = -1;
          this.plutoIsAnimating = false;
        }

        // Clean up space background containers
        if (this.starsContainer) {
          this.starsContainer.destroy();
          this.starsContainer = null;
        }

        // Clean up ring stack
        if (this.ringStack) {
          this.ringStack.forEach(ring => ring.destroy());
          this.ringStack.length = 0; // Clear array
        }

        // Clean up object pools - DOM elements don't have destroy method
        if (this.scorePopupPool) {
          this.scorePopupPool.forEach(popup => {
            if (popup.parentNode) {
              popup.remove(); // Remove DOM element properly
            }
          });
          this.scorePopupPool.length = 0;
        }

        if (this.comboEffectPool) {
          this.comboEffectPool.forEach(combo => {
            if (combo.parentNode) {
              combo.remove(); // Remove DOM element properly
            }
          });
          this.comboEffectPool.length = 0;
        }

        // Memory cleanup (texture cache removed for stability)

        // Reset game state - complete reset including timers
        this.level = 1;
        this.score = 0;
        this.combo = 0;
        this.lives = 3;
        this.needleSpeed = this.originalNeedleSpeed;
        this.regenDelay = 5000;
        this.feverMode = false;
        this.cachedThreshold = null; // Clear cached threshold
        this.frameCount = 0;

        // Reset throttling timers to prevent input blocking after restart
        this.lastInputTime = null;
        this.lastScorePopupTime = null;
        this.lastComboEffectTime = null;

        // Reset performance optimization variables
        this.lastNeedleColor = null;
        this.lastPulseFactor = null;

        // Update UI
        this.levelText.setText('Level: ' + this.level);
        this.scoreText.setText('Score: 0');
        this.comboText.setText('Combo: 0');
        this.livesText.setText('Lives: 3');
        this.feverText.setText('');

        // Recreate space background effects
        this.createStarsBackground();

        this.startLevel();
      }

      cleanupCSSEffects() {
        // Remove any remaining CSS effects from DOM
        const effectClasses = ['level-up', 'score-popup', 'combo-effect', 'fever-mode'];
        effectClasses.forEach(className => {
          const elements = document.querySelectorAll('.' + className);
          elements.forEach(element => element.remove());
        });

        // Remove any fever overlay with ID
        const feverOverlay = document.getElementById('current-fever-overlay');
        if (feverOverlay) {
          feverOverlay.remove();
        }
      }

      runPerformanceTest() {
        console.log('=== ADVANCED PERFORMANCE TEST STARTED ===');
        console.log('Press R to reset metrics, P to run test again');

        const startMemory = this.getMemoryUsage();
        console.log('Start Memory:', startMemory + 'MB');

        // Create stress test - many particles and effects
        for (let i = 0; i < 15; i++) { // Reduced from 20 to 15 for optimization
          this.breakParticles.explode(15, // Reduced from 20 to 15
            this.center.x + Math.random() * 200 - 100,
            this.center.y + Math.random() * 200 - 100
          );
        }

        // Show multiple effects simultaneously
        this.showScorePopup(9999, this.center.x, this.center.y - 50);
        this.showComboEffect();

        // Enable fever mode for more particles
        if (!this.feverMode) {
          this.activateFeverMode();
        }

        // Enhanced performance logging
        setTimeout(() => {
          const endMemory = this.getMemoryUsage();
          console.log('Performance Test Results:');
          console.log('Current FPS:', Math.round(1000 / this.game.loop.delta));
          console.log('Average FPS:', this.performanceMetrics.averageFPS);
          console.log('Min FPS:', this.performanceMetrics.minFPS);
          console.log('Max FPS:', this.performanceMetrics.maxFPS);
          console.log('Ring Count:', this.ringStack.length);
          console.log('Start Memory:', startMemory + 'MB');
          console.log('End Memory:', endMemory + 'MB');
          console.log('Memory Increase:', Math.round((endMemory - startMemory) * 100) / 100 + 'MB');
          console.log('Score Popup Pool Size:', this.scorePopupPool.length);
          console.log('Combo Effect Pool Size:', this.comboEffectPool.length);
          console.log('=== ADVANCED TEST COMPLETE ===');
        }, 3000); // Increased to 3 seconds for better measurement
      }

      resetPerformanceMetrics() {
        this.performanceMetrics = {
          frameCount: 0,
          lastTime: performance.now(),
          fpsHistory: [],
          averageFPS: 60,
          minFPS: 60,
          maxFPS: 60
        };
        console.log('Performance metrics reset');
      }

      // ===== SPACE BACKGROUND EFFECTS METHODS =====

      createStarsBackground() {
        // Create twinkling stars similar to scene-space.css
        this.starsContainer = this.add.container(0, 0);

        // Generate 40 stars with random positions and twinkling
        for (let i = 0; i < 40; i++) {

      getMemoryUsage() {
        // Get memory usage information if available (Chrome/modern browsers)
        if (performance.memory) {
          return Math.round(performance.memory.usedJSHeapSize / 1024 / 1024 * 100) / 100;
        }
        // Fallback estimation based on game objects
        const ringCount = this.ringStack ? this.ringStack.length : 0;
        const particleEstimate = 0.1; // Base particle system memory
        const ringEstimate = ringCount * 0.02; // Each ring ~0.02MB
        return Math.round((particleEstimate + ringEstimate) * 100) / 100;
      }

    // Ring sınıfı: Her çemberi, glow, 3D gölge, sweet spot ve ok ile çizer.
    class Ring {
      constructor(scene, x, y, radius, thickness, ringColor, design = {}) {
        this.scene = scene;
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.thickness = thickness;
        this.ringColor = ringColor || 0x00ffff;
        this.graphics = scene.add.graphics({ x: x, y: y });
        this.sweetSpotAngle = Phaser.Math.FloatBetween(0, Math.PI * 2);
        this.debugText = null;
        this.design = design;
        this.pulseDirection = 1;
        this.pulseMagnitude = 0;
        this.inputReceived = false;
        this.movementEnabled = design.ringMovement || false;
        this.movementSpeed = design.ringSpeed || 0.0005;
        this.needsUpdate = this.movementEnabled || design.pulsingRings;
        this.proximityEffect = false; // For Pluto proximity interactions

        // Performance: Pre-calculate frequently used values
        this.arcWidth = Phaser.Math.DegToRad(this.design.sweetSpotSize || 15);
        this.arrowCosCache = Math.cos(this.sweetSpotAngle);
        this.arrowSinCache = Math.sin(this.sweetSpotAngle);
        this.isDirty = true;
        this.hasDrawn = false;

        if (this.scene.debugMode) {
          this.debugText = this.scene.add.text(this.x, this.y, '', { font: '12px Arial', fill: '#ff0000' }).setOrigin(0.5);
        }
        this.draw();
      }

      draw() {
        // Only clear if necessary - check if ring actually changed
        if (!this.isDirty && this.hasDrawn) return;

        this.graphics.clear();

        // Professional cartoon-style ring drawing with gradients and effects

        // Simplified color variations without Chroma.js
        const brightColorInt = this.ringColor | 0x444444; // Simple brightening
        const darkColorInt = this.ringColor & 0xBBBBBB; // Simple darkening

        // Draw shadow/depth effect
        this.graphics.fillStyle(0x000000, 0.4);
        this.graphics.fillCircle(4, 4, this.radius + 2);

        // Draw outer glow (enhanced if proximity effect is active)
        const glowAlpha = this.proximityEffect ? 0.4 : 0.15;
        const glowColor = this.proximityEffect ? 0xffd700 : this.ringColor;
        this.graphics.lineStyle(this.thickness + 8, glowColor, glowAlpha);
        this.graphics.strokeCircle(0, 0, this.radius);

        // Draw gradient ring with cartoon style
        this.graphics.lineStyle(this.thickness + 2, darkColorInt, 0.8);
        this.graphics.strokeCircle(0, 0, this.radius);

        // Inner bright highlight
        this.graphics.lineStyle(this.thickness - 4, brightColorInt, 0.9);
        this.graphics.strokeCircle(0, 0, this.radius);

        // Core ring color
        this.graphics.lineStyle(this.thickness - 8, this.ringColor, 1.0);
        this.graphics.strokeCircle(0, 0, this.radius);

        // Draw sweet spot with enhanced cartoon style - simplified
        const sweetSpotColorInt = 0xFFFFFF;

        // Sweet spot outer glow
        this.graphics.lineStyle(this.thickness + 4, sweetSpotColorInt, 0.3);
        this.graphics.beginPath();
        this.graphics.arc(0, 0, this.radius, this.sweetSpotAngle - this.arcWidth, this.sweetSpotAngle + this.arcWidth, false);
        this.graphics.strokePath();

        // Sweet spot main area
        this.graphics.lineStyle(this.thickness, sweetSpotColorInt, 0.9);
        this.graphics.beginPath();
        this.graphics.arc(0, 0, this.radius, this.sweetSpotAngle - this.arcWidth, this.sweetSpotAngle + this.arcWidth, false);
        this.graphics.strokePath();

        // Enhanced cartoon arrow with 3D effect
        const arrowX = this.arrowCosCache * (this.radius - this.thickness - 8);
        const arrowY = this.arrowSinCache * (this.radius - this.thickness - 8);

        // Arrow shadow
        this.graphics.fillStyle(0x000000, 0.4);
        this.graphics.beginPath();
        this.graphics.moveTo(arrowX + 2, arrowY + 2);
        this.graphics.lineTo(arrowX - 6, arrowY - 8);
        this.graphics.lineTo(arrowX + 10, arrowY - 8);
        this.graphics.closePath();
        this.graphics.fillPath();

        // Arrow main body with gradient effect
        this.graphics.fillStyle(sweetSpotColorInt, 1);
        this.graphics.beginPath();
        this.graphics.moveTo(arrowX, arrowY);
        this.graphics.lineTo(arrowX - 8, arrowY - 12);
        this.graphics.lineTo(arrowX + 8, arrowY - 12);
        this.graphics.closePath();
        this.graphics.fillPath();

        // Arrow highlight
        this.graphics.fillStyle(0xFFFFAA, 0.8);
        this.graphics.beginPath();
        this.graphics.moveTo(arrowX, arrowY);
        this.graphics.lineTo(arrowX - 4, arrowY - 8);
        this.graphics.lineTo(arrowX + 4, arrowY - 8);
        this.graphics.closePath();
        this.graphics.fillPath();

        // Arrow outline for definition
        this.graphics.lineStyle(2, 0x000000, 0.6);
        this.graphics.beginPath();
        this.graphics.moveTo(arrowX, arrowY);
        this.graphics.lineTo(arrowX - 8, arrowY - 12);
        this.graphics.lineTo(arrowX + 8, arrowY - 12);
        this.graphics.closePath();
        this.graphics.strokePath();

        this.hasDrawn = true;
        this.isDirty = false;

        if (this.debugText) {
          this.debugText.setText('Angle: ' + Math.round(Phaser.Math.RadToDeg(this.sweetSpotAngle)));
        }
      }

      update(delta) {
        let needsRedraw = false;

        if (this.movementEnabled) {
          const oldAngle = this.sweetSpotAngle;
          this.sweetSpotAngle += this.movementSpeed * delta;
          if (this.sweetSpotAngle > Math.PI * 2) this.sweetSpotAngle -= Math.PI * 2;

          // Only redraw if angle changed significantly
          if (Math.abs(oldAngle - this.sweetSpotAngle) > 0.005) {
            // Update cached trigonometric values
            this.arrowCosCache = Math.cos(this.sweetSpotAngle);
            this.arrowSinCache = Math.sin(this.sweetSpotAngle);
            this.isDirty = true;
            needsRedraw = true;
          }
        }

        if (this.design.pulsingRings) {
          const oldMagnitude = this.pulseMagnitude;
          this.pulseMagnitude += this.pulseDirection * 0.001 * delta;
          if (this.pulseMagnitude > 0.05 || this.pulseMagnitude < -0.05) this.pulseDirection *= -1;

          // Only update scale if magnitude changed significantly
          if (Math.abs(oldMagnitude - this.pulseMagnitude) > 0.001) {
            this.graphics.scaleX = 1 + this.pulseMagnitude;
            this.graphics.scaleY = 1 + this.pulseMagnitude;
          }
        }

        if (needsRedraw) {
          this.draw();
        }

        // Set needsUpdate flag for next frame
        this.needsUpdate = this.movementEnabled || this.design.pulsingRings;
      }

      destroy() {
        this.graphics.destroy();
        if (this.debugText) this.debugText.destroy();
      }
    }

    // Patrol mode implementation
    let patrolMode = false;

    function startPatrolMode() {
      patrolMode = true;
      showPlutoSpeech("Devriye modunda! Alanı kontrol ediyorum! 🔍👮‍♂️");

      const patrolPoints = [
        { x: -800, y: -600, wait: 2000, message: "Sol üst kontrol ediliyor..." },
        { x: 800, y: -600, wait: 1500, message: "Sağ üst temiz!" },
        { x: 800, y: 600, wait: 2000, message: "Sağ alt güvenli!" },
        { x: -800, y: 600, wait: 1500, message: "Sol alt kontrol edildi!" },
        { x: -50, y: -50, wait: 3000, message: "Merkeze dönüyorum!" }
      ];

      let currentPoint = 0;

      function patrolNext() {
        if (!patrolMode || currentPoint >= patrolPoints.length) {
          currentPoint = 0;
          if (patrolMode) {
            setTimeout(patrolNext, 2000); // Wait before starting next patrol
          }
          return;
        }

        const point = patrolPoints[currentPoint];
        const plutoContainer = document.getElementById('game-pluto-container');
        const plutoBody = plutoContainer?.querySelector('.scene_titan');

        if (plutoBody) {
          // Move to patrol point
          plutoBody.style.animation = 'none';
          plutoBody.style.transition = 'transform 2s ease-in-out';
          plutoBody.style.transform = `translate(${point.x}%, ${point.y}%) scale(0.8)`;

          // Show patrol message
          setTimeout(() => {
            showPlutoSpeech(point.message);
          }, 1000);

          // Wait at point then move to next
          setTimeout(() => {
            currentPoint++;
            patrolNext();
          }, point.wait);
        }
      }

      patrolNext();
    }

    function stopPatrolMode() {
      patrolMode = false;
      if (patrolInterval) {

        patrolInterval = null;

      // Return to center

      const plutoBody = plutoContainer?.querySelector('.scene_titan');

      if (plutoBody) {

          plutoBody.style.transition = '';

        }, 1000);
      }

      showPlutoSpeech("Devriye tamamlandı! 🏠");
    }

      plutoSpeechBubble.className = 'pluto-speech-bubble';

      // Add to page
      document.body.appendChild(plutoSpeechBubble);

      // Show with animation

      }, 100);

      // Hide after 4 seconds

        if (plutoSpeechBubble) {

          setTimeout(() => {
            if (plutoSpeechBubble) {
              plutoSpeechBubble.remove();
              plutoSpeechBubble = null;
            }
          }, 300);
        }
      }, 4000);

    // Simple, reliable game initialization
    window.addEventListener('load', function () {
      // Wait a moment for everything to be ready
      setTimeout(() => {
        const loadingElement = document.getElementById('loading');
        if (loadingElement) {
          loadingElement.style.display = 'none';
        }

        // Initialize Pluto test system
        setupTestPanel();
        addAdvancedAnimations();

        // Create the game
        const game = new Phaser.Game(config);

        // Handle window resize for fullscreen support
        window.addEventListener('resize', () => {
          game.scale.resize(window.innerWidth, window.innerHeight);
        });

        // Welcome message from Pluto after game loads
        setTimeout(() => {
          testPlutoSpeech('greeting');
        }, 2000);
      }, 500);
    });
